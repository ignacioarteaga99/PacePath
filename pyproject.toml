[project]
name = "pacepath"
version = "0.1.0"
description = "PacePath — la ruta para el entrenamiento de hoy, por calles reales"
requires-python = ">=3.12"
dependencies = [
  # El motor (RaceEngine) no va aquí: se instala desde vendor/ (un wheel de un
  # commit fijo, ver vendor/README.md), porque su repositorio es privado y
  # Render no tiene cómo bajarlo de GitHub. Los cambios al motor van a RaceEngine.
  "numpy>=1.26",
  "scipy>=1.11",          # Dijkstra en C para los fondos de ida y vuelta
  "cryptography>=42",     # cookie cifrada con el acceso a Strava
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2", # registro de consultas en Postgres (Neon) para el panel /admin
  "tzdata>=2024.1",       # zona horaria de Santiago aunque la imagen no traiga /usr/share/zoneinfo
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pacepath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real: usa un grafo real de comuna descargado de la Release «graphs» (red)",
]
