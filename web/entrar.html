<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PacePath · Beta</title>
<link rel="icon" href="/icons/icono-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --a: #f2541b; --a2: #ff8a1f; --tinta: #16161a; --suave: #5d5d68; --linea: #ececf0; --error: #d03b3b; }
  html { -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; min-height: 100dvh; font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--tinta); -webkit-font-smoothing: antialiased;
    background: radial-gradient(900px 460px at 85% -80px, #ffe3d6 0, #fff 70%), #fff; }
  main { max-width: 560px; margin: 0 auto; padding: calc(22px + env(safe-area-inset-top)) 20px calc(26px + env(safe-area-inset-bottom)); }
  em { font-style: normal; background: linear-gradient(90deg, var(--a), var(--a2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .marca { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -.3px; }
  .marca svg { width: 34px; height: 34px; }
  .idioma { border: 1px solid var(--linea); background: #fff; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 700; color: var(--suave); cursor: pointer; }
  .tag { display: inline-flex; align-items: center; gap: 7px; margin-top: 30px; font-size: 11.5px; font-weight: 800; letter-spacing: 1.2px;
    text-transform: uppercase; color: #b8400f; background: #fff1ea; border: 1px solid #ffd9c7; padding: 5px 11px; border-radius: 999px; }
  .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--a); animation: late 1.6s ease-in-out infinite; }
  @keyframes late { 50% { opacity: .25; } }
  h1 { font-size: clamp(32px, 9vw, 44px); line-height: 1.04; letter-spacing: -1.4px; font-weight: 800; margin-top: 14px; }
  .sub { font-size: 15.5px; line-height: 1.5; color: var(--suave); margin-top: 14px; }
  .sub b { color: var(--tinta); }

  .pista { position: relative; margin: 22px -20px 0; height: 132px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .pista canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .pista small { position: absolute; left: 20px; top: 4px; font-size: 11px; color: #a0a0aa; }

  form { margin-top: 18px; background: #fff; border: 1px solid var(--linea); border-radius: 18px; padding: 18px;
    box-shadow: 0 14px 34px rgba(20, 20, 30, .07); display: grid; gap: 12px; }
  label { display: grid; gap: 5px; font-size: 13px; font-weight: 700; color: var(--suave); }
  input { font: inherit; font-size: 16px; color: var(--tinta); border: 1px solid #dcdce2; border-radius: 12px; padding: 12px 13px; background: #fff; width: 100%; }
  .clave-caja { position: relative; }
  .clave-caja input { padding-right: 48px; }
  .ojo { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; padding: 8px;
    border: 0; background: none; color: var(--suave); cursor: pointer; border-radius: 10px; }
  .ojo svg { width: 22px; height: 22px; display: block; }
  .ojo .cerrado, .ojo[aria-pressed="true"] .abierto { display: none; }
  .ojo[aria-pressed="true"] .cerrado { display: inline; }
  .mal .prov { margin-top: 10px; }
  input:focus { outline: 2px solid color-mix(in srgb, var(--a) 35%, transparent); border-color: var(--a); }
  button.entrar { font: inherit; font-size: 16px; font-weight: 800; color: #fff; border: 0; border-radius: 12px; padding: 13px;
    background: linear-gradient(90deg, var(--a), var(--a2)); cursor: pointer; }
  button.entrar:disabled { opacity: .6; cursor: default; }
  .mal { color: var(--error); font-size: 13.5px; min-height: 1.2em; text-align: center; }
  .datos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .datos span { font-size: 12px; font-weight: 700; color: #b8400f; padding: 5px 10px; border-radius: 999px; background: #fff; border: 1px solid #ffd9c7; }
  footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--linea); display: flex; flex-wrap: wrap; gap: 6px 14px;
    justify-content: space-between; font-size: 12.5px; color: var(--suave); }
  footer a { color: var(--suave); }
  footer nav { display: flex; gap: 12px; }
  [hidden] { display: none !important; }
  @media (min-width: 700px) { main { padding-top: 48px; } .pista { margin: 26px 0 0; } .pista small { left: 0; } }
  .mal:empty { display: none; }
  .tarjeta { margin-top: 18px; background: #fff; border: 1px solid var(--linea); border-radius: 18px; padding: 18px;
    box-shadow: 0 14px 34px rgba(20, 20, 30, .07); display: grid; gap: 12px; }
  .tarjeta form { margin: 0; padding: 0; border: 0; box-shadow: none; }
  .prov { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; font: inherit; font-size: 15.5px;
    font-weight: 700; color: var(--tinta); background: #fff; border: 1px solid #dcdce2; border-radius: 12px; padding: 12px; cursor: pointer; text-decoration: none; }
  .prov svg { width: 20px; height: 20px; flex: none; }
  .o { display: flex; align-items: center; gap: 10px; color: #a0a0aa; font-size: 12.5px; }
  .o:before, .o:after { content: ""; flex: 1; height: 1px; background: var(--linea); }
  .pestanas { display: flex; gap: 4px; background: #f3f3f6; border-radius: 12px; padding: 3px; }
  .pestanas button { flex: 1; font: inherit; font-size: 14px; font-weight: 700; color: var(--suave); background: none; border: 0; border-radius: 9px; padding: 8px; cursor: pointer; }
  .pestanas button.on { background: #fff; color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .espera { text-align: center; display: grid; gap: 10px; }
  .espera b { font-size: 17px; }
  .espera p { color: var(--suave); font-size: 14.5px; line-height: 1.5; }
  .enlace { font: inherit; font-size: 13.5px; color: var(--suave); background: none; border: 0; text-decoration: underline; cursor: pointer; justify-self: center; }
  .nota { color: var(--suave); font-size: 14px; line-height: 1.45; }
  .mal.ok { color: #0b8a0b; }
  .sec { font: inherit; font-size: 14px; font-weight: 700; color: var(--suave); background: none; border: 1px solid var(--linea); border-radius: 12px; padding: 10px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <header>
    <div class="marca"><svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#f2541b"/><path d="M7.5 19.5c0-4 4-4 5.5-6.5s-1.5-4.5 0-6.5c.7-.8 1.6-1 2.5-1" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="7.5" cy="19.5" r="2.2" fill="#fff"/><circle cx="18.6" cy="5.6" r="2.1" fill="none" stroke="#fff" stroke-width="1.8"/></svg>PacePath</div>
    <button class="idioma" id="idioma" type="button"></button>
  </header>

  <span class="tag"><i></i><span data-t="tag"></span></span>
  <h1 data-t="h1"></h1>
  <p class="sub" data-t="sub"></p>

  <div class="pista" id="pista" role="img"><canvas id="lienzo"></canvas><small data-t="toca"></small></div>

  <div class="tarjeta" id="ingreso">
    <a class="prov" id="conGoogle" href="/api/auth/google" hidden><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span data-t="google"></span></a>
    <a class="prov" id="conMicrosoft" href="/api/auth/microsoft" hidden><svg viewBox="0 0 21 21" aria-hidden="true"><path fill="#f25022" d="M1 1h9v9H1z"/><path fill="#7fba00" d="M11 1h9v9h-9z"/><path fill="#00a4ef" d="M1 11h9v9H1z"/><path fill="#ffb900" d="M11 11h9v9h-9z"/></svg><span data-t="microsoft"></span></a>
    <div class="o" id="separador" hidden><span data-t="o"></span></div>
    <div class="pestanas" role="tablist"><button type="button" id="tabEntrar" class="on" data-t="entrar"></button><button type="button" id="tabCrear" data-t="crear"></button></div>
    <form id="form">
      <label id="campoNombre" hidden><span data-t="nombre"></span><input id="nombre" name="name" autocomplete="name" maxlength="80"></label>
      <label><span data-t="correo"></span><input id="correo" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required></label>
      <label><span data-t="clave"></span><div class="clave-caja"><input id="clave" name="password" type="password" autocomplete="current-password" required minlength="8"><button type="button" class="ojo" aria-pressed="false" data-t-aria="verClave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="abierto" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle class="abierto" cx="12" cy="12" r="3"/><path class="cerrado" d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.3 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div></label>
      <button class="entrar" type="submit" id="boton" data-t="entrar"></button>
      <div class="mal" id="mal" role="alert"></div>
      <button class="enlace" type="button" id="olvide" data-t="olvide" hidden></button>
    </form>
  </div>
  <form class="tarjeta" id="recuperar" hidden>
    <b data-t="recTitulo"></b>
    <p class="nota" data-t="recTexto"></p>
    <label><span data-t="correo"></span><input id="recCorreo" type="email" autocomplete="email" autocapitalize="none" required></label>
    <button class="entrar" type="submit" data-t="recBoton"></button>
    <div class="mal ok" id="recMsg" role="status"></div>
    <button class="enlace" type="button" id="recVolver" data-t="volver"></button>
  </form>
  <form class="tarjeta" id="nuevaClave" hidden>
    <b data-t="nuevaTitulo"></b>
    <label><span data-t="clave"></span><div class="clave-caja"><input id="nueva" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="ojo" aria-pressed="false" data-t-aria="verClave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="abierto" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle class="abierto" cx="12" cy="12" r="3"/><path class="cerrado" d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.3 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div></label>
    <button class="entrar" type="submit" data-t="nuevaBoton"></button>
    <div class="mal" id="nuevaMsg" role="alert"></div>
  </form>
  <div class="tarjeta espera" id="esperando" hidden>
    <b id="hola"></b>
    <p id="esperaTexto"></p>
    <button class="sec" type="button" id="reenviar" data-t="reenviar" hidden></button>
    <div class="mal ok" id="esperaMsg" role="status"></div>
    <button class="sec" type="button" id="salir" data-t="salir"></button>
  </div>

  <div class="datos" id="datos"></div>

  <footer>
    <span><b>pacepathapp.com</b> · <span data-t="hecho"></span></span>
    <nav><a href="/beta" data-t="guia"></a><a href="/privacidad" data-t="privacidad"></a><a href="/terminos" data-t="terminos"></a></nav>
  </footer>
</main>
<script>
// ── Textos (español / inglés) ──
const T = {
  es: { tag: "Beta privada", h1: "La ruta perfecta para tu entrenamiento <em>de hoy</em>.",
    sub: "PacePath está en <b>beta</b>: mientras la afinamos, sólo entran los testers. Entra con tu cuenta; si te invitaron, usa el correo con que te invitaron.",
    subAbierta: "Entra o crea tu cuenta para armar la ruta de tu entrenamiento.",
    espera: "Tu cuenta ya está creada, pero todavía no está habilitada para la beta. Avísale a PacePath con el correo de tu cuenta y te habilitamos.",
    esperaCorreo: "Te mandamos un correo para confirmar tu cuenta: abre el enlace y vuelve aquí.",
    esperaCorreoBeta: "Te mandamos un correo para confirmar tu cuenta. PacePath está en beta privada: después de confirmarla quedas en la lista de espera, y te avisamos por correo apenas te habilitemos.",
    reenviar: "Mandar el correo de nuevo", reenviado: "Listo: revisa tu correo (y la carpeta de spam).",
    olvide: "¿Olvidaste tu clave?", recTitulo: "Recuperar tu clave",
    recTexto: "Escribe el correo de tu cuenta y te mandamos un enlace para elegir una clave nueva.",
    recBoton: "Mandar enlace", recEnviado: "Si hay una cuenta con ese correo, te llegará un enlace en unos minutos.",
    volver: "Volver", nuevaTitulo: "Elige tu clave nueva", nuevaBoton: "Guardar y entrar",
    verificado: "¡Listo! Tu correo quedó confirmado.", codigo_invalido: "El enlace venció o ya se usó: pide uno nuevo.",
    toca: "Toca para saltar", google: "Continuar con Google", microsoft: "Continuar con Microsoft", o: "o con tu correo",
    entrar: "Entrar", crear: "Crear cuenta", nombre: "Nombre", correo: "Correo", clave: "Clave (mínimo 8 caracteres)", verClave: "Mostrar clave", ocultarClave: "Ocultar clave",
    entrando: "Un momento…", red: "No pude conectar. Prueba de nuevo en unos segundos.",
    hola: "Hola, {n}",
    salir: "Cerrar sesión", cancelada: "Cancelaste el inicio de sesión.", fallo: "No se pudo iniciar sesión. Prueba de nuevo.",
    hecho: "Hecho en Santiago de Chile", guia: "Guía beta", privacidad: "Privacidad", terminos: "Términos",
    datos: ["Series sin semáforos", "Mapa outdoor", "Tu Strava en mapa de calor"], otro: "EN",
    alt: "Dos corredores animados saltan semáforos y conos" },
  en: { tag: "Private beta", h1: "The perfect route for <em>today's</em> workout.",
    sub: "PacePath is in <b>beta</b>: while we fine-tune it, only testers can get in. Sign in with your account; if you were invited, use the email you were invited with.",
    subAbierta: "Sign in or create your account to build the route for your workout.",
    espera: "Your account is created, but it isn't enabled for the beta yet. Tell PacePath your account's email and we'll enable it.",
    esperaCorreo: "We sent you an email to confirm your account: open the link and come back here.",
    esperaCorreoBeta: "We sent you an email to confirm your account. PacePath is in private beta: after confirming you'll be on the waiting list, and we'll email you as soon as you're in.",
    reenviar: "Send the email again", reenviado: "Done: check your inbox (and spam folder).",
    olvide: "Forgot your password?", recTitulo: "Reset your password",
    recTexto: "Enter your account's email and we'll send you a link to choose a new password.",
    recBoton: "Send link", recEnviado: "If there's an account with that email, a link will arrive in a few minutes.",
    volver: "Back", nuevaTitulo: "Choose your new password", nuevaBoton: "Save and sign in",
    verificado: "Done! Your email is confirmed.", codigo_invalido: "The link expired or was already used: ask for a new one.",
    toca: "Tap to jump", google: "Continue with Google", microsoft: "Continue with Microsoft", o: "or with your email",
    entrar: "Sign in", crear: "Create account", nombre: "Name", correo: "Email", clave: "Password (at least 8 characters)", verClave: "Show password", ocultarClave: "Hide password",
    entrando: "One moment…", red: "Couldn't connect. Try again in a few seconds.",
    hola: "Hi, {n}",
    salir: "Sign out", cancelada: "You cancelled the sign-in.", fallo: "Couldn't sign in. Try again.",
    hecho: "Made in Santiago, Chile", guia: "Beta guide", privacidad: "Privacy", terminos: "Terms",
    datos: ["No-lights intervals", "Outdoor map", "Your Strava as a heatmap"], otro: "ES",
    alt: "Two animated runners jump over traffic lights and cones" },
};
const $ = (id) => document.getElementById(id);
let idioma = new URLSearchParams(location.search).get("lang");
if (!T[idioma]) { try { idioma = JSON.parse(localStorage.getItem("pp_lang")); } catch {} }
if (!T[idioma]) idioma = (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
function textos() {
  const t = T[idioma];
  document.documentElement.lang = idioma;
  document.querySelectorAll("[data-t]").forEach((e) => { e.innerHTML = t[e.dataset.t]; });
  document.querySelectorAll("[data-t-aria]").forEach((e) => { e.setAttribute("aria-label", t[e.dataset.tAria]); });
  $("datos").innerHTML = t.datos.map((d) => `<span>${d}</span>`).join("");
  $("idioma").textContent = t.otro;
  $("conGoogle").href = `/api/auth/google?lang=${idioma}`;           // los correos, en este idioma
  $("conMicrosoft").href = `/api/auth/microsoft?lang=${idioma}`;
  $("pista").setAttribute("aria-label", t.alt);
  for (const a of document.querySelectorAll("footer a")) a.href = a.getAttribute("href").split("?")[0] + "?lang=" + idioma;
}
$("idioma").onclick = () => {
  idioma = idioma === "es" ? "en" : "es";
  try { localStorage.setItem("pp_lang", JSON.stringify(idioma)); } catch {}
  textos();
  pestana(creando);
};
textos();

// ── Entrar: Google, Microsoft o correo ──
let creando = false;
function pestana(crear) {
  creando = crear;
  $("tabEntrar").classList.toggle("on", !crear); $("tabCrear").classList.toggle("on", crear);
  $("campoNombre").hidden = !crear;
  $("clave").autocomplete = crear ? "new-password" : "current-password";
  $("boton").textContent = T[idioma][crear ? "crear" : "entrar"];
  $("mal").textContent = "";
}
// Ver u ocultar la clave mientras se escribe.
for (const b of document.querySelectorAll(".ojo")) {
  b.onclick = () => {
    const input = b.previousElementSibling, ver = input.type === "password";
    input.type = ver ? "text" : "password";
    b.setAttribute("aria-pressed", String(ver));
    b.dataset.tAria = ver ? "ocultarClave" : "verClave";
    b.setAttribute("aria-label", T[idioma][b.dataset.tAria]);
    input.focus();
  };
}
$("tabEntrar").onclick = () => pestana(false);
$("tabCrear").onclick = () => pestana(true);
$("form").onsubmit = async (e) => {
  e.preventDefault();
  const t = T[idioma];
  $("boton").disabled = true; $("boton").textContent = t.entrando; $("mal").textContent = "";
  try {
    const cuerpo = { correo: $("correo").value, clave: $("clave").value };
    if (creando) cuerpo.nombre = $("nombre").value;
    const r = await fetch(creando ? "/api/auth/registro" : "/api/auth/entrar", { method: "POST",
      headers: { "Content-Type": "application/json", "X-Idioma": idioma }, body: JSON.stringify(cuerpo) });
    if (r.ok) { location.replace("/"); return; }
    const j = await r.json().catch(() => ({}));
    $("mal").textContent = j.detail?.mensaje || (Array.isArray(j.detail) ? t.fallo : j.detail) || t.fallo;
    // La cuenta se creó con Google o Microsoft: su botón, con el correo ya escrito.
    const prov = { usa_google: "conGoogle", usa_microsoft: "conMicrosoft" }[j.detail?.codigo];
    if (prov && !$(prov).hidden) {
      const b = $(prov).cloneNode(true);
      b.removeAttribute("id"); b.hidden = false;
      b.href = `${$(prov).getAttribute("href")}&correo=${encodeURIComponent($("correo").value.trim())}`;
      $("mal").append(b);
    }
  } catch { $("mal").textContent = T[idioma].red; }
  $("boton").disabled = false; $("boton").textContent = T[idioma][creando ? "crear" : "entrar"];
};
$("salir").onclick = async () => { await fetch("/api/auth/salir", { method: "POST" }).catch(() => {}); location.replace("/"); };
// Mensajes de la vuelta (?cuenta=…): de Google o Microsoft, o del enlace del correo.
const MENSAJE_VUELTA = {
  es: { correo_existe_otro_metodo: "Ya hay una cuenta con ese correo: entra con el método que usaste al crearla.",
        bloqueada: "Esta cuenta está desactivada.", sin_correo: "Tu cuenta no compartió un correo: prueba otro método." },
  en: { correo_existe_otro_metodo: "There's already an account with that email: sign in the way you created it.",
        bloqueada: "This account is disabled.", sin_correo: "Your account didn't share an email: try another method." },
};
const ver = (id) => ["ingreso", "esperando", "recuperar", "nuevaClave"].forEach((x) => { $(x).hidden = x !== id; });
const postJson = (url, cuerpo) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Idioma": idioma },
  body: cuerpo ? JSON.stringify(cuerpo) : undefined });
const mensaje = async (r) => { const j = await r.json().catch(() => ({})); return j.detail?.mensaje || T[idioma].fallo; };
$("olvide").onclick = () => { ver("recuperar"); $("recCorreo").value = $("correo").value; $("recMsg").textContent = ""; };
$("recVolver").onclick = () => ver("ingreso");
$("recuperar").onsubmit = async (e) => {
  e.preventDefault();
  const r = await postJson("/api/auth/recuperar", { correo: $("recCorreo").value }).catch(() => null);
  $("recMsg").classList.toggle("ok", !!r?.ok);
  $("recMsg").textContent = !r ? T[idioma].red : r.ok ? T[idioma].recEnviado : await mensaje(r);
};
const codigoRecuperar = new URLSearchParams(location.search).get("recuperar");
$("nuevaClave").onsubmit = async (e) => {
  e.preventDefault();
  const r = await postJson("/api/auth/nueva-clave", { codigo: codigoRecuperar, clave: $("nueva").value }).catch(() => null);
  if (r?.ok) { location.replace("/"); return; }
  $("nuevaMsg").textContent = r ? await mensaje(r) : T[idioma].red;
};
$("reenviar").onclick = async () => {
  const r = await postJson("/api/auth/reenviar").catch(() => null);
  $("esperaMsg").textContent = !r ? T[idioma].red : r.ok ? T[idioma].reenviado : await mensaje(r);
};
// Qué mostrar según la cuenta: entrar, esperar (beta o correo) o, si ya
// puede usar la app, ir a ella. Con la beta abierta, la misma portada sin
// la etiqueta «Beta privada».
(async () => {
  const q = new URLSearchParams(location.search), vuelta = q.get("cuenta");
  if (vuelta) {
    const t = T[idioma];
    $("mal").classList.toggle("ok", vuelta === "verificado");
    $("mal").textContent = t[vuelta] && ["cancelada", "verificado", "codigo_invalido"].includes(vuelta)
      ? t[vuelta] : MENSAJE_VUELTA[idioma][vuelta] || t.fallo;
    history.replaceState(null, "", location.pathname);
  }
  if (codigoRecuperar) { ver("nuevaClave"); return; }
  try {
    const c = await fetch("/api/cuenta", { headers: { "X-Idioma": idioma } }).then((r) => r.json());
    if (c.usuario && !c.pendiente) { location.replace("/"); return; }
    $("conGoogle").hidden = !c.proveedores?.google;
    $("conMicrosoft").hidden = !c.proveedores?.microsoft;
    $("separador").hidden = !(c.proveedores?.google || c.proveedores?.microsoft);
    $("olvide").hidden = !c.correo_activo;
    if (!c.beta_cerrada) {
      document.querySelector(".tag").hidden = true;
      document.querySelector('[data-t="sub"]').dataset.t = "subAbierta";
      textos();
    }
    if (c.usuario) {
      ver("esperando");
      $("hola").textContent = T[idioma].hola.replace("{n}", c.usuario.nombre || c.usuario.correo);
      const enEspera = c.beta_cerrada && !c.usuario.beta;
      $("esperaTexto").textContent = T[idioma][c.pendiente === "verificar" ? (enEspera ? "esperaCorreoBeta" : "esperaCorreo") : "espera"];
      $("reenviar").hidden = c.pendiente !== "verificar";
    }
  } catch {}
})();

// ── Los corredores (pixel art, al estilo del dinosaurio de Chrome) ──
// Mirando a la derecha. h pelo · s piel · o polera (él) · p polera (ella) ·
// x short y zapatillas. Dos cuadros por corredor: zancada y paso.
const EL = [[
  "...hhhh....",
  "..hhhhhs...",
  "..hhsssss..",
  "...sssss...",
  "....sss....",
  "...ooooo...",
  "..ooooooss.",
  ".s.ooooo...",
  "s..ooooo...",
  "...xxxxx...",
  "..xxx.xxx..",
  ".ss.....ss.",
  "ss.......s.",
  "xx.......xx",
], [
  "...hhhh....",
  "..hhhhhs...",
  "..hhsssss..",
  "...sssss...",
  "....sss....",
  "...ooooo...",
  "...oooooo..",
  "...ooooos..",
  "...soooo...",
  "...xxxxx...",
  "....xxxx...",
  "....ss.s...",
  "....s..ss..",
  "...xx...xx.",
]];
const ELLA = [[
  "....hhhh...",
  ".h.hhhhhs..",
  "hhhhhsssss.",
  ".h..sssss..",
  ".....sss...",
  "....ppppp..",
  "...ppppppss",
  "..s.ppppp..",
  ".s..ppppp..",
  "....xxxxx..",
  "...xxx.xxx.",
  "..ss.....ss",
  ".ss.......s",
  ".xx.......x",
], [
  "....hhhh...",
  "...hhhhhs..",
  "hhhhhsssss.",
  "....sssss..",
  ".....sss...",
  "....ppppp..",
  "....pppppp.",
  "....pppppps",
  "....spppp..",
  "....xxxxx..",
  ".....xxxx..",
  ".....ss.s..",
  ".....s..ss.",
  "....xx...xx",
]];
// Obstáculos: un semáforo (la app los evita) y un cono.
const SEMAFORO = ["kkk", "krk", "kkk", "kyk", "kkk", "kgk", "kkk", ".k.", ".k.", ".k.", ".k.", ".k."];
const CONO = ["..c..", "..c..", ".cwc.", ".ccc.", "cwwwc", "ccccc", "kkkkk"];
const COLOR = { h: "#2b2b31", s: "#e8a87c", o: "#f2541b", p: "#ff8a1f", x: "#2b2b31",
  k: "#3a3a42", r: "#ff3b30", y: "#ffcc00", g: "#34c759", c: "#ff7a1a", w: "#ffffff" };

const lienzo = $("lienzo"), ctx = lienzo.getContext("2d");
let P = 3, ancho = 0, alto = 0, suelo = 0;           // P: px de pantalla por pixel del dibujo
function medir() {
  const r = lienzo.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(r.width * d); lienzo.height = Math.round(r.height * d);
  P = (r.width < 420 ? 3 : 4) * d;
  ancho = Math.ceil(lienzo.width / P); alto = Math.floor(lienzo.height / P); suelo = alto - 7;
}
const dibujar = (spr, x, y) => {
  for (let f = 0; f < spr.length; f++) for (let c = 0; c < spr[f].length; c++) {
    const k = spr[f][c]; if (k === ".") continue;
    ctx.fillStyle = COLOR[k]; ctx.fillRect(Math.round(x + c) * P, Math.round(y + f) * P, P, P);
  }
};
const corredores = [
  { spr: ELLA, x: 30, y: 0, vy: 0, fase: 3 },
  { spr: EL, x: 12, y: 0, vy: 0, fase: 0 },
];
let obstaculos = [], nubes = [], piedras = [], vel = 1.3, km = 0, cuadro = 0, prox = 60;
const G = 0.24, SALTO = -3.5;
function saltar(c) { if (c.y === 0) c.vy = SALTO; }
function paso() {
  cuadro++;
  vel = Math.min(2.3, vel + 0.0004);
  km += vel * 0.00012;
  if (--prox <= 0) {                                     // el próximo obstáculo
    obstaculos.push({ spr: Math.random() < .55 ? SEMAFORO : CONO, x: ancho + 4 });
    prox = Math.round((70 + Math.random() * 90) / vel * 1.3);
  }
  if (cuadro % 160 === 1) nubes.push({ x: ancho + 2, y: 3 + Math.random() * 12, v: .25 + Math.random() * .2 });
  if (cuadro % 9 === 0) piedras.push({ x: ancho + 1, y: suelo + 2 + Math.floor(Math.random() * 4), l: 1 + (Math.random() * 2 | 0) });
  for (const o of obstaculos) o.x -= vel;
  for (const n of nubes) n.x -= n.v;
  for (const p of piedras) p.x -= vel;
  obstaculos = obstaculos.filter((o) => o.x > -8); nubes = nubes.filter((n) => n.x > -12); piedras = piedras.filter((p) => p.x > -3);
  for (const c of corredores) {
    // Saltan solos cuando un obstáculo llega a sus pies (cada uno a su tiempo).
    const delante = obstaculos.find((o) => o.x + o.spr[0].length > c.x && o.x - (c.x + 11) < vel * 7);
    if (delante && c.y === 0) saltar(c);
    if (c.y < 0 || c.vy < 0) { c.vy += G; c.y = Math.min(0, c.y + c.vy); if (c.y === 0) c.vy = 0; }
  }
}
// Cordillera de fondo (fija para cada ancho de pantalla)
const pico = (x, l) => 1 - Math.abs((((x / l) % 2) + 2) % 2 - 1);      // diente de sierra: cumbres en punta
const cerro = (x) => 3 + 15 * pico(x, 19) * (.55 + .45 * pico(x + 7, 53)) + 3 * pico(x + 4, 6);
function pintar() {
  ctx.clearRect(0, 0, lienzo.width, lienzo.height);
  const desp = (cuadro * vel * .15) % 10000;
  ctx.fillStyle = "#f8d9ca";
  for (let x = 0; x < ancho; x++) { const h = Math.round(cerro(x + desp)); ctx.fillRect(x * P, (suelo - h) * P, P, h * P); }
  ctx.fillStyle = "#e6e9f1";                                   // nieve en las cumbres
  for (let x = 0; x < ancho; x++) { const h = Math.round(cerro(x + desp)); if (h >= 13) ctx.fillRect(x * P, (suelo - h) * P, P, Math.min(3, h - 12) * P); }
  ctx.fillStyle = "#e4e4ea";
  for (const n of nubes) { ctx.fillRect(Math.round(n.x) * P, Math.round(n.y) * P, 8 * P, P); ctx.fillRect(Math.round(n.x + 2) * P, Math.round(n.y - 1) * P, 4 * P, P); }
  ctx.fillStyle = "#3a3a42"; ctx.fillRect(0, suelo * P, lienzo.width, P);
  ctx.fillStyle = "#b9b9c2"; for (const p of piedras) ctx.fillRect(Math.round(p.x) * P, p.y * P, p.l * P, P);
  for (const o of obstaculos) dibujar(o.spr, o.x, suelo - o.spr.length);
  for (const c of corredores) {
    const cuadroSpr = c.y < 0 ? 0 : Math.floor((cuadro + c.fase) / 7) % 2;
    dibujar(c.spr[cuadroSpr], c.x, suelo - c.spr[0].length + c.y);
  }
  // los km, como el puntaje del dinosaurio
  const texto = km.toFixed(2).replace(".", idioma === "es" ? "," : ".") + " km";
  ctx.fillStyle = "#8a8a94"; ctx.font = `700 ${Math.round(4 * P)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  ctx.textAlign = "right"; ctx.textBaseline = "top"; ctx.fillText(texto, lienzo.width - 6 * P, 2 * P);
}
let ultimo = 0, sobra = 0;
function bucle(t) {
  sobra = Math.min(sobra + (ultimo ? t - ultimo : 16.7), 100); ultimo = t;
  while (sobra >= 16.7) { paso(); sobra -= 16.7; }
  pintar();
  requestAnimationFrame(bucle);
}
const quieto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
medir();
window.addEventListener("resize", medir);
if (quieto) {                                                  // sin animación: una escena fija
  for (let i = 0; i < 400; i++) paso();
  pintar();
} else {
  $("pista").addEventListener("pointerdown", () => corredores.forEach(saltar));
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !/INPUT|BUTTON/.test(document.activeElement?.tagName || "")) { e.preventDefault(); corredores.forEach(saltar); }
  });
  requestAnimationFrame(bucle);
}
</script>
