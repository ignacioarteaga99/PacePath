<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PacePath</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  :root {
    --acento: #f2541b; --acento-osc: #c9410f; --tinta: #1d1d21; --suave: #6b6b75;
    --linea: #e6e6ea; --fondo: #ffffff; --gris: #f5f5f7; --ok: #1f9d55;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--tinta);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  #mapa { position: fixed; inset: 0; background: #eef0ec; }

  /* Barra superior */
  header { position: fixed; z-index: 1000; top: 0; left: 0; right: 0; background: #fff;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--linea); }
  .marca { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px;
    letter-spacing: -.3px; }
  .marca svg { width: 26px; height: 26px; }
  .marca small { margin-left: auto; font-weight: 600; font-size: 13px; color: var(--suave);
    text-transform: capitalize; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px;
    scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--linea); background: #fff; color: var(--tinta);
    border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .chip.on { background: var(--tinta); border-color: var(--tinta); color: #fff; }
  .campo { position: relative; display: flex; gap: 8px; margin-top: 8px; }
  .campo label { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 12px; font-weight: 700; color: var(--suave); pointer-events: none; }
  /* 16 px: con menos, Safari iOS hace zoom al enfocar. */
  .campo input { flex: 1; min-width: 0; font-size: 16px; padding: 11px 12px 11px 62px;
    border-radius: 12px; border: 1px solid var(--linea); background: var(--gris); color: var(--tinta); }
  .campo input:focus { outline: 2px solid #f7c5b2; background: #fff; }
  button { font: inherit; font-size: 16px; border: 0; border-radius: 12px; padding: 11px 16px;
    font-weight: 700; background: var(--acento); color: #fff; cursor: pointer; white-space: nowrap; }
  button:active { background: var(--acento-osc); }
  button.sec { background: var(--gris); color: var(--tinta); }
  button.icono { display: flex; align-items: center; gap: 6px; padding: 11px 12px; font-size: 14px; }
  button.icono svg { width: 18px; height: 18px; }
  button:disabled { opacity: .55; }
  #sugerencias { position: absolute; top: 100%; left: 0; right: 0; z-index: 5; margin-top: 4px;
    background: #fff; border: 1px solid var(--linea); border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); display: none; }
  #sugerencias button { display: block; width: 100%; text-align: left; background: #fff;
    color: var(--tinta); border-radius: 0; font-weight: 500; font-size: 15px; padding: 11px 14px;
    border-bottom: 1px solid var(--linea); }
  #sugerencias button small { color: var(--suave); margin-left: 6px; text-transform: capitalize; }
  #sugerencias button:last-child { border-bottom: 0; }

  .modos { display: grid; grid-template-columns: 1fr 1fr; background: var(--gris); border-radius: 10px;
    padding: 3px; margin-top: 10px; }
  .modos button { background: transparent; color: var(--suave); font-size: 14px; padding: 7px; border-radius: 8px; }
  .modos button.on { background: #fff; color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .trazar { display: none; gap: 8px; margin-top: 8px; align-items: center; }
  body.modo-trazar .trazar { display: flex; }
  body.modo-trazar .solo-sesion { display: none; }
  body.modo-trazar #hoja { max-height: 28vh; }
  .interruptor { display: flex; align-items: center; gap: 8px; flex: 1; font-size: 14px; font-weight: 600; }
  .interruptor input { width: 22px; height: 22px; accent-color: var(--acento); }
  .num { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid var(--acento);
    color: var(--acento); font: 700 11px/18px -apple-system, sans-serif; text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .num.primero { background: var(--tinta); border-color: #fff; color: #fff; }

  /* Hoja inferior */
  #hoja { position: fixed; z-index: 1000; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 58px); background: #fff;
    border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.10);
    padding: 8px 16px 14px; max-height: 36vh; overflow-y: auto; }
  .asa { width: 38px; height: 5px; border-radius: 3px; background: #d5d5db; margin: 0 auto 10px; }
  .tipo { color: var(--acento); font-weight: 800; font-size: 12px; letter-spacing: .6px;
    text-transform: uppercase; }
  h2 { margin: 2px 0 2px; font-size: 20px; letter-spacing: -.3px; }
  .donde { color: var(--suave); font-size: 14px; margin-bottom: 10px; }
  .cifras { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--linea);
    border-bottom: 1px solid var(--linea); padding: 10px 0; }
  .cifra span { display: block; color: var(--suave); font-size: 12px; }
  .cifra b { font-size: 20px; letter-spacing: -.3px; }
  .cifra b.cero { color: var(--ok); }
  .perfil { margin: 10px 0 2px; }
  .perfil svg { width: 100%; height: 56px; display: block; }
  .perfil small { color: var(--suave); font-size: 12px; }
  .texto p { margin: 8px 0; font-size: 14px; }
  .aviso { background: #fff6e5; border-radius: 10px; padding: 8px 10px; color: #8a5a00; font-size: 13px; }
  .fila { display: flex; gap: 8px; margin-top: 12px; }
  .fila button { flex: 1; }
  .pista { color: var(--suave); margin: 4px 0; }
  .cargando { display: flex; align-items: center; gap: 10px; color: var(--suave); padding: 6px 0; }
  .rueda { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #f7c5b2;
    border-top-color: var(--acento); animation: g .8s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }

  /* Barra de pestañas */
  nav { position: fixed; z-index: 1001; left: 0; right: 0; bottom: 0; background: #fff;
    border-top: 1px solid var(--linea); display: flex;
    padding: 6px 0 calc(env(safe-area-inset-bottom) + 6px); }
  nav a { flex: 1; text-align: center; color: var(--suave); font-size: 11px; font-weight: 600;
    text-decoration: none; }
  nav a svg { width: 24px; height: 24px; display: block; margin: 0 auto 2px; }
  nav a.on { color: var(--acento); }

  .leaflet-control-attribution { font-size: 10px; }
  .pin { width: 16px; height: 16px; border-radius: 50%; border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin.salida { width: 22px; height: 22px; background: var(--tinta); display: grid; place-items: center; }
  .pin.salida::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
</style>
</head>
<body>
<div id="mapa"></div>

<header>
  <div class="marca">
    <svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#f2541b"/>
      <path d="M6 18 L11 8 L14 14 L16.5 10 L20 18" fill="none" stroke="#fff" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/></svg>
    PacePath <small id="comuna"></small>
  </div>
  <div class="modos" role="tablist">
    <button type="button" class="on" id="modo-sesion">Ruta para mi sesión</button>
    <button type="button" id="modo-trazar">Trazar a mano</button>
  </div>
  <div class="chips solo-sesion" id="chips">
    <button class="chip on" type="button" data-t="6x1k">Series</button>
    <button class="chip" type="button" data-t="tempo 8k">Tempo</button>
    <button class="chip" type="button" data-t="fondo 18k">Fondo largo</button>
    <button class="chip" type="button" data-t="cuestas 8x300 6%">Cuestas</button>
    <button class="chip" type="button" data-t="regenerativo 6k">Regenerativo</button>
  </div>
  <form id="form" autocomplete="off">
    <div class="campo">
      <label for="desde">Desde</label>
      <input id="desde" placeholder="Calle, esquina o lugar" aria-label="Desde dónde sales">
      <button class="sec icono" id="cerca" type="button" aria-label="Cerca de mí">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        Cerca de mí</button>
      <div id="sugerencias"></div>
    </div>
    <div class="campo solo-sesion">
      <label for="texto">Sesión</label>
      <input id="texto" value="6x1k" aria-label="Sesión de hoy" placeholder="6x1k · tempo 8k · fondo 18k">
      <button id="armar" type="submit">Crear ruta</button>
    </div>
    <div class="trazar">
      <label class="interruptor"><input type="checkbox" id="volver" checked> Volver a la salida</label>
      <button class="sec" type="button" id="deshacer">Deshacer</button>
      <button class="sec" type="button" id="borrar">Borrar</button>
    </div>
  </form>
</header>

<div id="hoja">
  <div class="asa"></div>
  <p class="pista">Elige desde dónde sales: escribe una calle o esquina, usa «Cerca de mí» o toca el mapa.</p>
</div>

<nav>
  <a class="on" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-10 3 6 2.5-4L20 18"/></svg>Hoy</a>
  <a href="#" data-pronto="Mi ciudad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mi ciudad</a>
  <a href="#" data-pronto="Perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</a>
</nav>

<script src="/vendor/leaflet/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const mapa = L.map("mapa", { zoomControl: false, zoomSnap: 0.25 }).setView([-33.4258, -70.61], 14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap",
}).addTo(mapa);

let salida = null, marcaSalida = null, capas = L.layerGroup().addTo(mapa), animacion = null;
const hoja = (html) => { $("hoja").innerHTML = '<div class="asa"></div>' + html; };
const pin = (clase, color) => L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11],
  html: `<div class="pin ${clase}" style="${color ? "background:" + color : ""}"></div>` });

// ── Desde dónde se sale ─────────────────────────────────────────────────────
function fijarSalida(lat, lon, nombre, centrar = false) {
  if (modo === "trazar") {
    // En el modo trazar, buscar o «Cerca de mí» fija el primer punto (la salida).
    $("desde").value = nombre || "";
    if (puntos.length) puntos[0] = [lat, lon]; else puntos.push([lat, lon]);
    salida = { lat, lon };
    pintarPuntos();
    if (centrar) mapa.setView([lat, lon], 15);
    return puntos.length > 1 ? recalcular(null) : hoja('<p class="pista">Salida marcada. Toca el mapa para agregar puntos.</p>');
  }
  salida = { lat, lon };
  $("desde").value = nombre || `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  if (marcaSalida) marcaSalida.setLatLng([lat, lon]);
  else {
    marcaSalida = L.marker([lat, lon], { icon: pin("salida"), draggable: true, zIndexOffset: 1000 }).addTo(mapa);
    marcaSalida.on("dragend", () => { const p = marcaSalida.getLatLng(); fijarSalida(p.lat, p.lng, "Punto en el mapa"); });
  }
  if (centrar) mapa.setView([lat, lon], 15);
  capas.clearLayers();
  hoja('<p class="pista">Salida lista. Elige la sesión y pulsa «Crear ruta». Puedes arrastrar el punto.</p>');
}
mapa.on("click", (e) => modo === "trazar" ? agregarPunto(e.latlng.lat, e.latlng.lng)
                                         : fijarSalida(e.latlng.lat, e.latlng.lng, "Punto en el mapa"));

$("cerca").onclick = () => {
  if (!navigator.geolocation) return hoja('<p class="aviso">Este navegador no da la ubicación: escribe una calle o toca el mapa.</p>');
  hoja('<div class="cargando"><div class="rueda"></div>Buscando tu ubicación…</div>');
  navigator.geolocation.getCurrentPosition(
    (p) => fijarSalida(p.coords.latitude, p.coords.longitude, "Mi ubicación", true),
    () => hoja('<p class="aviso">No pude leer tu ubicación (revisa el permiso). Escribe una calle o toca el mapa.</p>'),
    { enableHighAccuracy: true, timeout: 10000 });
};

let busqueda = 0;
$("desde").addEventListener("input", () => {
  const q = $("desde").value.trim(), yo = ++busqueda;
  if (q.length < 3) { $("sugerencias").style.display = "none"; return; }
  setTimeout(async () => {
    if (yo !== busqueda) return;
    const r = await fetch("/api/lugares?q=" + encodeURIComponent(q)).then((x) => x.json()).catch(() => []);
    if (yo !== busqueda) return;
    $("sugerencias").innerHTML = r.length
      ? r.map((l, i) => `<button type="button" data-i="${i}">${esc(l.nombre)}<small>${esc(l.comuna.replace("_", " "))}</small></button>`).join("")
      : '<button type="button" disabled>Sin resultados: prueba «Pocuro con Tobalaba» o toca el mapa</button>';
    $("sugerencias").style.display = "block";
    for (const b of $("sugerencias").querySelectorAll("button[data-i]")) {
      b.onclick = () => { const l = r[+b.dataset.i]; $("sugerencias").style.display = "none";
                          fijarSalida(l.lat, l.lon, l.nombre, true); };
    }
  }, 200);
});
$("desde").addEventListener("blur", () => setTimeout(() => { $("sugerencias").style.display = "none"; }, 200));

// ── Trazar a mano ───────────────────────────────────────────────────────────
// Cada toque agrega un punto; el servidor une los puntos por la calle. La
// salida es el primer punto y, con «Volver a la salida», también la meta.
let modo = "sesion", puntos = [], marcasPuntos = L.layerGroup().addTo(mapa), pedidoTrazado = 0, ultimoTrazado = null;

function cambiarModo(m) {
  modo = m;
  document.body.classList.toggle("modo-trazar", m === "trazar");
  $("modo-sesion").classList.toggle("on", m === "sesion");
  $("modo-trazar").classList.toggle("on", m === "trazar");
  capas.clearLayers(); marcasPuntos.clearLayers();
  if (marcaSalida) { marcaSalida.remove(); marcaSalida = null; }
  puntos = salida && m === "trazar" ? [[salida.lat, salida.lon]] : [];
  if (m === "trazar") { pintarPuntos();
    hoja('<p class="pista">Toca el mapa para ir marcando por dónde quieres pasar. El primer punto es la salida; puedes arrastrar cualquier punto.</p>'); }
  else { salida = null; hoja('<p class="pista">Elige desde dónde sales: escribe una calle o esquina, usa «Cerca de mí» o toca el mapa.</p>'); }
}
$("modo-sesion").onclick = () => cambiarModo("sesion");
$("modo-trazar").onclick = () => cambiarModo("trazar");

function pintarPuntos() {
  marcasPuntos.clearLayers();
  puntos.forEach((p, i) => {
    const m = L.marker(p, { draggable: true, zIndexOffset: 900, icon: L.divIcon({ className: "",
      iconSize: [22, 22], iconAnchor: [11, 11], html: `<div class="num ${i ? "" : "primero"}">${i ? i + 1 : "S"}</div>` }) });
    m.on("dragend", () => { const q = m.getLatLng(); puntos[i] = [q.lat, q.lng]; recalcular(null); });
    m.addTo(marcasPuntos);
  });
}

function agregarPunto(lat, lon) {
  puntos.push([lat, lon]);
  salida = { lat: puntos[0][0], lon: puntos[0][1] };
  pintarPuntos();
  recalcular(Math.max(0, puntos.length - 2));
}

async function recalcular(animarDesde) {
  if (puntos.length < 2) { capas.clearLayers(); return; }
  const yo = ++pedidoTrazado;
  const r = await fetch("/api/trazar", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ puntos: puntos.map(([lat, lon]) => ({ lat, lon })), volver: $("volver").checked }) });
  const j = await r.json();
  if (yo !== pedidoTrazado) return;
  if (!r.ok) { puntos.pop(); pintarPuntos(); return hoja(`<p class="aviso">${esc(j.detail || "No pude unir ese punto.")}</p>`); }
  ultimoTrazado = j;
  $("comuna").textContent = j.comuna.replace("_", " ");
  mostrarTrazado(j);
  if (animarDesde == null) dibujarEstatico(j); else dibujarAnimado(j, () => marcas(j), animarDesde);
}

function mostrarTrazado(j) {
  const r = j.recorrido;
  hoja(`<div class="tipo">Ruta trazada · ${j.volver ? "vuelve a la salida" : "termina en el último punto"}</div>
    <h2>${km(r.distancia_m)}</h2>
    <div class="donde">${esc((r.calles || []).slice(0, 3).join(" · "))}</div>
    <div class="cifras">${[[km(r.distancia_m), "Distancia"], [r.semaforos, "Semáforos"],
      [r.cruces_menores + r.cruces_mayores, "Cruces"], [num(r.subida_m) + " m", "Subida"]].map(([v, e]) =>
      `<div class="cifra"><span>${e}</span><b class="${v === 0 ? "cero" : ""}">${v}</b></div>`).join("")}</div>
    ${perfilSvg(j)}
    <div class="fila"><button id="gpx" type="button">Descargar GPX</button></div>`);
  $("gpx").onclick = async () => {
    const r2 = await fetch("/api/trazar.gpx", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ puntos: puntos.map(([lat, lon]) => ({ lat, lon })), volver: $("volver").checked }) });
    if (!r2.ok) return;
    Object.assign(document.createElement("a"), { href: URL.createObjectURL(await r2.blob()), download: "pacepath-trazado.gpx" }).click();
  };
}

$("volver").onchange = () => recalcular(Math.max(0, puntos.length - 2));
$("deshacer").onclick = () => { puntos.pop(); pintarPuntos(); if (puntos.length < 2) { capas.clearLayers(); hoja('<p class="pista">Toca el mapa para seguir marcando.</p>'); } else recalcular(null); };
$("borrar").onclick = () => { puntos = []; salida = null; pintarPuntos(); capas.clearLayers();
  hoja('<p class="pista">Toca el mapa para marcar la salida.</p>'); };

for (const c of document.querySelectorAll(".chip")) {
  c.onclick = () => {
    document.querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === c));
    $("texto").value = c.dataset.t;
  };
}
for (const a of document.querySelectorAll("nav a[data-pronto]")) {
  a.onclick = (e) => { e.preventDefault();
    hoja(`<p class="pista">${a.dataset.pronto}: llega al conectar Strava (las calles que ya corriste y las que te faltan).</p>`); };
}

const num = (x, d = 0) => x.toLocaleString("es-CL", { minimumFractionDigits: d, maximumFractionDigits: d });
const km = (m) => m >= 1000 ? num(m / 1000, m < 10000 ? 2 : 1) + " km" : num(m) + " m";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TIPOS = { series: "Series", cuestas: "Cuestas", tempo: "Tempo", fondo: "Fondo largo", regenerativo: "Regenerativo" };

// ── Estilo de cada parte ────────────────────────────────────────────────────
const TROTE = { color: "#3d5a80", weight: 4, opacity: .85, dashArray: "1 8", lineCap: "round" };
const FUERTE = { color: "#f2541b", weight: 7, opacity: 1, lineCap: "round" };
const ESTILO = { calentamiento: TROTE, vuelta_calma: TROTE,
                 recuperacion: { color: "#3d5a80", weight: 3, opacity: .6 } };
const estilo = (tipo) => ESTILO[tipo] || FUERTE;

// ── Dibujar la ruta como si se trazara ──────────────────────────────────────
// Las partes se recorren en orden de carrera a velocidad constante, con un
// punto a la cabeza. Las repeticiones sobre el mismo tramo se trazan una sola
// vez: repetirlas sólo alargaría la espera.
function partesParaDibujar(plan) {
  const vistas = new Set(), out = [];
  for (const p of plan.partes) {
    const c = p.coordenadas;
    if (!c?.length) continue;
    if (["serie", "tempo", "recuperacion"].includes(p.tipo)) {
      const clave = [c[0], c.at(-1)].map((x) => x[0].toFixed(4) + "," + x[1].toFixed(4)).sort().join("|");
      if (vistas.has(clave)) continue;
      vistas.add(clave);
    }
    out.push(p);
  }
  return out;
}

function distM(a, b) {
  const k = Math.cos(a[0] * Math.PI / 180);
  return Math.hypot((b[0] - a[0]) * 111195, (b[1] - a[1]) * 111195 * k);
}

function dibujarEstatico(plan) {
  if (animacion) cancelAnimationFrame(animacion);
  capas.clearLayers();
  for (const p of partesParaDibujar(plan)) L.polyline(p.coordenadas.map((c) => [c[0], c[1]]), estilo(p.tipo)).addTo(capas);
  marcas(plan);
}

function dibujarAnimado(plan, alTerminar, desde = 0) {
  if (animacion) cancelAnimationFrame(animacion);
  capas.clearLayers();
  const todas = partesParaDibujar(plan);
  // Lo ya dibujado antes se pinta de una vez; sólo lo nuevo se traza.
  for (const p of todas.slice(0, desde)) L.polyline(p.coordenadas.map((c) => [c[0], c[1]]), estilo(p.tipo)).addTo(capas);
  const partes = todas.slice(desde);
  if (!partes.length) return alTerminar?.();
  const largo = (c) => c.reduce((t, p, i) => i ? t + distM(c[i - 1], p) : 0, 0);
  const total = partes.reduce((s, p) => s + largo(p.coordenadas), 0);
  const duracion = Math.min(3500, 1400 + total / 6);       // ms
  const cabeza = L.circleMarker(partes[0].coordenadas[0], { radius: 7, color: "#fff", weight: 3,
                                fillColor: "#f2541b", fillOpacity: 1 }).addTo(capas);
  let i = 0, j = 1, recorrido = 0, t0 = null;
  let linea = L.polyline([partes[0].coordenadas[0]], estilo(partes[0].tipo)).addTo(capas);
  function paso(t) {
    t0 ??= t;
    const meta = (t - t0) / duracion * total;
    while (i < partes.length && recorrido <= meta) {
      const c = partes[i].coordenadas;
      if (j >= c.length) {
        if (++i < partes.length) { j = 1; linea = L.polyline([partes[i].coordenadas[0]], estilo(partes[i].tipo)).addTo(capas); }
        continue;
      }
      recorrido += distM(c[j - 1], c[j]);
      linea.addLatLng([c[j][0], c[j][1]]);
      cabeza.setLatLng([c[j][0], c[j][1]]);
      j++;
    }
    if (i < partes.length) animacion = requestAnimationFrame(paso);
    else { animacion = null; cabeza.remove(); alTerminar?.(); }
  }
  animacion = requestAnimationFrame(paso);
}

function marcas(plan) {
  const t = plan.tramo;
  if (t) {
    L.marker(t.inicio, { icon: pin("", "#f2541b") }).addTo(capas).bindPopup("Inicio de la repetición");
    L.marker(t.fin, { icon: pin("", "#1d1d21") }).addTo(capas).bindPopup("Fin de la repetición");
  }
  for (const m of plan.marcas || []) {
    if (m.tipo === "extremo") continue;
    // En un fondo o regenerativo, un punto por cruce tapa la ruta: sólo agua.
    if (plan.recorrido && m.tipo !== "agua") continue;
    const color = { semaforo: "#d62828", cruce: "#f4a100", agua: "#1c7ed6" }[m.tipo] || "#666";
    L.circleMarker(m.punto, { radius: 5, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1 })
      .addTo(capas).bindPopup(esc(m.texto) + (m.a_m != null ? ` · km ${num(m.a_m / 1000, 1)}` : ""));
  }
}

function encuadrar(plan) {
  const pts = plan.partes.flatMap((p) => (p.coordenadas || []).map((c) => [c[0], c[1]]));
  if (!pts.length) return;
  const arriba = document.querySelector("header").offsetHeight + 16;
  const abajo = $("hoja").offsetHeight + document.querySelector("nav").offsetHeight + 16;
  mapa.fitBounds(L.latLngBounds(pts), { paddingTopLeft: [24, arriba], paddingBottomRight: [24, abajo], animate: false });
}

// ── Hoja de resultados ──────────────────────────────────────────────────────
function cifrasDe(plan) {
  const r = plan.tramo || plan.bloque || plan.recorrido;
  const cruces = (r.cruces_menores || 0) + (r.cruces_mayores || 0);
  const primera = plan.tramo ? [km(plan.tramo.largo_m), plan.sesion.tipo === "tempo" ? "Tramo" : "Repetición"]
                             : [km(r.distancia_m), plan.bloque ? "Bloque" : "Distancia"];
  const ultima = plan.sesion.tipo === "cuestas" ? [num(Math.abs(plan.tramo.pendiente_pct), 1) + " %", "Pendiente"]
               : r.desnivel_m != null ? [num(r.desnivel_m) + " m", "Desnivel"] : [num(r.subida_m) + " m", "Subida"];
  return [primera, [r.semaforos, "Semáforos"], [cruces, "Cruces"], ultima];
}

function perfilSvg(plan) {
  const pts = [];
  let d = 0, prev = null;
  for (const p of plan.partes) for (const c of p.coordenadas || []) {
    if (prev) d += distM(prev, c);
    pts.push([d, c[2]]); prev = c;
  }
  if (pts.length < 2 || d <= 0) return "";
  const zs = pts.map((p) => p[1]), lo = Math.min(...zs), hi = Math.max(...zs), W = 320, H = 56;
  const x = (v) => v / d * W, y = (z) => H - 4 - (z - lo) / Math.max(hi - lo, 5) * (H - 10);
  const linea = pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  return `<div class="perfil"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${linea}L${W},${H}L0,${H}Z" fill="#fde3d8"/><path d="${linea}" fill="none" stroke="#f2541b" stroke-width="1.6"/></svg>
    <small>Perfil · ${num(lo)}–${num(hi)} m s. n. m.</small></div>`;
}

function mostrar(plan) {
  const r = plan.tramo || plan.bloque || plan.recorrido;
  const calles = r.calles?.length ? r.calles.slice(0, 3).join(" · ") : "";
  hoja(`<div class="tipo">${TIPOS[plan.sesion.tipo]} · ${km(plan.totales.distancia_m)} en total</div>
    <h2>${esc(plan.sesion.resumen)}</h2>
    <div class="donde">${esc(calles)}</div>
    <div class="cifras">${cifrasDe(plan).map(([v, e]) =>
      `<div class="cifra"><span>${e}</span><b class="${v === 0 ? "cero" : ""}">${v}</b></div>`).join("")}</div>
    ${perfilSvg(plan)}
    <div class="texto">${plan.explicacion.map((l) => `<p>${esc(l)}</p>`).join("")}
    ${plan.avisos.slice(0, -1).map((a) => `<p class="aviso">${esc(a)}</p>`).join("")}</div>
    <div class="fila"><button id="gpx" type="button">Descargar GPX</button>
      <button class="sec" id="otra" type="button">Cambiar salida</button></div>`);
  $("gpx").onclick = descargarGpx;
  $("otra").onclick = () => { capas.clearLayers(); $("desde").focus(); $("desde").select();
    hoja('<p class="pista">Escribe otra calle, usa «Cerca de mí» o toca el mapa.</p>'); };
}

function pedido() { return { lat: salida.lat, lon: salida.lon, texto: $("texto").value }; }

async function descargarGpx() {
  const r = await fetch("/api/ruta.gpx", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify(pedido()) });
  if (!r.ok) return;
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await r.blob()),
                                                         download: "pacepath.gpx" });
  a.click();
}

$("form").onsubmit = async (e) => {
  e.preventDefault();
  document.activeElement?.blur();
  if (!salida) return hoja('<p class="aviso">Primero elige desde dónde sales: escribe una calle, usa «Cerca de mí» o toca el mapa.</p>');
  $("armar").disabled = true;
  hoja('<div class="cargando"><div class="rueda"></div>Buscando la mejor ruta para tu sesión…</div>');
  try {
    const r = await fetch("/api/ruta", { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify(pedido()) });
    const j = await r.json();
    if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "No pude armar la ruta.");
    $("comuna").textContent = j.comuna.replace("_", " ");
    mostrar(j);
    encuadrar(j);
    dibujarAnimado(j, () => marcas(j));
  } catch (err) {
    hoja(`<p class="aviso">${esc(err.message)}</p>`);
  } finally { $("armar").disabled = false; }
};
</script>
</body>
</html>
