<title>PacePath</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='7' fill='%23f2541b'/%3E%3Cpath d='M7.5 19.5c0-4 4-4 5.5-6.5s-1.5-4.5 0-6.5c.7-.8 1.6-1 2.5-1' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='7.5' cy='19.5' r='2.2' fill='%23fff'/%3E%3Ccircle cx='18.6' cy='5.6' r='2.1' fill='none' stroke='%23fff' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  :root {
    --acento: #f2541b; --acento-osc: #c9410f; --tinta: #1d1d21; --suave: #6b6b75;
    --linea: #e6e6ea; --fondo: #ffffff; --gris: #f5f5f7; --ok: #1f9d55;
    --panel: #ffffff; --sombra: rgba(0,0,0,.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--tinta);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  #mapa { position: fixed; inset: 0; background: #eef0ec; }

  /* Barra superior */
  header { position: fixed; z-index: 1000; top: 0; left: 0; right: 0; background: var(--panel);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--linea); }
  .marca { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px;
    letter-spacing: -.3px; }
  .marca svg { width: 26px; height: 26px; }
  .marca small { margin-left: auto; font-weight: 600; font-size: 13px; color: var(--suave);
    text-transform: capitalize; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px;
    scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--linea); background: var(--panel); color: var(--tinta);
    border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .chip.on { background: var(--tinta); border-color: var(--tinta); color: var(--panel); }
  .campo { position: relative; display: flex; gap: 8px; margin-top: 8px; }
  .campo label { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 12px; font-weight: 700; color: var(--suave); pointer-events: none; }
  /* 16 px: con menos, Safari iOS hace zoom al enfocar. */
  .campo input { flex: 1; min-width: 0; font-size: 16px; padding: 11px 12px 11px 62px;
    border-radius: 12px; border: 1px solid var(--linea); background: var(--gris); color: var(--tinta); }
  .campo input:focus { outline: 2px solid #f7c5b2; background: var(--panel); }
  button { font: inherit; font-size: 16px; border: 0; border-radius: 12px; padding: 11px 16px;
    font-weight: 700; background: var(--acento); color: #fff; cursor: pointer; white-space: nowrap; }
  button:active { background: var(--acento-osc); }
  button.sec { background: var(--gris); color: var(--tinta); }
  button.icono { display: flex; align-items: center; gap: 6px; padding: 11px 12px; font-size: 14px; }
  button.icono svg { width: 18px; height: 18px; }
  button:disabled { opacity: .55; }
  .sugerencias { position: absolute; top: 100%; left: 0; right: 0; z-index: 5; margin-top: 4px;
    background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); display: none; }
  .sugerencias button { display: block; width: 100%; text-align: left; background: var(--panel);
    color: var(--tinta); border-radius: 0; font-weight: 500; font-size: 15px; padding: 11px 14px;
    border-bottom: 1px solid var(--linea); }
  .sugerencias button small { color: var(--suave); margin-left: 6px; text-transform: capitalize; }
  .sugerencias button:last-child { border-bottom: 0; }

  .modos { display: grid; grid-template-columns: 1fr 1fr; background: var(--gris); border-radius: 10px;
    padding: 3px; margin-top: 10px; }
  .modos button { background: transparent; color: var(--suave); font-size: 14px; padding: 7px; border-radius: 8px; }
  .modos button.on { background: var(--panel); color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .trazar { display: none; gap: 8px; margin-top: 8px; align-items: center; }
  body.modo-trazar .trazar { display: flex; }
  body.modo-trazar .solo-sesion { display: none; }
  body.modo-trazar #hoja { max-height: 28vh; }
  .continuo { display: none; gap: 8px 12px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .radio { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  /* Opciones plegables: en el teléfono el mapa no se achica por ellas */
  .opciones { margin-top: 6px; }
  body.modo-trazar .opciones { display: none; }
  .opciones summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 700; padding: 4px 0; min-width: 0; }
  .opciones summary::-webkit-details-marker { display: none; }
  .opciones summary::after { content: "▾"; margin-left: auto; color: var(--suave); transition: transform .2s; }
  .opciones[open] summary::after { transform: rotate(180deg); }
  #resumenOpciones { color: var(--suave); font-weight: 500; font-size: 13px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* Forma: auto (lo mejor), circuito (cerrar un círculo) o vueltas a un circuito */
  .forma { display: none; align-items: center; gap: 2px; background: var(--gris); border-radius: 10px; padding: 2px; }
  body.volver:not(.modo-trazar) .forma { display: flex; }
  .forma button { background: transparent; color: var(--suave); font-size: 13px; font-weight: 600;
    padding: 6px 10px; border-radius: 8px; }
  .forma button.on { background: var(--panel); color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .forma input { display: none; width: 52px; font-size: 16px; padding: 4px 6px; border-radius: 8px;
    border: 1px solid var(--linea); background: var(--panel); color: var(--tinta); }
  body.forma-vueltas .forma input { display: block; }
  /* Series y cuestas: la sesión son las repeticiones; no hay vuelta que elegir */
  body.sesion-series .continuo .interruptor, body.sesion-series .forma,
  body.sesion-series .campo.meta { display: none !important; }
  body:not(.modo-trazar) .continuo { display: flex; }
  .campo.meta { display: none; }
  .tope { display: none; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  body.sesion-tope:not(.modo-trazar) .tope { display: flex; }
  .plano { display: none; flex: none; border: 1px solid var(--linea); background: var(--panel); color: var(--tinta);
    border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  body.sesion-tope:not(.modo-trazar) .plano { display: inline-block; }
  .plano[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tope input, .radio input { width: 84px; font-size: 16px; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--linea); background: var(--gris); color: var(--tinta); }
  body:not(.modo-trazar):not(.volver) .campo.meta { display: flex; }
  .interruptor { display: flex; align-items: center; gap: 8px; flex: 1; font-size: 14px; font-weight: 600; }
  .interruptor input { width: 22px; height: 22px; accent-color: var(--acento); }
  .num { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid var(--acento);
    color: var(--acento); font: 700 11px/18px -apple-system, sans-serif; text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .num.primero { background: #1d1d21; border-color: #fff; color: #fff; }

  /* Con una ruta en pantalla el formulario se pliega: el mapa manda. */
  .plegado { display: none; align-items: center; gap: 10px; margin-top: 10px; }
  .plegado span { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .plegado small { color: var(--suave); font-weight: 500; }
  body.con-ruta:not(.modo-trazar) .plegado { display: flex; }
  body.con-ruta:not(.modo-trazar) #form, body.con-ruta:not(.modo-trazar) .modos,
  body.con-ruta:not(.modo-trazar) .chips { display: none !important; }

  /* Hoja inferior */
  #hoja { position: fixed; z-index: 1000; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 58px); background: var(--panel);
    border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px var(--sombra);
    padding: 8px 16px 14px; max-height: 36vh; overflow-y: auto; }
  /* Asa de la hoja: tocar o arrastrar para plegar/desplegar. Zona de toque amplia. */
  .asa { display: block; width: 100%; height: 22px; margin: -8px 0 4px; padding: 0; background: var(--panel);
    border: 0; cursor: grab; touch-action: none; position: sticky; top: -8px; z-index: 5; border-radius: 0; }
  .asa::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 3px;
    background: #d5d5db; margin: 9px auto 0; }
  #hoja { transition: max-height .25s ease; }
  #hoja.arrastrando { transition: none; }
  #hoja.plegada { max-height: 92px !important; overflow: hidden; }
  .tipo { color: var(--acento); font-weight: 800; font-size: 12px; letter-spacing: .6px;
    text-transform: uppercase; }
  h2 { margin: 2px 0 2px; font-size: 20px; letter-spacing: -.3px; }
  .donde { color: var(--suave); font-size: 14px; margin-bottom: 10px; }
  .cifras { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--linea);
    border-bottom: 1px solid var(--linea); padding: 10px 0; }
  .cifra span { display: block; color: var(--suave); font-size: 12px; }
  .cifra b { font-size: 20px; letter-spacing: -.3px; }
  .cifra b.cero { color: var(--ok); }
  .perfil { margin: 12px 0 4px; }
  .perfil-cab { font-size: 13px; color: var(--suave); margin-bottom: 6px; }
  .perfil-cab b { color: var(--tinta); }
  .perfil-graf { display: flex; gap: 6px; }
  .ejey { display: flex; flex-direction: column; justify-content: space-between; font-size: 11px;
    color: var(--suave); text-align: right; min-width: 30px; padding: 2px 0; }
  .lienzo { position: relative; flex: 1; height: 80px; touch-action: none; }
  .lienzo svg { width: 100%; height: 100%; display: block; }
  .reps { position: absolute; left: 0; right: 0; top: 2px; height: 0; pointer-events: none; }
  .reps span { position: absolute; transform: translateX(-50%); font-size: 9px; font-weight: 700;
    color: var(--acento); line-height: 1; }
  .ejex { position: relative; height: 16px; margin-left: 36px; font-size: 11px; color: var(--suave); }
  .ejex span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .ejex span:last-child { transform: translateX(-100%); }
  .ejex span:first-child { transform: none; }
  .cursor { position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--tinta); display: none; }
  .globo { position: absolute; top: -4px; transform: translate(-50%, -100%); background: var(--tinta);
    color: #fff; font-size: 12px; font-weight: 600; padding: 3px 7px; border-radius: 6px;
    white-space: nowrap; display: none; }
  .texto p { margin: 8px 0; font-size: 14px; }
  .aviso { background: #fff6e5; border-radius: 10px; padding: 8px 10px; color: #8a5a00; font-size: 13px; }
  .fila { display: flex; gap: 8px; margin-top: 12px; }
  .fila button { flex: 1; }
  .pista { color: var(--suave); margin: 4px 0; }
  /* Windows no trae banderas emoji (muestra «CL», «IT»): ahí, y sólo ahí, una
     fuente con únicamente las banderas (Twemoji, CC BY 4.0). Ver SIN_BANDERAS. */
  @font-face { font-family: "Twemoji Country Flags"; src: url("/vendor/TwemojiCountryFlags.woff2") format("woff2");
    unicode-range: U+1F1E6-1F1FF, U+1F3F4, U+E0062-E0063, U+E0065, U+E0067, U+E006C, U+E006E, U+E0073-E0074, U+E0077, U+E007F;
    font-display: swap; }
  html.sin-banderas body { font-family: "Twemoji Country Flags", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  html.sin-banderas .sello, html.sin-banderas .bandera { font-family: "Twemoji Country Flags", sans-serif; }
  #sync.mal { color: var(--error, #d03b3b); }
  #sync .progreso { display: block; height: 6px; border-radius: 3px; background: var(--gris); overflow: hidden; margin-top: 6px; }
  #sync .progreso i { display: block; height: 100%; border-radius: 3px; background: var(--acento); transition: width .4s; }
  #sync .progreso.indef i { animation: indef 1.3s ease-in-out infinite; }
  @keyframes indef { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { #sync .progreso.indef i { animation: none; width: 100% !important; opacity: .4; } }
  .sync-fila { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; }
  .sync-fila .pista { flex: 1; font-size: 13px; margin: 0; }
  button.chico { padding: 5px 10px; font-size: 13px; }
  button.enlace { background: none; border: 0; padding: 6px 0; color: var(--suave); text-decoration: underline; font: inherit; font-size: 13px; cursor: pointer; }
  .cargando { display: flex; align-items: center; gap: 10px; color: var(--suave); padding: 6px 0; }
  .rueda { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #f7c5b2;
    border-top-color: var(--acento); animation: g .8s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }

  /* Barra de pestañas */
  nav { position: fixed; z-index: 1001; left: 0; right: 0; bottom: 0; background: var(--panel);
    border-top: 1px solid var(--linea); display: flex;
    padding: 6px 0 calc(env(safe-area-inset-bottom) + 6px); }
  nav a { flex: 1; text-align: center; color: var(--suave); font-size: 11px; font-weight: 600;
    text-decoration: none; }
  nav a svg { width: 24px; height: 24px; display: block; margin: 0 auto 2px; }
  nav a.on { color: var(--acento); }

  .leaflet-control-attribution { font-size: 10px; }
  .pin { width: 16px; height: 16px; border-radius: 50%; border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin.salida { width: 22px; height: 22px; background: #1d1d21; display: grid; place-items: center; }
  .pin.salida::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }

  /* ── Cabecera compacta: el mapa es lo importante ───────────────────────── */
  header { padding: calc(env(safe-area-inset-top) + 6px) 12px 8px; }
  .marca { gap: 10px; }
  .marca svg { width: 30px; height: 30px; flex: none; }
  .marca .modos { flex: 1; margin-top: 0; }
  .modos button { font-size: 13px; padding: 6px 4px; }
  .chips { margin: 8px -12px 0; padding: 0 12px; gap: 6px; }
  .chip { padding: 5px 12px; font-size: 13px; }
  .campo { margin-top: 6px; }
  .campo input { padding: 8px 10px 8px 58px; border-radius: 10px; }
  .campo label { font-size: 11px; }
  button { font-size: 15px; padding: 8px 14px; border-radius: 10px; }
  button.icono.solo { padding: 8px 10px; }
  button.icono.solo svg { width: 20px; height: 20px; }
  .continuo, .trazar { margin-top: 6px; }
  .interruptor { font-size: 13px; }
  .interruptor input { width: 18px; height: 18px; }
  /* En «trazar» el primer toque ya es la salida: el campo «Desde» sobra. */
  body.modo-trazar #form > .campo:first-child { display: none; }
  /* ── Mi ciudad ─────────────────────────────────────────────────────────── */
  body.vista-perfil #form, body.vista-perfil .modos, body.vista-perfil .chips,
  body.vista-perfil .plegado { display: none !important; }
  body.vista-perfil .titulo-perfil { display: inline; }
  .titulo-perfil { display: none; font-weight: 800; font-size: 17px; }
  /* hasta debajo de la tarjeta de idioma y día/noche (sobre la barra de abajo) */
  body.vista-perfil #hoja { max-height: calc(100dvh - var(--cab, 120px) - 180px - env(safe-area-inset-bottom)); }
  body.vista-perfil #botonCapas, body.vista-perfil #menuCapas { display: none !important; }
  body.vista-ciudad #form, body.vista-ciudad .modos, body.vista-ciudad .chips,
  body.vista-ciudad .plegado { display: none !important; }
  body.vista-ciudad .titulo-ciudad { display: inline; }
  .titulo-ciudad { display: none; font-weight: 800; font-size: 17px; }
  /* «Connect with Strava» según la guía de marca de Strava (naranja #FC4C02, 48 px). */
  .strava { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 48px;
    background: #fc4c02; color: #fff; font-weight: 700; border-radius: 6px; padding: 0 16px;
    text-decoration: none; font-size: 16px; letter-spacing: .1px; }
  .powered img { height: 14px; width: auto; display: inline-block; }
  .powered .pb-noche, body.noche .powered .pb-dia { display: none; }
  body.noche .powered .pb-noche { display: inline-block; }
  .aviso-beta { background: var(--gris); border-radius: 10px; padding: 10px 12px; font-size: 13.5px;
    color: var(--suave); margin: 10px 0 0; }
  .aviso-beta b { color: var(--tinta); }
  .pie-hoja { margin: 18px 0 2px; text-align: center; font-size: 13px; color: var(--suave); }
  .pie-hoja button, .pie-hoja a { background: none; border: 0; padding: 4px 2px; color: var(--suave);
    font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; border-radius: 0; }
  .pie-hoja button:hover, .pie-hoja a:hover { color: var(--acento); }
  #dlgComentario { border: 0; border-radius: 18px; padding: 18px; width: min(420px, calc(100vw - 32px));
    background: var(--panel); color: var(--tinta); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  #dlgComentario::backdrop { background: rgba(10,10,14,.45); }
  #dlgComentario h3 { margin: 0 0 4px; font-size: 18px; }
  #dlgComentario p { margin: 0 0 10px; color: var(--suave); font-size: 14px; }
  #dlgComentario textarea { width: 100%; min-height: 110px; font: inherit; font-size: 16px; padding: 10px 12px;
    border: 1px solid var(--linea); border-radius: 12px; background: var(--gris); color: var(--tinta); resize: vertical; }
  #dlgComentario label { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--suave); margin: 8px 0 12px; }
  #dlgComentario .fila { margin-top: 4px; }
  .wa { background: #25d366; color: #0b2e17; }
  .strava svg { width: 18px; height: 18px; }
  .credito { color: var(--suave); font-size: 12px; margin-top: 10px; text-align: center; }
  .cifras.tres { grid-template-columns: repeat(3, 1fr); }
  .prefs { margin-top: 12px; }
  /* ── Perfil ─────────────────────────────────────────────────────────────── */
  .atleta { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
  .atleta img, .atleta .sin-foto { width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
    background: var(--gris); flex: none; }
  .atleta h2 { margin: 0; }
  .atleta small { color: var(--suave); }
  /* ── Pasaporte: tarjeta oscura (igual de día y de noche) ── */
  .pasaporte { margin: 16px 0 4px; padding: 16px; border-radius: 18px; color: #fff;
    background: radial-gradient(420px 260px at 100% 0, rgba(242,84,27,.45), rgba(242,84,27,0) 70%), #17171d; }
  .pas-cab { display: flex; align-items: center; gap: 14px; }
  .nivel { flex: none; width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(#ff8a4f, #f2541b, #ffb36b, #ff8a4f); padding: 3px; }
  .nivel span { width: 100%; height: 100%; border-radius: 50%; background: #17171d; display: grid; place-items: center;
    font-size: 26px; font-weight: 800; }
  .pas-nivel { flex: 1; min-width: 0; }
  .pas-nivel small { display: block; font-size: 11px; color: rgba(255,255,255,.65); text-transform: uppercase; letter-spacing: .6px; }
  .pas-nivel b { display: block; font-size: 22px; letter-spacing: -.4px; margin: 1px 0 6px; }
  .pas-nivel small:last-child { text-transform: none; letter-spacing: 0; margin-top: 4px; }
  .xp { height: 7px; border-radius: 4px; background: rgba(255,255,255,.14); overflow: hidden; }
  .xp i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #f2541b, #ffb36b); }
  .proximo { margin: 12px 0 0; font-size: 13.5px; color: rgba(255,255,255,.85); }
  .proximo:empty { display: none; }

  const maxima = () => h.getBoundingClientRect().bottom - document.querySelector("header").getBoundingClientRect().bottom - 8;
  const modo = () => h.classList.contains("plegada") ? "plegada" : h.style.maxHeight ? "completa" : "media";
  const media = () => {          // la altura «normal» de la vista, sin tocarla
    // (sin transición: con ella, offsetHeight devuelve todavía la altura anterior)
    const st = h.style.maxHeight, pl = h.classList.contains("plegada"), ar = h.classList.contains("arrastrando");

// «plano» en la sesión = máx. 5 m de subida por km (lo interpreta el servidor).
const PLANO = /\s*\b(plano|llano|flat)\b/i;
// Forma de la ruta (volviendo a la salida). En series y cuestas las repeticiones
// van siempre por su tramo recto: ahí «circuito» hace que la vuelta vaya por
// otras calles, y «vueltas» no aplica.
let forma = pref("pp_forma", "auto");
const SERIES_TXT = /\d+\s*[x×]/i;
function ponerForma(f) {
  forma = ["auto", "circuito", "vueltas"].includes(f) ? f : "auto";
  guardarPref("pp_forma", forma);
  document.querySelectorAll(".forma button").forEach((b) => b.classList.toggle("on", b.dataset.forma === forma));
  document.body.classList.toggle("forma-vueltas", forma === "vueltas" && !SERIES_TXT.test($("texto").value));
  if ($("resumenOpciones")) resumirOpciones();
}
document.querySelectorAll(".forma button").forEach((b) => { b.onclick = () => ponerForma(b.dataset.forma); });
function formaPedida() {
  const series = SERIES_TXT.test($("texto").value);
  if (!$("volverSesion").checked || series) return {};
  if (forma === "vueltas" && !series) {
    const n = parseInt($("nVueltas").value, 10);
    return Number.isFinite(n) && n >= 2 ? { forma: "vueltas", vueltas: Math.min(n, 30) } : { forma: "circuito" };
  }
  return forma === "auto" ? {} : { forma: "circuito" };
}
// Resumen de las opciones en la fila plegada: «Vuelve · 3 vueltas · ≤ 3 km».
function resumirOpciones() {
  const volver = $("volverSesion").checked, f = formaPedida(), tope = parseFloat($("tope").value);
  const partes = SERIES_TXT.test($("texto").value) ? []
    : [volver ? t("Vuelve a la salida") : meta ? t("Hasta la meta") : t("Sin volver")];
  if (f.forma === "vueltas") partes.push(t("{n} vueltas", { n: f.vueltas }));
  else if (f.forma === "circuito") partes.push(t("Circuito"));
  if (document.body.classList.contains("sesion-tope")) {
    if (Number.isFinite(tope)) partes.push(`+${num(tope)} m`);
    else if (PLANO.test($("texto").value)) partes.push(t("Plano"));
  }
  if (radioKm()) partes.push(`≤ ${num(radioKm(), radioKm() % 1 ? 1 : 0)} km`);
  $("resumenOpciones").textContent = partes.join(" · ");
}
function revisarTipo() {
  document.body.classList.toggle("sesion-series", SERIES_TXT.test($("texto").value));
  ponerForma(forma);
  document.body.classList.toggle("sesion-tope", CON_TOPE.test($("texto").value));
  $("plano").setAttribute("aria-pressed", PLANO.test($("texto").value));
  document.body.classList.toggle("volver", $("volverSesion").checked);
  resumirOpciones();
}
for (const id of ["tope", "radioMax", "nVueltas"]) $(id).addEventListener("input", resumirOpciones);
// En computador hay espacio: las opciones parten abiertas.
if (window.matchMedia("(min-width: 900px)").matches) $("opciones").open = true;
$("texto").addEventListener("input", revisarTipo);
$("plano").onclick = () => {
  const v = $("texto").value;
  $("texto").value = PLANO.test(v) ? v.replace(PLANO, "") : `${v.trim()} ${idioma === "en" ? "flat" : "plano"}`;
  revisarTipo();
};
$("volverSesion").onchange = () => { revisarTipo(); if ($("volverSesion").checked) fijarMeta(null); };
function fijarMeta(p, nombre) {
  meta = p; eligiendoMeta = false;
  resumirOpciones();
  $("metaMapa").textContent = t("En el mapa");
  if (!p) { $("meta").value = ""; if (marcaMeta) { marcaMeta.remove(); marcaMeta = null; } return; }
  $("meta").value = nombre || t("Punto en el mapa");
  if (marcaMeta) marcaMeta.setLatLng([p.lat, p.lon]);
  else {
    marcaMeta = L.marker([p.lat, p.lon], { draggable: true, zIndexOffset: 950, icon: L.divIcon({ className: "",
      iconSize: [22, 22], iconAnchor: [11, 11], html: '<div class="num">M</div>' }) }).addTo(mapa);
    marcaMeta.on("dragend", () => { const q = marcaMeta.getLatLng(); meta = { lat: q.lat, lon: q.lng }; });
  }
}
conectarBusqueda("meta", "sugerenciasMeta", (l) => fijarMeta({ lat: l.lat, lon: l.lon }, l.nombre));
$("meta").addEventListener("input", () => { if (!$("meta").value.trim()) fijarMeta(null); });
$("metaMapa").onclick = () => { eligiendoMeta = !eligiendoMeta;
  $("metaMapa").textContent = t(eligiendoMeta ? "Toca el mapa…" : "En el mapa"); };

// ── Trazar a mano ───────────────────────────────────────────────────────────
// Cada toque agrega un punto; el servidor une los puntos por la calle. La
// salida es el primer punto y, con «Volver a la salida», también la meta.
let modo = "sesion", puntos = [], marcasPuntos = L.layerGroup().addTo(mapa), pedidoTrazado = 0, ultimoTrazado = null;

function cambiarModo(m) {
  modo = m;
  document.body.classList.toggle("modo-trazar", m === "trazar");
  pintarRadio();
  $("modo-sesion").classList.toggle("on", m === "sesion");
  $("modo-trazar").classList.toggle("on", m === "trazar");
  capas.clearLayers(); marcasPuntos.clearLayers();
  if (marcaSalida) { marcaSalida.remove(); marcaSalida = null; }
  puntos = salida && m === "trazar" ? [[salida.lat, salida.lon]] : [];
  if (m === "trazar") { pintarPuntos();
    hoja(`<p class="pista">${t("Toca el mapa para ir marcando por dónde quieres pasar. El primer punto es la salida; puedes arrastrar cualquier punto.")}</p>`); }
  else { salida = null; inicioHoja(t("Elige desde dónde sales: escribe una calle o esquina, usa «Cerca de mí» o toca el mapa.")); }
}
$("modo-sesion").onclick = () => cambiarModo("sesion");
$("modo-trazar").onclick = () => cambiarModo("trazar");

function pintarPuntos() {
  marcasPuntos.clearLayers();
  puntos.forEach((p, i) => {
    const m = L.marker(p, { draggable: true, zIndexOffset: 900, icon: L.divIcon({ className: "",
      iconSize: [22, 22], iconAnchor: [11, 11], html: `<div class="num ${i ? "" : "primero"}">${i ? i + 1 : "S"}</div>` }) });
    m.on("dragend", () => { const q = m.getLatLng(); puntos[i] = [q.lat, q.lng]; recalcular(null); });
    m.addTo(marcasPuntos);
  });
}

function agregarPunto(lat, lon) {
  puntos.push([lat, lon]);
  salida = { lat: puntos[0][0], lon: puntos[0][1] };
  pintarPuntos();
  recalcular(Math.max(0, puntos.length - 2));
}

async function recalcular(animarDesde) {
  if (puntos.length < 2) { capas.clearLayers(); return; }
  const yo = ++pedidoTrazado;
  const r = await fetch("/api/trazar", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ puntos: puntos.map(([lat, lon]) => ({ lat, lon })), volver: $("volver").checked }) });
  const j = await r.json();
  if (yo !== pedidoTrazado) return;
  if (!r.ok) { puntos.pop(); pintarPuntos(); return hoja(`<p class="aviso">${esc(j.detail || t("No pude unir ese punto."))}</p>`); }
  ultimoTrazado = j;
  $("comuna").textContent = j.comuna.replace("_", " ");
  mostrarTrazado(j);
  if (animarDesde == null) dibujarEstatico(j); else dibujarAnimado(j, () => marcas(j), animarDesde);
}

function mostrarTrazado(j) {
  const r = j.recorrido;
  hoja(`<div class="tipo">${t("Ruta trazada")} · ${t(j.volver ? "vuelve a la salida" : "termina en el último punto")}</div>
    <h2>${km(r.distancia_m)}</h2>
    <div class="donde">${esc((r.calles || []).slice(0, 3).join(" · "))}</div>
    <div class="cifras">${[[km(r.distancia_m), t("Distancia")], [r.semaforos, t("Semáforos")],
      [r.cruces_menores + r.cruces_mayores, t("Cruces")], [num(r.subida_m) + " m", t("Subida")]].map(([v, e]) =>
      `<div class="cifra"><span>${e}</span><b class="${v === 0 ? "cero" : ""}">${v}</b></div>`).join("")}</div>
    ${perfilSvg(j)}
    <div class="fila"><button id="gpx" type="button">Descargar GPX</button>
      <button class="sec" id="favorito" type="button">${t("☆ Guardar como favorito")}</button></div>`);
  $("favorito").onclick = () => {
    const nombre = prompt(t("Nombre del tramo favorito (por ejemplo, «Ribera Balmaceda–Forestal»):"));
    if (!nombre) return;
    const todos = j.partes.flatMap((x) => x.coordenadas.map((c) => [c[0], c[1]]));
    const paso = Math.max(1, Math.ceil(todos.length / 1500));
    guardarFavoritos([...favoritos(), { id: Date.now(), nombre: nombre.slice(0, 60),
      km: j.recorrido.distancia_m / 1000, puntos: todos.filter((_, i) => i % paso === 0) }]);
    $("favorito").textContent = t("★ Guardado"); $("favorito").disabled = true;
  };
  $("gpx").onclick = async () => {
    const r2 = await fetch("/api/trazar.gpx", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ puntos: puntos.map(([lat, lon]) => ({ lat, lon })), volver: $("volver").checked }) });
    if (!r2.ok) return;
    Object.assign(document.createElement("a"), { href: URL.createObjectURL(await r2.blob()), download: "pacepath-trazado.gpx" }).click();
  };
}

$("volver").onchange = () => recalcular(Math.max(0, puntos.length - 2));
$("cercaTrazar").onclick = () => $("cerca").click();
$("deshacer").onclick = () => { puntos.pop(); pintarPuntos(); if (puntos.length < 2) { capas.clearLayers(); hoja(`<p class="pista">${t("Toca el mapa para seguir marcando.")}</p>`); } else recalcular(null); };
$("borrar").onclick = () => { puntos = []; salida = null; pintarPuntos(); capas.clearLayers();
  hoja(`<p class="pista">${t("Toca el mapa para marcar la salida.")}</p>`); };

$("editar").onclick = () => { document.body.classList.remove("con-ruta"); };

for (const c of document.querySelectorAll(".chip")) {
  c.onclick = () => {
    document.querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === c));
    $("texto").value = idioma === "en" ? c.dataset.tEn : c.dataset.t;
    revisarTipo();
  };
}
for (const a of document.querySelectorAll("nav a[data-pronto]")) {
  a.onclick = (e) => { e.preventDefault();
    hoja(`<p class="pista">${t("{p}: conecta tu Strava.", { p: a.dataset.pronto })}</p>`); };
}

const num = (x, d = 0) => x.toLocaleString(idioma === "en" ? "en-US" : "es-CL", { minimumFractionDigits: d, maximumFractionDigits: d });
const km = (m) => m >= 1000 ? num(m / 1000, m < 10000 ? 2 : 1) + " km" : num(m) + " m";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TIPOS = { series: "Series", cuestas: "Cuestas", tempo: "Tempo", fondo: "Fondo largo", regenerativo: "Regenerativo" };
const tipo = (k) => t(TIPOS[k]);

// ── Estilo de cada parte ────────────────────────────────────────────────────
const TROTE = { color: "#3d5a80", weight: 4, opacity: .85, dashArray: "1 8", lineCap: "round" };
const FUERTE = { color: "#f2541b", weight: 7, opacity: 1, lineCap: "round" };
const ESTILO = { calentamiento: TROTE, vuelta_calma: TROTE,
                 recuperacion: { color: "#3d5a80", weight: 3, opacity: .6 } };
const estilo = (tipo) => ESTILO[tipo] || FUERTE;

// ── Dibujar la ruta como si se trazara ──────────────────────────────────────
// Las partes se recorren en orden de carrera a velocidad constante, con un
// punto a la cabeza. Las repeticiones sobre el mismo tramo se trazan una sola
// vez: repetirlas sólo alargaría la espera.
function partesParaDibujar(plan) {
  const vistas = new Set(), out = [];
  for (const p of plan.partes) {
    const c = p.coordenadas;
    if (!c?.length) continue;
    if (["serie", "tempo", "recuperacion"].includes(p.tipo)) {
      const clave = [c[0], c.at(-1)].map((x) => x[0].toFixed(4) + "," + x[1].toFixed(4)).sort().join("|");
      if (vistas.has(clave)) continue;
      vistas.add(clave);
    }
    out.push(p);
  }
  return out;
}

function distM(a, b) {
  const k = Math.cos(a[0] * Math.PI / 180);
  return Math.hypot((b[0] - a[0]) * 111195, (b[1] - a[1]) * 111195 * k);
}

function dibujarEstatico(plan) {
  if (animacion) cancelAnimationFrame(animacion);
  capas.clearLayers();
  for (const p of partesParaDibujar(plan)) L.polyline(p.coordenadas.map((c) => [c[0], c[1]]), estilo(p.tipo)).addTo(capas);
  marcas(plan);
}

function dibujarAnimado(plan, alTerminar, desde = 0) {
  if (animacion) cancelAnimationFrame(animacion);
  capas.clearLayers();
  const todas = partesParaDibujar(plan);
  // Lo ya dibujado antes se pinta de una vez; sólo lo nuevo se traza.
  for (const p of todas.slice(0, desde)) L.polyline(p.coordenadas.map((c) => [c[0], c[1]]), estilo(p.tipo)).addTo(capas);
  const partes = todas.slice(desde);
  if (!partes.length) return alTerminar?.();
  const largo = (c) => c.reduce((t, p, i) => i ? t + distM(c[i - 1], p) : 0, 0);
  const total = partes.reduce((s, p) => s + largo(p.coordenadas), 0);
  const duracion = Math.min(3500, 1400 + total / 6);       // ms
  const cabeza = L.circleMarker(partes[0].coordenadas[0], { radius: 7, color: "#fff", weight: 3,
                                fillColor: "#f2541b", fillOpacity: 1 }).addTo(capas);
  let i = 0, j = 1, recorrido = 0, t0 = null;
  let linea = L.polyline([partes[0].coordenadas[0]], estilo(partes[0].tipo)).addTo(capas);
  function paso(t) {
    t0 ??= t;
    const meta = (t - t0) / duracion * total;
    while (i < partes.length && recorrido <= meta) {
      const c = partes[i].coordenadas;
      if (j >= c.length) {
        if (++i < partes.length) { j = 1; linea = L.polyline([partes[i].coordenadas[0]], estilo(partes[i].tipo)).addTo(capas); }
        continue;
      }
      recorrido += distM(c[j - 1], c[j]);
      linea.addLatLng([c[j][0], c[j][1]]);
      cabeza.setLatLng([c[j][0], c[j][1]]);
      j++;
    }
    if (i < partes.length) animacion = requestAnimationFrame(paso);
    else { animacion = null; cabeza.remove(); alTerminar?.(); }
  }
  animacion = requestAnimationFrame(paso);
}

function marcas(plan) {
  const tramo = plan.tramo;
  if (tramo) {
    L.marker(tramo.inicio, { icon: pin("", "#f2541b") }).addTo(capas).bindPopup(t("Inicio de la repetición"));
    L.marker(tramo.fin, { icon: pin("", "#1d1d21") }).addTo(capas).bindPopup(t("Fin de la repetición"));
  }
  if (plan.volver === false && plan.llegada)
    L.marker(plan.llegada, { icon: L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11],
      html: '<div class="num primero">M</div>' }) }).addTo(capas).bindPopup(t("Llegada"));
  for (const m of plan.marcas || []) {
    if (m.tipo === "extremo") continue;
    // En un fondo o regenerativo, un punto por cruce tapa la ruta: sólo agua.
    if (plan.recorrido && m.tipo !== "agua") continue;
    const color = { semaforo: "#d62828", cruce: "#f4a100", agua: "#1c7ed6" }[m.tipo] || "#666";
    L.circleMarker(m.punto, { radius: 5, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1 })
      .addTo(capas).bindPopup(esc(t(m.texto)) + (m.a_m != null ? ` · km ${num(m.a_m / 1000, 1)}` : ""));
  }
}

function encuadrar(plan) {
  const pts = plan.partes.flatMap((p) => (p.coordenadas || []).map((c) => [c[0], c[1]]));
  if (!pts.length) return;
  const arriba = esEscritorio() ? 24 : document.querySelector("header").offsetHeight + 16;
  const abajo = esEscritorio() ? 24 : $("hoja").offsetHeight + document.querySelector("nav").offsetHeight + 16;
  mapa.fitBounds(L.latLngBounds(pts), { paddingTopLeft: [24, arriba], paddingBottomRight: [24, abajo], animate: false });
}

// ── Hoja de resultados ──────────────────────────────────────────────────────
function cifrasDe(plan) {
  const r = plan.tramo || plan.bloque || plan.recorrido;
  const cruces = (r.cruces_menores || 0) + (r.cruces_mayores || 0);
  const primera = plan.tramo ? [km(plan.tramo.largo_m), t(plan.sesion.tipo === "tempo" ? "Tramo" : "Repetición")]
                             : [km(r.distancia_m), t(plan.bloque ? "Bloque" : "Distancia")];
  const ultima = plan.sesion.tipo === "cuestas" ? [num(Math.abs(plan.tramo.pendiente_pct), 1) + " %", t("Pendiente")]
               : r.desnivel_m != null ? [num(r.desnivel_m) + " m", t("Desnivel")] : [num(r.subida_m) + " m", t("Subida")];
  return [primera, [r.semaforos, t("Semáforos")], [cruces, t("Cruces")], ultima];
}

// ── Altimetría ──────────────────────────────────────────────────────────────
// Eje de km, altitudes mínima y máxima, subida y bajada totales. Al deslizar el
// dedo por el gráfico se ve el km y la altitud, y un punto lo sigue en el mapa.
let perfilPts = [], perfilTotal = 0, cursorMapa = null, perfilBloques = [];
// Partes que son trabajo (cada serie, el bloque de tempo): se marcan en el perfil.
const TRABAJO = { serie: "Serie", tempo: "Tempo" };

// Series y cuestas: el perfil es sólo el bloque de repeticiones (el trote para
// llegar se ve en el mapa y su distancia en el texto).
const SOLO_BLOQUE = new Set(["series", "cuestas"]);
function perfilSvg(plan) {
  const pts = [], bloques = [];
  let d = 0, prev = null;
  const partes = SOLO_BLOQUE.has(plan.sesion?.tipo)
    ? plan.partes.filter((p) => p.tipo === "serie" || p.tipo === "recuperacion") : plan.partes;
  for (const p of partes) {
    let d0 = null;
    for (const c of p.coordenadas || []) {
      if (prev) d += distM(prev, c);
      if (d0 === null) d0 = d;
      pts.push([d, c[2], c[0], c[1]]); prev = c;
    }
    if (TRABAJO[p.tipo] && d0 !== null && d > d0) bloques.push({ tipo: p.tipo, n: p.numero, d0, d1: d });
  }
  perfilPts = pts; perfilTotal = d; perfilBloques = bloques;
  if (pts.length < 2 || d <= 0) return "";
  // Igual que el servidor: sólo cuentan cambios de más de 2 m (el ruido del
  // modelo de elevación no son repechos).
  let sube = 0, baja = 0, ref = pts[0][1];
  for (const p of pts) {
    if (p[1] - ref >= 2) { sube += p[1] - ref; ref = p[1]; }
    else if (ref - p[1] >= 2) { baja += ref - p[1]; ref = p[1]; }
  }
  const zs = pts.map((p) => p[1]), lo = Math.min(...zs), hi = Math.max(...zs);
  // Con intervalos se deja aire arriba para sus números.
  const rango = Math.max(hi - lo, 10), base = lo - rango * 0.08,
    techo = hi + rango * (bloques.length > 1 && bloques.length <= 20 ? 0.32 : 0.08);
  const W = 300, H = 80;
  const x = (v) => v / d * W, y = (z) => H - (z - base) / (techo - base) * H;
  const linea = pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const kmTot = d / 1000;
  const paso = [0.5, 1, 2, 5, 10, 20].find((p) => kmTot / p <= 5) || 50;
  let rejilla = "", etiquetas = "<span style=\"left:0\">0</span>";
  for (let k = paso; k < kmTot - paso * 0.35; k += paso) {
    rejilla += `<line x1="${x(k * 1000)}" x2="${x(k * 1000)}" y1="0" y2="${H}" stroke="#ececf0" stroke-width="1"/>`;
    etiquetas += `<span style="left:${(k / kmTot * 100).toFixed(2)}%">${num(k, paso < 1 ? 1 : 0)}</span>`;
  }
  etiquetas += `<span style="left:100%">${num(kmTot, 1)} km</span>`;
  // Intervalos: banda suave y una línea al inicio y al final de cada uno; el
  // número encima si hay espacio (hasta 20 repeticiones).
  let bandas = "", numeros = "";
  for (const b of bloques) {
    const x0 = x(b.d0).toFixed(1), x1 = x(b.d1).toFixed(1);
    bandas += `<rect x="${x0}" y="0" width="${(x1 - x0).toFixed(1)}" height="${H}" fill="#f2541b" fill-opacity=".09"/>`
      + [x0, x1].map((v) => `<line x1="${v}" x2="${v}" y1="0" y2="${H}" stroke="#f2541b" stroke-opacity=".55"
          stroke-width="1" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>`).join("");
    if (bloques.length > 1 && bloques.length <= 20)
      numeros += `<span style="left:${((b.d0 + b.d1) / 2 / d * 100).toFixed(2)}%">${b.n}</span>`;
  }
  return `<div class="perfil">
    <div class="perfil-cab">${t("Altimetría")} · <b>↑ ${num(sube)} m</b> ${t("subida")} · <b>↓ ${num(baja)} m</b> ${t("bajada")}</div>
    <div class="perfil-graf">
      <div class="ejey"><span>${num(hi)} m</span><span>${num(lo)} m</span></div>
      <div class="lienzo" id="lienzo">${numeros ? `<div class="reps">${numeros}</div>` : ""}
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${rejilla}
          <path d="${linea}L${W},${H}L0,${H}Z" fill="#fde3d8"/>${bandas}
          <path d="${linea}" fill="none" stroke="#f2541b" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>
        <div class="cursor" id="cursor"></div><div class="globo" id="globo"></div>
      </div>
    </div>
    <div class="ejex">${etiquetas}</div>
  </div>`;
}

function activarPerfil() {
  const l = $("lienzo");
  if (!l || perfilPts.length < 2) return;
  const mover = (e) => {
    const r = l.getBoundingClientRect();
    const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const objetivo = f * perfilTotal;
    let a = 0, b = perfilPts.length - 1;                 // búsqueda binaria por distancia
    while (b - a > 1) { const m = (a + b) >> 1; if (perfilPts[m][0] < objetivo) a = m; else b = m; }
    const p = perfilPts[b];
    $("cursor").style.display = $("globo").style.display = "block";
    $("cursor").style.left = $("globo").style.left = (f * 100) + "%";
    const bq = perfilBloques.find((q) => p[0] >= q.d0 && p[0] <= q.d1);
    $("globo").textContent = `km ${num(p[0] / 1000, 1)} · ${num(p[1])} m`
      + (bq ? ` · ${t(TRABAJO[bq.tipo])}${perfilBloques.length > 1 ? " " + bq.n : ""}` : "");
    if (!cursorMapa) cursorMapa = L.circleMarker([p[2], p[3]], { radius: 7, color: "#fff", weight: 3,
      fillColor: "#1d1d21", fillOpacity: 1 }).addTo(mapa);
    else cursorMapa.setLatLng([p[2], p[3]]);
  };
  const salir = () => {
    $("cursor").style.display = $("globo").style.display = "none";
    if (cursorMapa) { cursorMapa.remove(); cursorMapa = null; }
  };
  l.addEventListener("pointerdown", (e) => { l.setPointerCapture(e.pointerId); mover(e); });
  l.addEventListener("pointermove", mover);
  l.addEventListener("pointerup", salir);
  l.addEventListener("pointerleave", salir);
}

function mostrar(plan) {
  const r = plan.tramo || plan.bloque || plan.recorrido;
  const calles = r.calles?.length ? r.calles.slice(0, 3).join(" · ") : "";
  // Series y cuestas: lo que cuenta es el bloque; el trote de ida y vuelta es
  // traslado (calentamiento y vuelta a la calma) y va en la explicación.
  const bloque = plan.sesion.tipo === "series" ? `${km(plan.totales.series_m)} ${t("de series")}`
    : plan.sesion.tipo === "cuestas" ? `${km(plan.totales.series_m)} ${t("de subida")}`
    : `${km(plan.totales.distancia_m)}${plan.volver === false ? "" : " " + t("en total")}`;
  hoja(`<div class="tipo">${tipo(plan.sesion.tipo)} · ${bloque}${plan.volver === false ? " · " + t("sin volver a la salida") : ""}</div>
    <h2>${esc(plan.sesion.resumen)}</h2>
    <div class="donde">${esc(calles)}</div>
    <div class="cifras">${cifrasDe(plan).map(([v, e]) =>
      `<div class="cifra"><span>${e}</span><b class="${v === 0 ? "cero" : ""}">${v}</b></div>`).join("")}</div>
    ${perfilSvg(plan)}

    ${plan.avisos.slice(0, -1).map((a) => `<p class="aviso">${esc(a)}</p>`).join("")}</div>
    <div class="fila"><button id="gpx" type="button">${t("Descargar GPX")}</button>

      ${ultimaEntrada ? `<button class="sec" id="guardarSesion" type="button" style="flex:none;width:52px;font-size:20px"></button>` : ""}</div>`);
  $("gpx").onclick = descargarGpx;

  $("otra").onclick = () => { capas.clearLayers(); document.body.classList.remove("con-ruta");

async function pedido() {
  const p = { lat: salida.lat, lon: salida.lon, texto: $("texto").value };
  const series = SERIES_TXT.test(p.texto);
  if (!series && !$("volverSesion").checked) { p.volver = false; if (meta) p.meta = meta; }
  const tope = parseFloat($("tope").value);
  if (CON_TOPE.test(p.texto) && Number.isFinite(tope) && tope >= 0) p.max_subida_m = tope;
  if (radioKm()) p.radio_max_m = radioKm() * 1000;
  Object.assign(p, formaPedida());
  // Preferencias del corredor: viajan con cada pedido; el servidor no las guarda.
  const favs = favoritos();
  if (favs.length) p.favoritos = favs.map((f) => f.puntos);
  try {
    const f = await frecuentesPara(p.lat, p.lon);
    if (f) p.frecuentes = { version: f.version, aristas: f.aristas, veces: f.veces };
  } catch { /* sin calles de siempre: la ruta sale igual */ }
  return p;
}

async function descargarGpx() {
  const r = await fetch("/api/ruta.gpx", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify(await pedido()) });
  if (!r.ok) return;
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await r.blob()),
                                                         download: "pacepath.gpx" });
  a.click();
}

// ── Recientes y sesiones guardadas (en el teléfono) ─────────────────────────
// Se guardan los parámetros, no la geometría: el motor es determinista, así que
// repetir el pedido da la misma ruta (salvo que cambie el mapa o tus calles).
const MAX_RECIENTES = 10, MAX_GUARDADAS = 30;
const ICONO = { series: "S", tempo: "T", fondo: "F", cuestas: "C", regenerativo: "R" };
const leerLista = (k) => { const v = pref(k, []); return Array.isArray(v) ? v : []; };
let ultimaEntrada = null;
const claveSesion = (e) => [e.texto.trim().toLowerCase(), e.salida.lat.toFixed(4), e.salida.lon.toFixed(4),
  e.volver, e.meta ? e.meta.lat.toFixed(4) + "," + e.meta.lon.toFixed(4) : "", e.tope ?? "", e.radio ?? "",
  e.forma || "auto", e.vueltas || ""].join("|");
function entradaDe(p, plan) {
  const r = plan.tramo || plan.bloque || plan.recorrido || {};
  return { fecha: Date.now(), texto: p.texto, salida: { lat: p.lat, lon: p.lon, nombre: $("desde").value },
    volver: p.volver !== false, meta: p.meta || null, metaNombre: p.meta ? $("meta").value : "",
    tope: p.max_subida_m ?? null, radio: p.radio_max_m ?? null, tipo: plan.sesion.tipo,
    forma: p.forma || "auto", vueltas: p.vueltas || null,
    resumen: plan.sesion.resumen, distancia: plan.totales.distancia_m, calle: (r.calles || [])[0] || "" };
}
function guardarReciente(e) {
  const l = leerLista("pp_recientes").filter((x) => claveSesion(x) !== claveSesion(e));
  guardarPref("pp_recientes", [e, ...l].slice(0, MAX_RECIENTES));
}
const estaGuardada = (e) => leerLista("pp_guardadas").some((x) => claveSesion(x) === claveSesion(e));
function alternarGuardada(e) {
  const l = leerLista("pp_guardadas");
  if (estaGuardada(e)) { guardarPref("pp_guardadas", l.filter((x) => claveSesion(x) !== claveSesion(e))); return false; }
  if (l.length >= MAX_GUARDADAS) { alert(t("Ya tienes {n} sesiones guardadas: quita alguna primero.", { n: MAX_GUARDADAS })); return false; }
  guardarPref("pp_guardadas", [e, ...l]);

}
// Las guardadas antes de dejar de inventar la pausa traen «(pausa 90 s)».
const sinPausaInventada = (e) => /\b(r|p|pausa|rec)\s*\d/i.test(e.texto)

function itemSesion(e, i, lista) {

    : e.forma === "circuito" ? t("circuito") : "", lista === "recientes" ? fechaCorta(fecha) : ""].filter(Boolean).join(" · ");
  return `<div class="item"><button type="button" class="abrir" data-l="${lista}" data-i="${i}">

    <button type="button" class="estrella${estaGuardada(e) ? " on" : ""}" data-l="${lista}" data-i="${i}"
      aria-label="${t(estaGuardada(e) ? "Quitar de guardadas" : "Guardar sesión")}">${estaGuardada(e) ? "★" : "☆"}</button></div>`;
}
// Panel inicial: la pista y, debajo, tus sesiones guardadas y las recientes.
function inicioHoja(pista) {

function repetir(e) {

// ── Preferencias: tramos favoritos y calles de siempre ──────────────────────
// Todo vive en este teléfono. Los favoritos son rutas trazadas a mano; las
// calles de siempre las calcula el servidor a partir de tus carreras de Strava
// (una vez por comuna, sin guardarlas) y quedan aquí para adjuntarlas.
const leer = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const escribir = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const favoritos = () => leer("pp_favoritos", []);
const guardarFavoritos = (l) => escribir("pp_favoritos", l);
const usarFrecuentes = () => leer("pp_usar_frec", true);
let listaComunas = null;

async function comunaDe(lat, lon) {
  listaComunas ??= await fetch("/api/comunas").then((r) => r.json()).catch(() => []);
  let mejor = null, d0 = Infinity;
  for (const c of listaComunas) {
    const d = distM([lat, lon], [c.lat, c.lon]);
    if (d <= c.radio_m && d < d0) { mejor = c; d0 = d; }
  }
  return mejor;
}

function olvidarFrecuentes(comuna) { try { localStorage.removeItem("pp_frec_" + comuna); } catch {} }

// `siempre`: también si el corredor no quiere usarlas al crear rutas (Pasaporte).
async function frecuentesPara(lat, lon, siempre = false) {
  if (!siempre && !usarFrecuentes()) return null;
  const carreras = await BD.todas();
  if (!carreras.length) return null;
  const c = await comunaDe(lat, lon);
  if (!c) return null;
  const guardado = leer("pp_frec_" + c.id, null);
  if (guardado && guardado.n === carreras.length && guardado.calles) return guardado;
  // Sólo las carreras que empiezan en esta comuna o cerca.
  const cerca = carreras.filter((x) => {
    const p = (x.puntos ||= decodificar(x.polilinea))[0];
    return p && distM(p, [c.lat, c.lon]) <= c.radio_m + 3000;
  }).slice(-3000);
  if (!cerca.length) return null;
  const r = await fetch("/api/strava/frecuencia", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ lat, lon, polilineas: cerca.map((x) => x.polilinea) }) });
  if (!r.ok) return null;
  const j = await r.json();
  const f = { version: j.version, n: carreras.length, aristas: j.aristas, veces: j.veces, calles: j.calles || [] };
  escribir("pp_frec_" + c.id, f);
  return f;
}

// ── Mi ciudad: tus carreras de Strava como mapa de calor ────────────────────
// Las carreras se guardan en este navegador (IndexedDB) y sólo se piden las
// nuevas. El servidor no guarda nada: el acceso a Strava va en una cookie
// cifrada. Desconectar revoca el acceso en Strava y borra todo.
const BD = (() => {
  let db = null, memoria = new Map();
  const abrir = () => new Promise((ok) => {
    try {
      const r = indexedDB.open("pacepath", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("carreras", { keyPath: "id" });
      r.onsuccess = () => { db = r.result; ok(); };
      r.onerror = () => ok();
    } catch { ok(); }
  });
  const tx = (modo) => db.transaction("carreras", modo).objectStore("carreras");
  return {
    async todas() {
      if (!db) await abrir();
      if (!db) return [...memoria.values()];
      return new Promise((ok) => { const r = tx("readonly").getAll(); r.onsuccess = () => ok(r.result); r.onerror = () => ok([]); });
    },
    async guardar(lista) {
      if (!db) await abrir();
      if (!db) { lista.forEach((c) => memoria.set(c.id, c)); return; }
      await new Promise((ok) => { const t = db.transaction("carreras", "readwrite");
        lista.forEach((c) => t.objectStore("carreras").put(c)); t.oncomplete = ok; t.onerror = ok; });
    },
    async borrar() {
      memoria.clear();
      if (!db) await abrir();
      if (db) await new Promise((ok) => { const r = tx("readwrite").clear(); r.onsuccess = ok; r.onerror = ok; });
    },
  };
})();

// Polilínea codificada de Google (la que da Strava) → [[lat, lon], …]
function decodificar(str) {
  const out = []; let i = 0, lat = 0, lon = 0;
  while (i < str.length) {
    for (const k of [0, 1]) {
      let b, shift = 0, res = 0;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = res & 1 ? ~(res >> 1) : res >> 1;
      if (k === 0) lat += d; else lon += d;
    }
    out.push([lat / 1e5, lon / 1e5]);
  }
  return out;
}

// ── Capa de calor ───────────────────────────────────────────────────────────
// 1) Densidad: cada carrera se traza en un lienzo fuera de pantalla con poca
//    opacidad; donde pasan muchas, el alfa se acumula (una carrera cuenta una
//    vez aunque repita calle, porque es un solo trazo).
// 2) Color: el alfa de cada píxel se lleva a una rampa propia: rojo profundo →
//    naranjo → ámbar → casi blanco donde más corres.
// 3) Brillo: el resultado se pega con una sombra difusa del mismo tono.
const RAMPA = (() => {
  const c = document.createElement("canvas"); c.width = 256; c.height = 1;
  const x = c.getContext("2d"), gr = x.createLinearGradient(0, 0, 256, 0);
  [[0, "#4a0a14"], [0.18, "#9c1424"], [0.4, "#f2401b"], [0.62, "#ff8a1f"],
   [0.82, "#ffd166"], [1, "#fff8e1"]].forEach(([o, col]) => gr.addColorStop(o, col));
  x.fillStyle = gr; x.fillRect(0, 0, 256, 1);
  return x.getImageData(0, 0, 256, 1).data;
})();

const TICKS = [1, 2, 3, 5, 10, 20, 30, 50, 100, 200];

const CapaCalor = L.Layer.extend({
  initialize() { this.rutas = []; this.cuenta = null; },
  onAdd(m) {
    this._c = L.DomUtil.create("canvas", "leaflet-zoom-hide");
    this._c.style.pointerEvents = "none";
    m.getPanes().overlayPane.appendChild(this._c);
    m.on("moveend zoomend resize", this._dibujar, this);
    this._dibujar();
  },
  onRemove(m) {
    L.DomUtil.remove(this._c); m.off("moveend zoomend resize", this._dibujar, this);
    $("escalaCalor").hidden = true;
  },
  setRutas(r) { this.rutas = r; if (this._map) this._dibujar(); },
  // Veces que pasaste por un punto de la pantalla (0 si nunca). Mira un
  // pequeño entorno: un toque con el dedo no cae justo sobre la línea.
  vecesEn(punto) {
    const c = this.cuenta;
    if (!c) return 0;
    const x0 = Math.round(punto.x * c.r), y0 = Math.round(punto.y * c.r), rad = Math.round(10 * c.r);
    let max = 0;
    for (let y = Math.max(0, y0 - rad); y <= Math.min(c.h - 1, y0 + rad); y++)
      for (let x = Math.max(0, x0 - rad); x <= Math.min(c.w - 1, x0 + rad); x++)
        max = Math.max(max, c.datos[(y * c.w + x) * 4 + 3]);
    return max;
  },
  _dibujar() {
    const m = this._map, t = m.getSize(), r = Math.min(window.devicePixelRatio || 1, 2);
    const c = this._c;
    c.width = t.x * r; c.height = t.y * r; c.style.width = t.x + "px"; c.style.height = t.y + "px";
    L.DomUtil.setPosition(c, m.containerPointToLayerPoint([0, 0]));
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    this.cuenta = null;
    if (!this.rutas.length) { $("escalaCalor").hidden = true; return; }
    // 1) Conteo: cada carrera suma exactamente 1 en el canal ALFA de los
    //    píxeles por donde pasa (modo «lighter», alfa 1/255). En el alfa porque
    //    el lienzo guarda el color premultiplicado: en los bordes suavizados un
    //    rojo de 1 se leía de vuelta como 255. Un trazo por carrera: si repite
    //    una calle dentro de la misma carrera, cuenta una vez.
    const cont = document.createElement("canvas"); cont.width = c.width; cont.height = c.height;
    const d = cont.getContext("2d", { willReadFrequently: true });
    d.globalCompositeOperation = "lighter";
    d.lineWidth = Math.max(2, Math.min(5, 0.55 * (m.getZoom() - 9))) * r;
    d.lineCap = d.lineJoin = "round";
    d.strokeStyle = "rgba(0,0,0,0.003922)";          // 1/255
    const caja = m.getBounds().pad(0.1);
    for (const ruta of this.rutas) {
      if (!caja.intersects(ruta.caja)) continue;
      d.beginPath();
      ruta.puntos.forEach((p, i) => {
        const q = m.latLngToContainerPoint(p);
        if (i) d.lineTo(q.x * r, q.y * r); else d.moveTo(q.x * r, q.y * r);
      });
      d.stroke();
    }
    const img = d.getImageData(0, 0, cont.width, cont.height), px = img.data;
    this.cuenta = { w: cont.width, h: cont.height, r, datos: px.slice() };
    let max = 1;
    for (let i = 3; i < px.length; i += 4) if (px[i] > max) max = px[i];
    // 2) Color por veces, en escala logarítmica de 1 al máximo de esta vista.
    const lmax = Math.log(Math.max(max, 2));
    for (let i = 0; i < px.length; i += 4) {
      const n = px[i + 3];
      if (!n) continue;
      const f = 0.12 + 0.88 * Math.log(n) / lmax;
      const k = Math.min(255, Math.round(f * 255)) * 4;

    }
    d.globalCompositeOperation = "source-over";
    d.putImageData(img, 0, 0);
    // 3) Brillo
    ctx.shadowColor = "rgba(255,90,30,0.8)";
    ctx.shadowBlur = 9 * r;
    ctx.drawImage(cont, 0, 0);
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.3;
    ctx.drawImage(cont, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";

  },
  _escala(max) {
    const e = $("escalaCalor");
    e.hidden = false;
    const lmax = Math.log(Math.max(max, 2));
    const pos = (v) => (0.12 + 0.88 * Math.log(v) / lmax) * 100;
    // De arriba abajo, sólo marcas a ≥ 9 % de la barra de la anterior (no se pisan)
    const marcas = [max];
    for (const v of TICKS.filter((v) => v < max).reverse())
      if (pos(marcas[marcas.length - 1]) - pos(v) >= 9) marcas.push(v);
    e.querySelector(".marcas").innerHTML = marcas.map((v) =>
      `<span style="bottom:${pos(v).toFixed(1)}%">${v}</span>`).join("");
  },
});

async function dibujarCalor(e, aviso, encuadrar) {
  const lista = await BD.todas();
  for (const c of lista) {
    if (!c.puntos) c.puntos = decodificar(c.polilinea);
    if (!c.caja) c.caja = L.latLngBounds(c.puntos);
  }
  calor.setRutas(lista.filter((c) => c.puntos.length > 1));
  const km = lista.reduce((t, c) => t + c.distancia_m, 0) / 1000;
  const desde = lista.length ? lista.map((c) => c.fecha).sort()[0].slice(0, 10).split("-").reverse().join("-") : "–";
  hoja(`${aviso ? `<p class="aviso">${esc(aviso)}</p>` : ""}
    <div class="tipo">${t("Mi ciudad")}${e.nombre ? " · " + esc(e.nombre) : ""}</div>
    <h2>${t("Tus carreras")}</h2>
    <div class="cifras tres">
      <div class="cifra"><span>${t("Carreras")}</span><b>${num(lista.length)}</b></div>
      <div class="cifra"><span>${t("Kilómetros")}</span><b>${num(km)}</b></div>
      <div class="cifra"><span>${t("Desde")}</span><b style="font-size:15px">${desde}</b></div></div>
    <p class="pista">${t("Toca el mapa para ver cuántas veces pasaste por ahí.")}</p>
    <p class="pista" id="sync"></p>
    <div id="dondeCorri"></div>
    ${e.privadas ? "" : `<p class="aviso">${t("Sólo veo tus actividades públicas: al conectar no se dio permiso para las privadas.")}</p>`}
    ${seccionPreferencias(true)}
    <div class="fila"><button class="sec" id="actualizar" type="button">${t("Actualizar")}</button>
      <button class="sec" id="desconectar" type="button">${t("Desconectar")}</button></div>
    <button class="enlace" id="traerTodo" type="button">${t("¿Faltan carreras? Traer todo de nuevo")}</button>
    ${POWERED_STRAVA()}`);
  activarPreferencias();
  $("actualizar").onclick = () => sincronizar(e);
  $("traerTodo").onclick = () => {
    if (confirm(t("¿Volver a traer todas tus carreras de Strava? Sirve si faltan carreras antiguas; puede tardar un minuto."))) sincronizar(e, { todo: true });
  };
  pintarSync();
  $("desconectar").onclick = async () => {
    if (!confirm(t("¿Desconectar Strava? Se borran tus carreras de este teléfono y se revoca el acceso."))) return;
    await fetch("/api/strava/desconectar", { method: "POST" });
    await BD.borrar();
    Object.keys(localStorage).filter((k) => k.startsWith("pp_frec_") || ["pp_donde", "pp_lugares", "pp_logros_vistos", "pp_sync"].includes(k))
      .forEach((k) => localStorage.removeItem(k));
    abrirCiudad(t("Strava desconectado: se borraron tus datos."));
  };
  if (encuadrar && lista.length) encuadrarCalor(lista);
  pintarDondeCorri(lista);
}

// ── Dónde has corrido: países y ciudades ────────────────────────────────────
// Cada carrera se nombra por dónde empieza (celdas de ~100 m): el servidor da
// ciudad (la más importante cerca), país, continente y barrio (la comuna, con
// límites de OpenStreetMap), sin servicios externos. Quedan guardados aquí y
// se vuelven a preguntar cada semana. Lo usan esta lista y el Pasaporte.
const LUGARES_DIAS = 7;
// ¿Este sistema dibuja banderas emoji? Se escribe una en un canvas: si sale
// sin color, son las letras («CL») y se usa la fuente de banderas.
const SIN_BANDERAS = (() => {
  try {
    const g = Object.assign(document.createElement("canvas"), { width: 24, height: 24 }).getContext("2d", { willReadFrequently: true });
    g.font = "20px sans-serif"; g.fillText("\u{1F1E8}\u{1F1F1}", 0, 20);
    const d = g.getImageData(0, 0, 24, 24).data;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] && (d[i] !== d[i + 1] || d[i + 1] !== d[i + 2])) return false;
    return true;
  } catch { return false; }
})();
if (SIN_BANDERAS) document.documentElement.classList.add("sin-banderas");
const bandera = (cc) => cc && cc.length === 2
  ? String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 0x1F1E6 + c.charCodeAt(0) - 65)) : "🌐";
const nombrePais = (cc) => { try { return new Intl.DisplayNames([idioma], { type: "region" }).of(cc); }
  catch { return cc; } };
async function lugaresDeCarreras(lista) {
  const cache = pref("pp_lugares", {}) || {}, ahora = Date.now();
  const clave = (p) => `${p[0].toFixed(3)},${p[1].toFixed(3)}`;
  const deCarrera = new Map();
  for (const c of lista) { const p = (c.puntos ||= decodificar(c.polilinea))[0]; if (p) deCarrera.set(c.id, clave(p)); }
  const faltan = [...new Set(deCarrera.values())].filter((k) => !cache[k] || ahora - cache[k].t > LUGARES_DIAS * 864e5);
  for (let i = 0; i < faltan.length; i += 2000) {
    const lote = faltan.slice(i, i + 2000);
    const r = await fetch("/api/donde", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ puntos: lote.map((k) => k.split(",").map(Number)) }) }).then((x) => x.json()).catch(() => null);
    if (!Array.isArray(r)) break;
    lote.forEach((k, j) => { cache[k] = { t: ahora, l: r[j] }; });
  }
  if (faltan.length) guardarPref("pp_lugares", cache);
  return new Map([...deCarrera].map(([id, k]) => [id, cache[k]?.l || null]));
}
let lugaresCorridos = [];
async function pintarDondeCorri(lista) {
  const caja = $("dondeCorri");

  const lugares = await lugaresDeCarreras(lista);
  // Por país y ciudad.
  const paises = new Map();
  for (const c of lista) {
    const n = lugares.get(c.id) || { ciudad: null, pais: "", cerca: false };
    if (!paises.has(n.pais)) paises.set(n.pais, { pais: n.pais, ciudades: new Map(), carreras: 0, km: 0, caja: null });
    const P = paises.get(n.pais), k = (n.ciudad || "?") + (n.cerca ? "~" : "");
    if (!P.ciudades.has(k)) P.ciudades.set(k, { ciudad: n.ciudad, pais: n.pais, cerca: n.cerca, carreras: 0, km: 0, caja: null });
    const C = P.ciudades.get(k);
    c.caja ||= L.latLngBounds(c.puntos);
    for (const X of [P, C]) { X.carreras++; X.km += c.distancia_m / 1000;
      X.caja = X.caja ? X.caja.extend(c.caja) : L.latLngBounds(c.caja.getSouthWest(), c.caja.getNorthEast()); }

    .map((P) => ({ ...P, ciudades: [...P.ciudades.values()].sort((a, b) => b.carreras - a.carreras) }));
