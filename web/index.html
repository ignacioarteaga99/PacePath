async function dibujarCalor(e, aviso, encuadrar) {
  const lista = await BD.todas();
  for (const c of lista) {
    if (!c.puntos) c.puntos = decodificar(c.polilinea);
    if (!c.caja) c.caja = L.latLngBounds(c.puntos);
  }
  calor.setRutas(lista.filter((c) => c.puntos.length > 1));
  const km = lista.reduce((t, c) => t + c.distancia_m, 0) / 1000;
  const desde = lista.length ? lista.map((c) => c.fecha).sort()[0].slice(0, 10).split("-").reverse().join("-") : "–";
  hoja(`${aviso ? `<p class="aviso">${esc(aviso)}</p>` : ""}
    <div class="tipo">${t("Mis lugares")}${e.nombre ? " · " + esc(e.nombre) : ""}</div>
    <h2>${t("Tus carreras")}</h2>
    <div class="cifras tres">
      <div class="cifra"><span>${t("Carreras")}</span><b>${num(lista.length)}</b></div>
      <div class="cifra"><span>${t("Kilómetros")}</span><b>${num(km)}</b></div>
      <div class="cifra"><span>${t("Desde")}</span><b style="font-size:15px">${desde}</b></div></div>
    <p class="pista">${t("Toca el mapa para ver cuántas veces pasaste por ahí.")}</p>
    <p class="pista" id="sync"></p>
    <div id="dondeCorri"></div>
    ${e.privadas ? "" : `<p class="aviso">${t("Sólo veo tus actividades públicas: al conectar no se dio permiso para las privadas.")}</p>`}
    ${seccionPreferencias(true)}
    <div class="fila"><button class="sec" id="actualizar" type="button">${t("Actualizar")}</button>
      <button class="sec" id="desconectar" type="button">${t("Desconectar")}</button></div>
    <button class="enlace" id="traerTodo" type="button">${t("¿Faltan carreras? Traer todo de nuevo")}</button>
    ${POWERED_STRAVA()}`);
  activarPreferencias();
  $("actualizar").onclick = () => sincronizar(e);
  $("traerTodo").onclick = () => {
    if (confirm(t("¿Volver a traer todas tus carreras de Strava? Sirve si faltan carreras antiguas; puede tardar un minuto."))) sincronizar(e, { todo: true });
  };
  pintarSync();
  $("desconectar").onclick = async () => {
    if (!confirm(t("¿Desconectar Strava? Se borran tus carreras de este teléfono y se revoca el acceso."))) return;
    await fetch("/api/strava/desconectar", { method: "POST" });
    await BD.borrar();
    await BDE.borrar();
    Object.keys(localStorage).filter((k) => k.startsWith("pp_frec_") || ["pp_donde", "pp_lugares", "pp_logros_vistos", "pp_sync", "pp_revision"].includes(k))
      .forEach((k) => localStorage.removeItem(k));
    abrirCiudad(t("Strava desconectado: se borraron tus datos."));
  };
  if (encuadrar && lista.length) encuadrarCalor(lista);
  pintarDondeCorri(lista);
}

// ── Dónde has corrido: países y ciudades ────────────────────────────────────
// Cada carrera se nombra por dónde empieza (celdas de ~100 m): el servidor da
// ciudad (la más importante cerca), país, continente y barrio (la comuna, con
// límites de OpenStreetMap), sin servicios externos. Quedan guardados aquí y
// se vuelven a preguntar cada semana. Lo usan esta lista y el Pasaporte.
const LUGARES_DIAS = 7;
// ¿Este sistema dibuja banderas emoji? Se escribe una en un canvas: si sale
// sin color, son las letras («CL») y se usa la fuente de banderas.
const SIN_BANDERAS = (() => {
  try {
    const g = Object.assign(document.createElement("canvas"), { width: 24, height: 24 }).getContext("2d", { willReadFrequently: true });
    g.font = "20px sans-serif"; g.fillText("\u{1F1E8}\u{1F1F1}", 0, 20);
    const d = g.getImageData(0, 0, 24, 24).data;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] && (d[i] !== d[i + 1] || d[i + 1] !== d[i + 2])) return false;
    return true;
  } catch { return false; }
})();
if (SIN_BANDERAS) document.documentElement.classList.add("sin-banderas");
const bandera = (cc) => cc && cc.length === 2
  ? String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 0x1F1E6 + c.charCodeAt(0) - 65)) : "🌐";
const nombrePais = (cc) => { try { return new Intl.DisplayNames([idioma], { type: "region" }).of(cc); }
  catch { return cc; } };
async function lugaresDeCarreras(lista) {
  const cache = pref("pp_lugares", {}) || {}, ahora = Date.now();
  const clave = (p) => `${p[0].toFixed(3)},${p[1].toFixed(3)}`;
  const deCarrera = new Map();
  for (const c of lista) { const p = (c.puntos ||= decodificar(c.polilinea))[0]; if (p) deCarrera.set(c.id, clave(p)); }
  const faltan = [...new Set(deCarrera.values())].filter((k) => !cache[k] || ahora - cache[k].t > LUGARES_DIAS * 864e5);
  for (let i = 0; i < faltan.length; i += 2000) {
    const lote = faltan.slice(i, i + 2000);
    const r = await fetch("/api/donde", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ puntos: lote.map((k) => k.split(",").map(Number)) }) }).then((x) => x.json()).catch(() => null);
    if (!Array.isArray(r)) break;
    lote.forEach((k, j) => { cache[k] = { t: ahora, l: r[j] }; });
  }
  if (faltan.length) guardarPref("pp_lugares", cache);
  return new Map([...deCarrera].map(([id, k]) => [id, cache[k]?.l || null]));
}
let lugaresCorridos = [];
async function pintarDondeCorri(lista) {
  const caja = $("dondeCorri");
  if (!caja || !lista.length) return;
  const lugares = await lugaresDeCarreras(lista);
  // Por país y ciudad.
  const paises = new Map();
  for (const c of lista) {
    const n = lugares.get(c.id) || { ciudad: null, pais: "", cerca: false };
    if (!paises.has(n.pais)) paises.set(n.pais, { pais: n.pais, ciudades: new Map(), carreras: 0, km: 0, caja: null });
    const P = paises.get(n.pais), k = (n.ciudad || "?") + (n.cerca ? "~" : "");
    if (!P.ciudades.has(k)) P.ciudades.set(k, { ciudad: n.ciudad, pais: n.pais, cerca: n.cerca, carreras: 0, km: 0, caja: null });
    const C = P.ciudades.get(k);
    c.caja ||= L.latLngBounds(c.puntos);
    for (const X of [P, C]) { X.carreras++; X.km += c.distancia_m / 1000;
      X.caja = X.caja ? X.caja.extend(c.caja) : L.latLngBounds(c.caja.getSouthWest(), c.caja.getNorthEast()); }
  }
  lugaresCorridos = [...paises.values()].sort((a, b) => b.carreras - a.carreras)
    .map((P) => ({ ...P, ciudades: [...P.ciudades.values()].sort((a, b) => b.carreras - a.carreras) }));
  if (!$("dondeCorri")) return;
  const carr = (n) => t(n === 1 ? "{n} carrera" : "{n} carreras", { n: num(n) });
  $("dondeCorri").innerHTML = `<div class="donde-corri"><h3>${t("Dónde has corrido")}</h3>
    ${lugaresCorridos.map((P, i) => `<div class="pais">
      <button type="button" class="ir pais-fila" data-p="${i}"><span class="bandera">${bandera(P.pais)}</span>
        <b>${esc(P.pais ? nombrePais(P.pais) : t("Otros lugares"))}</b>
        <small>${carr(P.carreras)} · ${fmtDistKm(P.km, 0)}</small></button>
      ${P.ciudades.map((C, j) => `<button type="button" class="ir ciudad-fila" data-p="${i}" data-c="${j}">
        <span>${C.ciudad ? (C.cerca ? t("cerca de {c}", { c: esc(C.ciudad) }) : esc(C.ciudad)) : t("Sin ciudad cerca")}</span>
        <small>${carr(C.carreras)} · ${fmtDistKm(C.km, 0)}</small></button>`).join("")}</div>`).join("")}

  for (const b of $("dondeCorri").querySelectorAll(".ir")) b.onclick = () => {
    const P = lugaresCorridos[+b.dataset.p], X = b.dataset.c != null ? P.ciudades[+b.dataset.c] : P;
    $("dondeCorri").querySelectorAll(".ir").forEach((x) => x.classList.toggle("on", x === b));
    if (!esEscritorio()) $("hoja").classList.add("plegada");
    const encuadre = { padding: [30, 30], maxZoom: 15, paddingBottomRight: [70, esEscritorio() ? 30 : 92 + 70] };
    // Lejos (otro país): directo. Volar cruzando continentes pide teselas de
    // cada zoom intermedio y el mapa tarda en asentarse.
    if (mapa.getCenter().distanceTo(X.caja.getCenter()) > 300000) mapa.fitBounds(X.caja, { ...encuadre, animate: false });
    else mapa.flyToBounds(X.caja, { ...encuadre, duration: 1.2 });
  };
}

function encuadrarCalor(lista) {
  // Encuadrar donde corres de verdad: alrededor de la mediana de las salidas,
  // sin que una carrera en otra ciudad aleje el mapa.
  const ini = lista.map((c) => (c.puntos || (c.puntos = decodificar(c.polilinea)))[0]).filter(Boolean);
  const med = (k) => ini.map((p) => p[k]).sort((a, b) => a - b)[ini.length >> 1];
  const centro = [med(0), med(1)];
  const cerca = lista.filter((c) => distM(c.puntos[0], centro) < 25000).flatMap((c) => c.puntos);
  if (cerca.length) mapa.fitBounds(L.latLngBounds(cerca), { padding: [20, 20],
    paddingBottomRight: [70, esEscritorio() ? 20 : $("hoja").offsetHeight + 70], animate: false });
}

// Sincronización con Strava. Estado en este teléfono («pp_sync»):
//   completo: ya se trajo el historial entero (después sólo se pide lo nuevo)
//   pagina:   si la descarga del historial se cortó, por qué página seguir
//   ultima:   cuándo terminó bien la última vez · error: por qué falló la última
// Antes, si la descarga se cortaba a la mitad, las carreras antiguas no se
// pedían nunca más (sólo «lo posterior a la más nueva»).

function haceCuanto(iso) {
  const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (!(min >= 1)) return t("hace un momento");
  if (min < 60) return t("hace {n} min", { n: min });
  if (min < 48 * 60) return t("hace {n} h", { n: Math.round(min / 60) });
  return t("hace {n} días", { n: Math.round(min / 1440) });
}
function textoSync() {
  const st = leerSync();
  if (st.error) return { txt: st.pagina > 1 ? t("La descarga se cortó ({n} carreras traídas): {e} Toca «Actualizar» para seguir donde quedó.", { n: num(st.vistas || 0), e: st.error })
    : t("No pude sincronizar: {e}", { e: st.error }), mal: true };
  if (st.ultima) return { txt: t("Última sincronización con Strava: {h}.", { h: haceCuanto(st.ultima) }), mal: false };
  return { txt: "", mal: false };
}
// progreso: undefined = sin barra; null = barra sin porcentaje; 0–100 = barra.
let ultimoProgreso = null;
function pintarSync(txt, mal, progreso) {
  const el = $("sync");
  if (!el) return;
  if (txt === undefined) {
    if (sincronizando && ultimoProgreso) ({ txt, progreso } = ultimoProgreso);     // la vista se repintó a mitad
    else ({ txt, mal } = sincronizando ? { txt: t("Sincronizando con Strava…"), mal: false } : textoSync());
  }
  el.innerHTML = `<span>${esc(txt)}</span>` + (progreso === undefined ? ""
    : `<span class="progreso${progreso === null ? " indef" : ""}" role="progressbar"${progreso === null ? "" : ` aria-valuenow="${progreso}"`}><i style="width:${progreso ?? 30}%"></i></span>`);

  || Date.now() - Date.parse(st.ultima) > SYNC_AUTO_MIN * 60000; };

// Una página de actividades, con reintentos cuando el servidor está despertando
// o Strava falla un momento (no ante «espera» ni «vuelve a conectar»).
async function paginaStrava(pagina, despues) {
  const url = `/api/strava/actividades?pagina=${pagina}${despues ? "&despues=" + despues : ""}`;
  let ultimoError;
  for (const espera of [0, 2500, 6000]) {
    if (espera) await new Promise((ok) => setTimeout(ok, espera));
    let r;
    try { r = await fetch(url); } catch { ultimoError = new Error(t("Sin conexión con PacePath.")); continue; }
    const j = await r.json().catch(() => null);          // Render despertando responde HTML
    if (r.ok && j) return j;
    ultimoError = new Error((j && j.detail) || t("El servidor respondió {c}.", { c: r.status }));
    if ([401, 429].includes(r.status)) break;
  }
  throw ultimoError;

function sincronizar(e, opciones = {}) {
  if (!sincronizando) sincronizando = _sincronizar(e, opciones).finally(() => { sincronizando = null; });
  return sincronizando;
}
async function _sincronizar(e, { todo = false } = {}) {
  let st = leerSync();
  let lista = await BD.todas();
  // Carreras guardadas antes de que el perfil pidiera tiempo y desnivel: se
  // vuelven a traer una vez.
  if (lista.some((c) => c.tiempo_s === undefined)) { await BD.borrar(); lista = []; st = {}; }
  if (todo || !lista.length) st = {};
  const historial = !st.completo;                       // traer todo (o seguir donde se cortó)
  // Con el historial completo, sólo lo nuevo; una semana de margen por las
  // carreras que se suben a Strava días después.
  const masNueva = lista.map((c) => c.fecha).sort().at(-1);
  const despues = !historial && masNueva ? Math.floor(Date.parse(masNueva) / 1000) - 7 * 86400 : null;
  const yaEstaban = new Set(lista.map((c) => c.id));
  let pagina = historial ? (st.pagina || 1) : 1, nuevas = 0, paginas = 0;
  // Progreso del historial: carreras recibidas (de la más nueva hacia atrás)
  // sobre el total de carreras del perfil de Strava. Las de cinta no traen
  // mapa y no llegan, así que se topa en 99 % hasta terminar.
  let vistas = historial ? (st.vistas || 0) : 0;
  if (historial && !perfilGuardado) perfilGuardado = await fetch("/api/strava/perfil").then((r) => r.ok ? r.json() : null).catch(() => null);
  const total = historial ? perfilGuardado?.historico?.carreras || 0 : 0;
  const avance = () => {
    ultimoProgreso = !historial ? { txt: t("Buscando carreras nuevas en Strava…"), progreso: null }
      : total ? { txt: t("Trayendo tu historial de Strava… {p} % ({n} de {t} carreras)", { p: Math.min(99, Math.round(100 * vistas / total)), n: num(vistas), t: num(total) }),

  };

    for (;;) {
      avance();
      const j = await paginaStrava(pagina, despues);
      await BD.guardar(j.carreras);

      nuevas += j.carreras.filter((c) => !yaEstaban.has(c.id)).length;
      vistas += j.carreras.length;

  } catch (err) {
    ultimoProgreso = null;
    guardarSync({ ...st, pagina: historial ? pagina : undefined, vistas: historial ? vistas : undefined, error: err.message, fallo: new Date().toISOString() });
    _fetch("/api/evento", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tipo: "sync_error", detalle: `página ${pagina}${historial ? " del historial" : ""}: ${err.message}`.slice(0, 200) }) }).catch(() => {});
  }

  // calor encima de «Hoy» si cambiabas de pestaña a mitad de la descarga).
  if (nuevas && vista === "perfil") await abrirPerfil(true, true);

const FASES = [["basica", "Básica"], ["especifica", "Específica"], ["competencia", "Competencia (descarga)"]];
const faseEntreno = () => leer("pp_fase", "basica");
// Sólo lo que hoy se puede escribir (FC de reposo, FC y ritmo umbral escritos ya no van).
const AJUSTES_ENTRENO = ["fc_max", "t5k_s", "t10k_s", "t21k_s", "t42k_s"];
const ajustesEntreno = () => { const a = leer("pp_entreno_ajustes", {}) || {};
  return Object.fromEntries(AJUSTES_ENTRENO.filter((k) => a[k] != null).map((k) => [k, a[k]])); };
// «42:30» → 2550 s; «1:35:00» → 5700 s; vacío → null; mal escrito → NaN.
const aSegundos = (v) => { v = (v || "").trim(); if (!v) return null;
  const p = v.split(":").map(Number); if (p.some((x) => !Number.isFinite(x) || x < 0)) return NaN;
  return p.reduce((a, x) => a * 60 + x, 0); };
const hms = (s) => { if (!s) return ""; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };

// Histogramas y carreras en cinta (sin mapa), en su propia base del teléfono.
const BDE = (() => {
  let db = null;
  const abrir = () => new Promise((ok) => {
    try {
      const r = indexedDB.open("pacepath-entreno", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("hist", { keyPath: "id" }); r.result.createObjectStore("cinta", { keyPath: "id" }); };
      r.onsuccess = () => { db = r.result; ok(); };
      r.onerror = () => ok();
    } catch { ok(); }
  });
  return {
    async todas(almacen) {
      if (!db) await abrir();
      if (!db) return [];
      return new Promise((ok) => { const r = db.transaction(almacen).objectStore(almacen).getAll(); r.onsuccess = () => ok(r.result); r.onerror = () => ok([]); });
    },
    async guardar(almacen, lista) {
      if (!db) await abrir();
      if (!db || !lista.length) return;
      await new Promise((ok) => { const tr = db.transaction(almacen, "readwrite");
        lista.forEach((x) => tr.objectStore(almacen).put(x)); tr.oncomplete = ok; tr.onerror = ok; });
    },
    async borrar() {
      if (!db) await abrir();
      if (db) for (const a of ["hist", "cinta"]) await new Promise((ok) => { const r = db.transaction(a, "readwrite").objectStore(a).clear(); r.onsuccess = ok; r.onerror = ok; });
    },
  };
})();

let preparandoEntreno = null, estadoEntreno = "";
function prepararEntreno(op = {}) {
  if (!preparandoEntreno) preparandoEntreno = _prepararEntreno(op).finally(() => { preparandoEntreno = null; estadoEntreno = ""; });
  return preparandoEntreno;
}
async function carrerasEntreno() {
  const desde = Date.now() - 365 * 864e5;              // un año: para detectar la FC máxima
  return [...(await BD.todas()), ...(await BDE.todas("cinta"))]
    .filter((c) => c.tiempo_s > 0 && Date.parse(c.fecha) >= desde);
}
async function _prepararEntreno({ sinStrava = false } = {}) {
  const lista = await carrerasEntreno();
  const hist = new Map((await BDE.todas("hist")).map((h) => [h.id, h]));
  if (!sinStrava) {
    // El detalle sólo de los últimos 3 meses, de a poco (cupo de Strava): lo que falte, la próxima vez.
    const tresMeses = Date.now() - 13 * 7 * 864e5;
    const faltan = lista.filter((c) => !hist.has(c.id) && Date.parse(c.fecha) >= tresMeses)
      .sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 40);
    let n = 0;
    for (const c of faltan) {
      estadoEntreno = t("Analizando tus carreras… {n} de {t}", { n: ++n, t: faltan.length });
      if (vista === "entreno" && $("estadoEntreno")) $("estadoEntreno").textContent = estadoEntreno;
      const r = await fetch(`/api/strava/histograma?id=${c.id}`).catch(() => null);
      if (!r || !r.ok) break;                          // sin red, límite de Strava o sin sesión
      const h = { ...(await r.json()), id: c.id };
      hist.set(c.id, h);
      await BDE.guardar("hist", [h]);
    }
  }
  return calcularRevision(lista, hist);
}
async function calcularRevision(lista, hist) {
  const carreras = lista.map(({ polilinea, puntos, ...c }) => {
    const h = hist.get(c.id);
    return h ? { ...c, hist: { fc: h.fc, ritmo: h.ritmo, fc_max: h.fc_max } } : c;
  });
  const d = new Date(), hoy = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const r = await fetch("/api/entreno/revision", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ajustes: { ...ajustesEntreno(), fase: faseEntreno() }, carreras: carreras.slice(-600), hoy,
                           coach: coachPayload() }) });
  if (!r.ok) throw new Error(t("No pude calcular la revisión ahora."));
  const j = { ...(await r.json()), calculada: Date.now() };
  escribir("pp_revision", j);
  if (vista === "entreno") pintarEntreno(j);
  return j;
}

let stravaEntreno = null;
async function abrirEntreno() {
  if (subEntreno === "bitacora") abrirBitacora();
  const guardada = leer("pp_revision", null);
  pintarEntreno(guardada);                             // al instante, la última
  stravaEntreno = await fetch("/api/strava/estado").then((r) => r.json()).catch(() => ({}));
  if (vista !== "entreno") return;
  if (stravaEntreno.conectado && necesitaSync()) { sincronizar(stravaEntreno); pintarEntreno(guardada); return; }  // al terminar, la revisión
  // Sin sincronizar: se rehace igual con lo que ya está en el teléfono (no
  // llama a Strava), para que una mejora del motor se vea al abrir la pestaña.
  if (!guardada) await prepararEntreno({ sinStrava: !stravaEntreno.conectado }).catch(() => {});
  else await recalcularEntreno();
  pintarEntreno(leer("pp_revision", null));
}
// Rehacer con lo que hay en el teléfono (cambiaron las zonas o la fase).
const recalcularEntreno = async () => {
  try { await calcularRevision(await carrerasEntreno(), new Map((await BDE.todas("hist")).map((h) => [h.id, h]))); }
  catch (err) { const m = $("errorAjustes"); if (m) m.textContent = err.message; }
};

function barraZonas(pct) {
  return `<div class="barra-zonas" role="img" aria-label="${pct.map((p, i) => `I${i + 1} ${num(p)} %`).join(", ")}">
    ${pct.map((p, i) => p > 0 ? `<span class="z${i + 1}" style="flex:${p}">${p >= 9 ? `I${i + 1} ${num(p)}%` : p >= 5 ? num(p) : ""}</span>` : "").join("")}</div>`;
}
// Horas por semana apiladas por zona (I1 abajo), con el valor al tocar.
function barrasZonas(id, semanas) {
  const W = Math.max(280, $("hoja").clientWidth - 40), H = 130, abajo = 18, izq = 30;
  const max = Math.max(1, ...semanas.map((w) => w.horas));
  const paso = [1, 2, 5, 10, 20].find((p) => max / p <= 4) || 50, tope = Math.ceil(max / paso) * paso;
  const y = (v) => (H - abajo) - v / tope * (H - abajo - 6);
  const bw = (W - izq) / semanas.length, ancho = Math.max(4, Math.min(20, bw - 5));
  let svg = "";
  for (let v = 0; v <= tope; v += paso) svg += `<line x1="${izq}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linea)"/>
    <text x="${izq - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--suave)">${num(v)} h</text>`;
  semanas.forEach((w, i) => {
    const x = izq + i * bw + (bw - ancho) / 2;
    let base = 0;
    w.pct.forEach((p, z) => {
      const h = w.horas * p / 100;
      if (h <= 0) return;
      const y0 = y(base), y1 = y(base + h);
      svg += `<path data-i="${i}" fill="var(--z${z + 1})" d="M${x},${y0} V${y1 + (y0 - y1 > 2 ? 1 : 0)} h${ancho} V${y0} z"/>`;   // 1 px de aire entre zonas
      base += h;
    });
    if (i % 3 === 0) svg += `<text x="${x + ancho / 2}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--suave)">${fechaCorta(new Date(w.inicio + "T12:00"))}</text>`;
  });
  return `<div class="grafico" id="${id}" data-w="${W}" data-izq="${izq}" data-n="${semanas.length}">
    <svg viewBox="0 0 ${W} ${H}" height="${H}">${svg}</svg><div class="tip"></div></div>`;
}

function pintarEntreno(j) {
  if (subEntreno === "bitacora") { if (!editandoBitacora()) pintarBitacora(); return; }
  const a = ajustesEntreno(), z = j?.zonas, rev = j?.revision, fase = faseEntreno();
  // Con el Coach activo, la fase es la suya (no se elige a mano).
  const faseCoach = leer("pp_coach", null) && j?.coach?.semana?.fase;
  const fuenteFc = z && { umbral: t("Con tu FC umbral"), reserva: t("Con tu FC máxima y de reposo (Karvonen)"), fc_max: t("Con tu FC máxima"),
    fc_max_detectada: t("Con la FC más alta de tus carreras ({x}): escribe la tuya si la conoces", { x: z.fc_max_detectada }) }[z.fuente_fc];
  const fuenteRitmo = z && { umbral: t("Con tu ritmo umbral"), vdot: t("Con tus mejores tiempos (VDOT {v})", { v: num(z.vdot || 0, 1) }) }[z.fuente_ritmo];
  const rango = (r, fmt) => r.desde == null ? `< ${fmt(r.hasta)}` : r.hasta == null ? `> ${fmt(r.desde)}` : `${fmt(r.desde)}–${fmt(r.hasta)}`;
  const tabla = z && (z.fc || z.ritmo) ? `<table class="zonas-tabla"><thead><tr><th>${t("Zona")}</th>${z.fc ? `<th>${t("Pulso")}</th>` : ""}${z.ritmo ? `<th>${t("Ritmo")}</th>` : ""}</tr></thead><tbody>
    ${[0, 1, 2, 3, 4].map((i) => `<tr><td><span class="zona-chip z${i + 1}">I${i + 1}</span><small>${t(ZONAS_TXT[i])}</small></td>
      ${z.fc ? `<td>${rango(z.fc[i], num)} <small>ppm</small></td>` : ""}
      ${z.ritmo ? `<td>${rango(z.ritmo[i], (s) => ritmo(s).replace(/\s*\/(km|mi)/, ""))} <small>/${uDist()}</small></td>` : ""}</tr>`).join("")}
    </tbody></table>
    <p class="nota-kpi">${[fuenteFc, fuenteRitmo].filter(Boolean).map(esc).join(" · ")}</p>
`
    : `<p class="pista">${t("Escribe tu FC máxima, tus mejores 10K/21K o tu ritmo umbral para calcular tus zonas.")}</p>`;
  // Cada dato dice si se está usando para calcular (y con qué valor).
  const marca = (txt, usa) => txt ? `<small class="usa${usa ? " si" : ""}">${usa ? "✓ " : ""}${esc(txt)}</small>` : "";
  const campo = (k, et, ph, fmt, nota) => `<label>${t(et)}<input id="aj-${k}" inputmode="${k.endsWith("_s") ? "text" : "numeric"}"
    value="${esc(String((fmt || ((v) => v ?? ""))(a[k])))}" placeholder="${esc(ph)}">${nota || ""}</label>`;
  const notaTiempo = (k) => z?.vdots?.[k] == null ? "" : z.vdot_de === k
    ? marca(t("se usa · VDOT {v}", { v: num(z.vdots[k], 1) }), true) : marca(t("VDOT {v} · manda uno mejor", { v: num(z.vdots[k], 1) }));
  const notaFc = z?.fuente_fc === "fc_max" ? marca(t("se usa para el pulso"), true)
    : z?.fuente_fc === "fc_max_detectada" ? marca(t("vacío: se usa la más alta de tus carreras ({x})", { x: z.fc_max_detectada }), true) : "";
  const forma = rev && !rev.vacia && { polarizada: t("Polarizada"), piramidal: t("Piramidal"), umbral: t("De umbral"), mixta: t("Mixta") }[rev.forma];
  const umbral12 = rev?.semanas ? rev.semanas.reduce((s, w) => s + w.umbral, 0) : 0;
  hoja(`<div class="tipo">${t("Entreno")}</div><h2>${t("Tu entrenamiento")}</h2>${selectorEntreno()}
    <p class="pista" style="margin-top:0">${t("Últimos 3 meses · filosofía del método noruego")}</p>
    ${bloqueCoach(j)}
    ${faseCoach ? `<div class="bloque" style="margin-top:8px"><h3>${t("Fase")}: ${t(FASES.find(([k]) => k === faseCoach)[1])}</h3>
      <p class="sub">${t("La define tu Coach según la fecha de tu objetivo.")}</p></div>`
    : `<div class="bloque" style="margin-top:8px"><h3>${t("Fase")}</h3>
      <div class="fases" role="radiogroup" aria-label="${t("Fase")}">${FASES.map(([k, et]) =>
        `<button type="button" class="chip${k === fase ? " on" : ""}" role="radio" aria-checked="${k === fase}" data-fase="${k}">${t(et)}</button>`).join("")}</div></div>`}
    <div class="bloque"><h3>${t("Tus zonas")}</h3>
      <div class="kpis umbrales"><div class="kpi"><span>${t("Ritmo umbral")}</span><b>${z?.ritmo_umbral_s ? ritmo(z.ritmo_umbral_s) : "–"}</b>
          <small>${z?.vdot_de ? t("de tu mejor {d} (VDOT {v})", { d: { "5k": "5K", "10k": "10K", "21k": "21K", "42k": t("maratón") }[z.vdot_de], v: num(z.vdot, 1) })
            : z?.fuente_ritmo === "umbral" ? t("el que escribiste") : t("escribe un mejor tiempo")}</small></div>
        <div class="kpi"><span>${t("FC umbral")}</span><b>${z?.fc_umbral ? `${num(z.fc_umbral)} ppm` : "–"}</b>
          <small>${z?.fc_umbral ? t("frontera I3/I4 (~87 % de la FC máx.)") : t("escribe tu FC máxima")}</small></div></div>
      ${bloqueTeorica(j?.teorica, leer("pp_coach", null)?.objetivo)}
      ${tabla}
      <details class="ajustes-zonas"${z && (z.fc || z.ritmo) ? "" : " open"}><summary>${t("Ajustar mis datos")}</summary>
        <form id="formZonas"><div class="rejilla">
          ${campo("fc_max", "FC máxima", z?.fc_max_detectada ? t("detectada: {x}", { x: z.fc_max_detectada }) : "190", null, notaFc)}
          ${campo("t5k_s", "Mejor 5K", "19:30", hms, notaTiempo("5k"))}
          ${campo("t10k_s", "Mejor 10K", "42:30", hms, notaTiempo("10k"))}
          ${campo("t21k_s", "Mejor 21K", "1:35:00", hms, notaTiempo("21k"))}
          ${campo("t42k_s", "Mejor maratón", "3:20:00", hms, notaTiempo("42k"))}
        </div><button type="submit">${t("Calcular mis zonas")}</button><p class="aviso" id="errorAjustes" style="margin:6px 0 0"></p></form>
      </details></div>
    <p class="pista" id="estadoEntreno">${esc(estadoEntreno)}</p>
    ${stravaEntreno && !stravaEntreno.conectado ? `<div class="bloque"><h3>${t("Revisión")}</h3><p class="pista">${t("Conecta tu Strava para revisar cómo vienes entrenando: zonas, polarización y sesiones de umbral de los últimos 3 meses.")}</p>${STRAVA_CONECTAR()}${AVISO_BETA(stravaEntreno)}</div>`
    : rev?.vacia ? `<p class="pista">${t("Aún no hay carreras de los últimos 3 meses en este teléfono.")}</p>`
    : rev ? `
    <div class="bloque"><h3>${t("Distribución")} · ${forma}</h3>
      <p class="sub">${t("Índice de polarización {p}", { p: num(rev.polarizacion, 2) })} · ${t("El método noruego es piramidal: mucho suave, bastante umbral controlado y poco I5.")}</p>
      <small class="sub">${t("Últimas 4 semanas")}</small>${barraZonas(rev.distribucion_4)}
      <small class="sub">${t("Últimas 12 semanas")}</small>${barraZonas(rev.distribucion)}
      <div class="leyenda-zonas">${[0, 1, 2, 3, 4].map((i) => `<span><i class="z${i + 1}"></i>I${i + 1}</span>`).join("")}</div></div>
    <div class="bloque"><h3>${t("Revisión")}</h3><ul class="chequeos">${rev.chequeos.map((c) =>
      `<li class="${c.estado}"><span class="ico" aria-hidden="true">${{ ok: "✓", ojo: "!", mal: "✕" }[c.estado]}</span><div><b>${esc(c.titulo)}</b><p>${esc(c.texto)}</p></div></li>`).join("")}</ul></div>
    <div class="bloque"><h3>${t("Semana a semana")}</h3><p class="sub">${t("Horas por zona · {n} sesiones de umbral en 12 semanas", { n: umbral12 })}</p>
      ${barrasZonas("g-entreno", rev.semanas)}</div>
    <div class="bloque"><h3>${t("Sesiones recientes")}</h3><ul class="sesiones-entreno">${rev.sesiones.slice(0, 10).map((x) =>
      `<li><span>${fechaCorta(new Date(x.fecha + "T12:00"))} · ${esc(x.nombre || "")} · ${fmtDistKm(x.km, 1)}</span><span class="tipo-sesion ${x.tipo}">${t(TIPO_TXT[x.tipo])}</span></li>`).join("")}</ul>
      <p class="nota-kpi">${t("Pulso segundo a segundo en el {p} % del tiempo; el resto, con el promedio de cada carrera.", { p: rev.detalle_pct })}
        ${j.calculada ? " · " + t("Revisión del {f}", { f: new Date(j.calculada).toLocaleString(LOCALE[idioma], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) }) : ""}</p></div>` : ""}
    ${stravaEntreno?.conectado ? POWERED_STRAVA() : ""}`);
  if (rev?.semanas && !rev.vacia) activarGrafico("g-entreno", rev.semanas.map((w) => t("Semana del {f}: {h} h · {k} · {u} de umbral",
    { f: fechaCorta(new Date(w.inicio + "T12:00")), h: num(w.horas, 1), k: fmtDistKm(w.km, 1), u: w.umbral })));
  document.querySelectorAll("[data-fase]").forEach((b) => { b.onclick = () => {
    escribir("pp_fase", b.dataset.fase);
    document.querySelectorAll("[data-fase]").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-checked", String(x === b)); });
    recalcularEntreno();
  }; });
  $("formZonas").onsubmit = (e) => {
    e.preventDefault();
    const nuevo = {};
    { const v = parseFloat($("aj-fc_max").value); if (Number.isFinite(v)) nuevo.fc_max = v; }
    for (const k of ["t5k_s", "t10k_s", "t21k_s", "t42k_s"]) {
      const v = aSegundos($(`aj-${k}`).value);
      if (Number.isNaN(v)) { $("errorAjustes").textContent = t("Revisa el formato: tiempos como 42:30 o 1:35:00 y ritmos como 4:15."); return; }
      if (v) nuevo[k] = v;
    }
    escribir("pp_entreno_ajustes", nuevo);
    recalcularEntreno();
  };
  activarCoach();
  activarSelectorEntreno();
}

// ── Tiempos desde Strava: las vueltas → una propuesta que revisas y confirmas ──
const proponerSeries = (vueltas, plan, marcas) => fetch("/api/bitacora/series", { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ vueltas: vueltas.map(({ distancia_m, tiempo_s, fc }) => ({ distancia_m, tiempo_s, fc })), plan, marcas }) })
  .then((r) => { if (!r.ok) throw new Error(t("No pude armar las series.")); return r.json(); });
async function traerStrava(id) {
  const e = editandoEntrada;
  if (!e) return;
  if ($("formEntrada")) leerFormEntrada();
  e._prop = { cargando: true, strava_id: id };
  pintarEditorEntrada();
  try {
    const r = await fetch(`/api/strava/vueltas?id=${encodeURIComponent(id)}`);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || t("No pude bajar las vueltas de Strava."));
    const { vueltas } = await r.json();
    if (vueltas.length < 2) throw new Error(t("Esta carrera no tiene vueltas (laps) en Strava. La próxima vez marca lap en cada repetición y en cada pausa."));
    const b0 = e.bloques?.length === 1 && e.bloques[0].reps ? e.bloques[0] : null;
    const plan = b0 && (b0.dist_m || b0.dur_s) ? { series: b0.series, reps: b0.reps, dist_m: b0.dist_m, dur_s: b0.dur_s, obj: b0.obj } : null;
    e._prop = { strava_id: id, vueltas, plan, res: await proponerSeries(vueltas, plan, null) };
  } catch (err) { e._prop = { error: err.message }; }
  if (editandoEntrada === e) { if ($("formEntrada")) leerFormEntrada(); pintarEditorEntrada(); }
}
const MARCAS_V = [["rep", "Rep."], ["pausa", "Pausa"], ["cal", "Calent."], ["vc", "V. calma"]];

  const r = pr.res, est = r.bloques.map(estructura).join(" + ");

    <p class="sub" style="margin:4px 0 8px">${est ? t("Encontré {e}.", { e: est }) : r.continuo ? t("Es un rodaje continuo (una vuelta automática por km): no son series. Si sí lo fueron, marca abajo cuáles vueltas son repeticiones.") : t("No encontré series: marca abajo cuáles vueltas son repeticiones.")}
      ${r.calentamiento_km ? " " + t("Calentamiento {k}", { k: fmtDistKm(r.calentamiento_km, 1) }) + "." : ""}${r.vuelta_calma_km ? " " + t("Vuelta a la calma {k}", { k: fmtDistKm(r.vuelta_calma_km, 1) }) + "." : ""}</p>
    <table class="vueltas"><thead><tr><th>#</th><th>${t("Dist.")}</th><th>${t("Tiempo")}</th><th>${t("Ritmo")}</th><th>${t("Es")}</th></tr></thead><tbody>
      ${r.vueltas.map((v, i) => `<tr class="${r.marcas[i]}"><td>${v.i}</td>
        <td><input class="d-vuelta" data-vd="${i}" inputmode="numeric" value="${v.redonda || v.distancia_m}" aria-label="${t("Distancia de la vuelta {n} (m)", { n: v.i })}">${v.redonda && v.redonda !== v.distancia_m ? `<small class="gps">GPS ${num(v.distancia_m)}</small>` : ""}</td>
        <td><input class="t-vuelta" data-vt="${i}" inputmode="decimal" value="${mmss(v.tiempo_s)}" aria-label="${t("Tiempo de la vuelta {n}", { n: v.i })}"></td>

    </tbody></table>
    ${r.bloques.map((b) => `<p class="prev-b"><b>${estructura(b)}</b>${detalleBloque(b) ? ` (${esc(detalleBloque(b))})` : ""}<br>${b.tiempos.map((f, k) =>

function activarPropuesta(e) {
  const pr = e._prop;
  document.querySelectorAll("[data-prop-no]").forEach((x) => { x.onclick = () => { leerFormEntrada(); e._prop = null; pintarEditorEntrada(); }; });
  const ok = document.querySelector("[data-prop-ok]");
  if (ok) ok.onclick = () => {
    leerFormEntrada();
    const r = pr.res;
    e.bloques = r.bloques.map((b) => { const antes = (e.bloques || []).find((x) => (b.dist_m && x.dist_m === b.dist_m) || (b.dur_s && x.dur_s === b.dur_s));
      return { ...b, obj: b.obj || antes?.obj || null }; });
    e.cal_km = r.calentamiento_km || null; e.vc_km = r.vuelta_calma_km || null; e.strava_id = pr.strava_id;
    if (!["series", "tempo", "carrera"].includes(e.tipo)) e.tipo = "series";
    e._prop = null; pintarEditorEntrada();
  };
  // Corregir: qué es cada vuelta, o su tiempo → se vuelve a armar.
  const rehacer = async () => { try { pr.res = await proponerSeries(pr.vueltas, pr.plan, pr.res.marcas); } catch (err) { pr.error = err.message; }
    if (editandoEntrada === e) { leerFormEntrada(); pintarEditorEntrada(); } };
  document.querySelectorAll("[data-vm]").forEach((x) => { x.onchange = () => { pr.res.marcas[+x.dataset.vm] = x.value; rehacer(); }; });
  // Distancia: la que corriste de verdad (el GPS se equivoca); al cambiarla se vuelve a armar.
  document.querySelectorAll("[data-vd]").forEach((x) => { x.onchange = () => { const d = parseFloat(x.value.replace(",", "."));
    if (Number.isFinite(d) && d > 0 && d <= 50000) { pr.vueltas[+x.dataset.vd].distancia_m = d; rehacer(); } else x.value = Math.round(pr.vueltas[+x.dataset.vd].distancia_m); }; });
  document.querySelectorAll("[data-vt]").forEach((x) => { x.onchange = () => { const v = segRep(x.value);
    if (Number.isFinite(v) && v > 0) { pr.vueltas[+x.dataset.vt].tiempo_s = v; rehacer(); } else x.value = mmss(pr.vueltas[+x.dataset.vt].tiempo_s); }; });
}

     s.enRango != null ? t("{n} de {m} en rango", { n: s.enRango, m: s.n }) : ""].filter(Boolean).join(" · ");

function activarEditorEntrada() {

  f.querySelectorAll("[data-quitar-b]").forEach((x) => { x.onclick = () => { leerFormEntrada(); e.bloques.splice(+x.dataset.quitarB, 1); pintarEditorEntrada(); }; });
  // Estructura del bloque: al cambiarla se rehace la grilla (los tiempos ya anotados se conservan).
  f.querySelectorAll("[data-campo]").forEach((x) => { x.onchange = () => {

    else if (k === "dist_m") b.dist_m = Math.max(1, parseInt(v) || b.dist_m);
    else if (k === "dur_s" || k === "p_rep" || k === "p_serie") { const s = segRep(/^\d+$/.test(v) && k !== "dur_s" ? v + "'" : v); b[k] = Number.isFinite(s) && s > 0 ? s : null; if (k === "dur_s" && !b.dur_s) b.dur_s = 60; }
    else if (k === "obj0" || k === "obj1") {
      const s = segRep(v), o = b.obj || [null, null];
      o[k === "obj0" ? 0 : 1] = Number.isFinite(s) && s > 0 ? s : null;
      b.obj = o[0] || o[1] ? [o[0] ?? o[1], o[1] ?? o[0]].sort((a, c) => a - c) : null;
    }

  f.querySelectorAll(".t-rep").forEach((x) => {

      b.tiempos[s][r] = Number.isFinite(v) && v > 0 ? v : null;
      x.className = `t-rep ${estadoRep(b, b.tiempos[s][r])}`;

      if (v != null && !b.dur_s) x.value = mmss(v); };
  });
  f.querySelector("[data-ent-cancelar]").onclick = () => { editandoEntrada = null; pintarBitacora(); };
  f.querySelector("[data-ent-enviar-ed]").onclick = () => { leerFormEntrada(); menuEnvio = menuEnvio === "ed" ? null : "ed"; pintarEditorEntrada(); };
  f.querySelectorAll("[data-env-op]").forEach((x) => { x.onclick = () => {

  const borrar = f.querySelector("[data-ent-borrar]");

  };
  f.onsubmit = (ev) => {
    ev.preventDefault(); leerFormEntrada();
    if (!e.fecha) return ($("errorEnt").textContent = t("Elige la fecha."));
    // Los tiempos vacíos al final no se guardan; si no hay ninguno, la grilla queda vacía.
    for (const b of e.bloques || []) b.tiempos = (b.tiempos || []).slice(0, b.series).map((fila) => (fila || []).slice(0, b.reps).map((x) => x ?? null));
    if (!e.km_manual) e.km = kmAuto(e);
    const { _sens, _prop, ...resto } = e;
    const bt = bitacora(), limpio = { ...resto, id: e.id || nuevoId() };
    bt.entradas = [...bt.entradas.filter((x) => x.id !== limpio.id), limpio].sort((a, c) => a.fecha.localeCompare(c.fecha));
    if (_sens?.nota) bt.sensaciones = [...bt.sensaciones.filter((y) => y.fecha !== e.fecha), { fecha: e.fecha, nota: _sens.nota, ...(_sens.dolor ? { dolor: _sens.dolor } : {}) }];
    diaBitacora = limpio.fecha; mesBitacora = limpio.fecha.slice(0, 7);
    editandoEntrada = null;
    if (_sens?.nota) guardarYRecalcular(bt); else { guardarBitacora(bt); pintarBitacora(); }
  };
}

  };
  void hoyF;

// El bloque que llevó a un objetivo: desde el objetivo anterior (o 12 semanas) hasta la víspera.

  document.querySelectorAll("[data-hist]").forEach((b) => { b.onclick = () => { h.sel = +b.dataset.hist; pintarHistoria(); }; });
  document.querySelector("[data-hist-volver]").onclick = () => { editandoEntrada = h.volver || null; editandoHistoria = null; pintarBitacora(); };
  const aviso = (m, ok) => { const x = $("estadoHist"); if (x) { x.textContent = m; x.classList.toggle("ok", !!ok); } };
  // La grande primero (la que se va a usar) y después las miniaturas.
  const dis = lista[h.sel];
  const cv = await dibujarHistoria(dis, d);
  if (editandoHistoria !== h) return;
  const blob = () => new Promise((ok) => cv.toBlob(ok, "image/png"));
  const archivo = async () => new File([await blob()], `pacepath-${h.e.fecha}-${dis.id}.png`, { type: "image/png" });
  $("histGrande").innerHTML = ""; cv.style.cssText = "width:100%;height:auto;display:block"; $("histGrande").appendChild(cv);
  document.querySelector("[data-hist-compartir]").onclick = async () => {
    const f = await archivo();
    if (navigator.canShare?.({ files: [f] })) { try { await navigator.share({ files: [f] }); } catch {} return; }
    descargar(f); aviso(t("Tu navegador no comparte imágenes: la guardé para que la subas a Instagram."), true);
  };
  const bc = document.querySelector("[data-hist-copiar]");
  if (bc) bc.onclick = async () => {
    try { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob() })]); aviso("✓ " + t("Sticker copiado: en tu historia de Instagram, mantén presionado y pega."), true); }
    catch { aviso(t("No pude copiar la imagen en este navegador: usa «Guardar imagen».")); }
  };
  document.querySelector("[data-hist-bajar]").onclick = async () => { descargar(await archivo()); aviso("✓ " + t("Imagen guardada."), true); };
  for (const [i, x] of lista.entries()) {
    if (editandoHistoria !== h) return;
    const m = await dibujarHistoria(x, d, .18);
    const cont = document.querySelector(`[data-hist="${i}"] .lienzo`);
    if (cont) { cont.innerHTML = ""; m.style.cssText = "width:100%;height:100%;display:block"; cont.appendChild(m); }

}
function descargar(f) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ── Pasaporte: logros, puntos y nivel ───────────────────────────────────────
// Todo se calcula en este teléfono con tus carreras (no hay rankings: los
// datos de Strava son sólo para su dueño). Los lugares vienen de
// lugaresDeCarreras; «Tu calle», de las calles de siempre del servidor.
const TIER = ["", "bronce", "plata", "oro"];
const PUNTOS_TIER = [0, 50, 150, 400];          // al llegar a cada nivel (se suman)
const CONTINENTES = ["AF", "AS", "EU", "NA", "SA", "OC"];      // los seis habitados
const NOMBRE_CONT = { AF: "África", AS: "Asia", EU: "Europa", NA: "Norteamérica", SA: "Sudamérica", OC: "Oceanía", AN: "Antártica" };
const NIVELES = ["Trotador", "Corredor", "Fondista", "Maratonista", "Ultra", "Leyenda"];
const nivelDe = (xp) => Math.floor(Math.sqrt(Math.max(0, xp) / 50)) + 1;           // nivel L desde 50·(L−1)² puntos
const xpDeNivel = (L) => 50 * (L - 1) ** 2;
const nombreNivel = (L) => t(NIVELES[Math.min(NIVELES.length - 1, Math.floor((L - 1) / 5))]);

function rachaMaxima(lista) {
  const sem = new Set(lista.map((c) => lunes(localDe(c)).getTime()));
  let max = 0, corrida = 0, prev = null;
  for (const k of [...sem].sort((a, b) => a - b)) {
    corrida = prev !== null && Math.round((k - prev) / (7 * 864e5)) === 1 ? corrida + 1 : 1;
    max = Math.max(max, corrida); prev = k;
  }
  return max;
}

function calcularPasaporte(lista, lugares, pf, calles) {
  const ciudades = new Set(), paises = new Set(), conts = new Set();
  const ciudadesPorPais = new Map(), porBarrio = new Map(), porCiudad = new Map();
  const porPais = new Map(), paisesDeCont = new Map();        // para las explicaciones
  let madrugadas = 0, noches = 0;
  for (const c of lista) {
    const h = localDe(c).getHours();
    if (h < 7) madrugadas++; else if (h >= 21) noches++;
    const L = lugares.get(c.id);
    if (!L) continue;
    if (L.continente) conts.add(L.continente);
    if (L.pais) paises.add(L.pais);
    if (L.pais) {
      const x = porPais.get(L.pais) || { carreras: 0, km: 0, primera: c };
      x.carreras++; x.km += c.distancia_m / 1000; if (localDe(c) < localDe(x.primera)) x.primera = c;
      porPais.set(L.pais, x);
      if (L.continente) { if (!paisesDeCont.has(L.continente)) paisesDeCont.set(L.continente, new Set());
        paisesDeCont.get(L.continente).add(L.pais); }
    }
    if (L.ciudad && !L.cerca) {
      const k = L.pais + "|" + L.ciudad;
      ciudades.add(k);
      if (!ciudadesPorPais.has(L.pais)) ciudadesPorPais.set(L.pais, new Set());
      ciudadesPorPais.get(L.pais).add(L.ciudad);
      porCiudad.set(k, (porCiudad.get(k) || 0) + 1);
    }
    if (L.barrio) { const k = L.pais + "|" + L.barrio; porBarrio.set(k, (porBarrio.get(k) || 0) + 1); }
  }
  const top = (m) => [...m.entries()].sort((a, b) => b[1] - a[1])[0] || null;
  const tb = top(porBarrio), tc = top(porCiudad);
  const tp = [...ciudadesPorPais.entries()].sort((a, b) => b[1].size - a[1].size)[0];
  const km = Math.max(lista.reduce((s, c) => s + c.distancia_m, 0) / 1000, pf?.historico?.km || 0);
  const barrio = tb ? tb[0].split("|")[1] : null, ciudad = tc ? tc[0].split("|")[1] : null;
  const calle = calles?.[0] || null, paisTop = tp ? nombrePais(tp[0]) : null;
  const L = (id, icono, grupo, valor, umbrales, nombres, extra = {}) => {
    const tier = umbrales.filter((u) => valor >= u).length;
    return { id, icono, grupo, valor, umbrales, nombres, tier, ...extra };
  };
  const logros = [
    // Explorador
    L("ciudades", "🏙️", "explorador", ciudades.size, [5, 15, 40], [t("Viajero"), t("Trotamundos"), t("Nómada")], { unidad: t("ciudades") }),
    L("paises", "🛂", "explorador", paises.size, [3, 10, 25], [t("Pasaporte sellado"), t("Ciudadano del mundo"), t("Embajador")], { unidad: t("países") }),
    L("continentes", "🌍", "explorador", CONTINENTES.filter((x) => conts.has(x)).length, [2, 4, 6],
      [t("Intercontinental"), t("Cuatro continentes"), t("Los seis continentes")], { unidad: t("continentes") }),
    L("pais", "🗺️", "explorador", tp ? tp[1].size : 0, [5, 10, 20],
      paisTop ? [t("Turista en {p}", { p: paisTop }), t("Conoce {p}", { p: paisTop }), t("{p} de punta a punta", { p: paisTop })]
              : [t("Conoce tu país"), t("Conoce tu país"), t("Conoce tu país")], { unidad: t("ciudades en un país") }),
    L("antartica", "🐧", "explorador", conts.has("AN") ? 1 : 0, [1, 1, 1], [t("Antártica"), t("Antártica"), t("Antártica")],
      { secreto: true, unidad: "" }),
    // Local
    L("barrio", "🏘️", "local", tb ? tb[1] : 0, [25, 100, 300], barrio
      ? [t("Vecino de {b}", { b: barrio }), t("Leyenda local de {b}", { b: barrio }), t("Ícono de {b}", { b: barrio })]
      : [t("Vecino"), t("Leyenda local"), t("Ícono del barrio")], { unidad: barrio ? t("carreras en {b}", { b: barrio }) : t("carreras en tu barrio") }),
    L("ciudad", "📍", "local", tc ? tc[1] : 0, [100, 300, 1000], ciudad
      ? [t("Corredor de {c}", { c: ciudad }), t("Dueño de {c}", { c: ciudad }), t("{c} es tuyo", { c: ciudad })]
      : [t("Corredor local"), t("Dueño de tu ciudad"), t("Tu ciudad es tuya")], { unidad: ciudad ? t("carreras en {c}", { c: ciudad }) : t("carreras en tu ciudad") }),
    L("calle", "🛣️", "local", calle ? calle.veces : 0, [20, 50, 100], calle
      ? [t("Habitual de {s}", { s: calle.nombre }), t("Experto en {s}", { s: calle.nombre }), t("Rey de {s}", { s: calle.nombre })]
      : [t("Tu calle"), t("Tu calle"), t("Tu calle")], { unidad: calle ? t("veces por {s}", { s: calle.nombre }) : t("veces por tu calle"),
        pendiente: calles === undefined }),
    // Constancia y volumen
    L("km", "🌐", "constancia", Math.round(km), [1000, 5000, 40075], [t("Mil kilómetros"), t("Cinco mil"), t("Vuelta al mundo")], { unidad: "km" }),
    L("racha", "🔥", "constancia", rachaMaxima(lista), [4, 12, 52], [t("Constante"), t("Imparable"), t("Un año sin parar")], { unidad: t("semanas seguidas") }),
    L("madrugador", "🌅", "constancia", madrugadas, [10, 50, 150], [t("Madrugador"), t("Madrugador"), t("Madrugador")], { unidad: t("carreras antes de las 7:00") }),
    L("nocturno", "🌙", "constancia", noches, [10, 50, 150], [t("Nocturno"), t("Nocturno"), t("Nocturno")], { unidad: t("carreras después de las 21:00") }),
  ];
  const puntos = { km: Math.round(km), ciudades: 25 * ciudades.size, paises: 100 * paises.size, continentes: 500 * conts.size,
                   logros: logros.reduce((s, x) => s + PUNTOS_TIER.slice(0, x.tier + 1).reduce((a, b) => a + b, 0), 0) };
  const xp = Object.values(puntos).reduce((a, b) => a + b, 0);
  return { logros, xp, puntos, nivel: nivelDe(xp), paises: [...paises], conts, ciudades: ciudades.size,
           porPais, ciudadesPorPais, paisesDeCont };
}

// Qué mide cada logro (para la burbuja de explicación).
function queMide(x) {
  const n = x.nombres[2];
  return {
    ciudades: t("Ciudades distintas donde has corrido."),
    paises: t("Países donde has corrido."),
    continentes: t("Continentes habitados donde has corrido: África, Asia, Europa, Norteamérica, Sudamérica y Oceanía."),
    pais: t("Ciudades distintas dentro de un mismo país (el tuyo con más ciudades)."),
    antartica: t("Logro secreto: correr en la Antártica."),
    barrio: t("Carreras que empiezan en tu comuna o barrio más corrido."),
    ciudad: t("Carreras en tu ciudad más corrida."),
    calle: t("Veces que pasaste por el tramo más corrido de tu calle favorita."),
    km: t("Kilómetros totales corridos (el total de Strava)."),
    racha: t("Tu racha más larga de semanas seguidas con al menos una carrera."),
    madrugador: t("Carreras que empiezan antes de las 7:00."),
    nocturno: t("Carreras que empiezan a las 21:00 o después."),
  }[x.id] || n;
}
function infoLogro(x) {
  const [b, p, o] = x.umbrales, falta = x.tier < 3 ? x.umbrales[x.tier] - x.valor : 0;
  const estado = x.tier === 3 ? t("¡Oro conseguido!")
    : t("Te faltan {n} para {nivel}: «{l}».", { n: num(falta), nivel: t(TIER[x.tier + 1]), l: esc(x.nombres[x.tier]) });
  return `${queMide(x)}<br><span class="umb">${x.secreto ? "" : t("Bronce {b} · Plata {p} · Oro {o}", { b: num(b), p: num(p), o: num(o) }) + " · "}${t("Tienes {v}.", { v: num(x.valor) })}</span><br>${estado}`;
}

// Lo próximo: el logro al que le falta menos (en proporción) para subir.
function loProximo(P) {
  const c = P.logros.filter((x) => !x.secreto && x.tier < 3 && !x.pendiente)
    .map((x) => ({ x, sig: x.umbrales[x.tier], f: x.valor / x.umbrales[x.tier] })).sort((a, b) => b.f - a.f)[0];
  if (!c) return "";
  return t("Te faltan {n} {u} para «{l}».", { n: num(c.sig - c.x.valor), u: c.x.unidad, l: c.x.nombres[c.x.tier] });
}

// Plegado por defecto (sólo nivel, progreso y lo próximo); se recuerda.
const pasaporteAbierto = () => leer("pp_pasaporte_abierto", false) === true;

        { km: num(P.puntos.km), c: num(P.puntos.ciudades), p: num(P.puntos.paises), o: num(P.puntos.continentes), l: num(P.puntos.logros) })}</p></details>
    <button class="sec" id="compartirPasaporte" type="button">${t("Compartir mi pasaporte")}</button>

// Burbuja de explicación: al pasar el mouse (si hay) o al tocar un sello,
// continente, logro o el nivel. Otro toque, o tocar fuera, la cierra.
function activarInfoPasaporte() {
  const caja = $("pasaporte")?.querySelector(".pasaporte");
  if (!caja) return;
  const burbuja = document.createElement("div");
  burbuja.className = "pas-info"; burbuja.hidden = true; burbuja.setAttribute("role", "tooltip");
  caja.appendChild(burbuja);
  const conMouse = () => window.matchMedia("(hover: hover)").matches;
  let actual = null;
  const mostrar = (el) => {
    burbuja.innerHTML = `<b></b>${el.dataset.txt}`;        // txt ya viene escapado; el título va como texto
    burbuja.firstChild.textContent = el.dataset.tit;
    burbuja.hidden = false;
    const r = el.getBoundingClientRect(), c = caja.getBoundingClientRect(), w = burbuja.offsetWidth;
    burbuja.style.left = Math.max(8, Math.min(c.width - w - 8, r.left - c.left + r.width / 2 - w / 2)) + "px";
    burbuja.style.top = (r.bottom - c.top + 8) + "px";
    burbuja.style.setProperty("--flecha", Math.max(14, Math.min(w - 14, r.left - c.left + r.width / 2 - parseFloat(burbuja.style.left))) + "px");
    actual = el;
  };
  const ocultar = () => { burbuja.hidden = true; actual = null; };
  caja.addEventListener("mouseover", (e) => { const el = e.target.closest("[data-tit]"); if (el && conMouse()) mostrar(el); });
  caja.addEventListener("mouseout", (e) => { const el = e.target.closest("[data-tit]");
    if (el && conMouse() && !el.contains(e.relatedTarget)) ocultar(); });
  caja.addEventListener("click", (e) => { const el = e.target.closest("[data-tit]");
    if (!el) return ocultar();
    if (actual === el && !conMouse()) ocultar(); else mostrar(el); });
  // Con teclado (Tab) también; el foco que deja un toque no cuenta (lo maneja el click).
  caja.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tit]"); if (el && el.matches(":focus-visible")) mostrar(el); });
  caja.addEventListener("focusout", ocultar);
  $("hoja").addEventListener("scroll", ocultar, { passive: true });
}

// Logros nuevos desde la última vez: un aviso (la primera vez, sólo se guardan).
function avisarLogrosNuevos(P) {
  const ahora = P.logros.filter((x) => x.tier).map((x) => `${x.id}:${x.tier}`);
  const vistos = pref("pp_logros_vistos", null);
  guardarPref("pp_logros_vistos", ahora);
  if (!Array.isArray(vistos)) return;
  const nuevos = P.logros.filter((x) => x.tier && !vistos.includes(`${x.id}:${x.tier}`));
  if (!nuevos.length) return;
  const d = document.createElement("div");
  d.className = "toast-logro";
  d.innerHTML = `<b>${t(nuevos.length === 1 ? "¡Nuevo logro!" : "¡Nuevos logros!")}</b>` +
    nuevos.slice(0, 3).map((x) => `<span>${x.icono} ${esc(x.nombres[x.tier - 1])} · ${t(TIER[x.tier])}</span>`).join("");
  document.body.appendChild(d);
  setTimeout(() => d.classList.add("fuera"), 4200);
  setTimeout(() => d.remove(), 5000);
}

// Tarjeta para compartir (sólo si tú lo decides): imagen 1080×1350.
async function compartirPasaporte(P, nombre) {
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const fondo = g.createRadialGradient(W, 0, 50, W, 0, 1000);
  fondo.addColorStop(0, "#7a2a10"); fondo.addColorStop(1, "#121216");
  g.fillStyle = fondo; g.fillRect(0, 0, W, H);
  const f = (peso, px) => `${peso} ${px}px Inter, -apple-system, system-ui, sans-serif`;
  // Logo: el mismo trazo del ícono (viewBox 26×26)
  g.fillStyle = "#f2541b"; g.beginPath(); g.roundRect(72, 72, 64, 64, 16); g.fill();
  g.save(); g.translate(72, 72); g.scale(64 / 26, 64 / 26);
  g.strokeStyle = "#fff"; g.lineCap = "round"; g.lineWidth = 2.4;

  g.fillStyle = "#fff"; g.beginPath(); g.arc(7.5, 19.5, 2.2, 0, 7); g.fill();

// ── Perfil: tu Strava en números ────────────────────────────────────────────
// Los totales (4 semanas, año, histórico) son los oficiales de Strava. El resto
// sale de tus carreras con GPS guardadas en este teléfono.
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const ritmo = (s_km) => { if (!isFinite(s_km) || s_km <= 0) return "–";
  const s = Math.round(s_km * uM() / 1000);                           // por km o por milla
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} /${unidad}`; };
const lunes = (d) => { const x = new Date(d); const k = (x.getDay() + 6) % 7; x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - k); return x; };
const mesN = (i) => (idioma === "en" ? MESES_EN : idioma === "pt" ? MESES_PT : MESES)[i];
const fechaCorta = (d) => idioma === "en" ? `${mesN(d.getMonth())} ${d.getDate()}` : `${d.getDate()} ${mesN(d.getMonth())}`;
const localDe = (c) => new Date((c.fecha_local || c.fecha).replace("Z", ""));

// Año elegido: sus totales (carreras con GPS), la comparación con el anterior
// y el promedio semanal.
function kpisAnio(todas, a, anios, promSem, nSem) {
  // El año en curso se compara con el anterior hasta la misma fecha.
  const hoy = new Date(), enCurso = a === hoy.getFullYear();
  const hasta = (c) => !enCurso || (localDe(c).getMonth() * 100 + localDe(c).getDate()) <= (hoy.getMonth() * 100 + hoy.getDate());
  const de = (y, corte) => totalesDe(todas.filter((c) => localDe(c).getFullYear() === y && (!corte || hasta(c))));
  const este = de(a), antes = anios.includes(a - 1) ? de(a - 1, true) : null;
  const cambio = antes && antes.km ? Math.round((este.km - antes.km) / antes.km * 100) : null;
  return `<div class="kpis">${kpi(String(a), { ...este, km: Math.round(este.km) })}
    <div class="kpi"><span>${t("vs {a}", { a: a - 1 })}</span><b>${cambio == null ? "–" : (cambio > 0 ? "+" : "") + cambio + " %"}</b>
      <small>${antes ? t(enCurso ? "{k} a esta fecha en {a}" : "{k} en {a}", { k: fmtDistKm(antes.km, 0), a: a - 1 })
        : t("sin carreras en {a}", { a: a - 1 })}</small></div>
    <div class="kpi"><span>${t("Por semana")}</span><b>${fmtDistKm(promSem, 1)}</b>
      <small>${t("{n} carreras por semana", { n: num(este.carreras / nSem, 1) })}</small></div></div>
    <p class="nota-kpi">${t("Tus carreras con GPS guardadas en este teléfono.")}</p>`;
}

function kpi(titulo, tt) {
  return `<div class="kpi"><span>${titulo}</span><b>${fmtDistKm(tt.km, 0)}</b>
    <small>${num(tt.carreras)} ${t("carreras")}<br>${num(tt.horas)} h · ${num(tt.desnivel_m)} m ↑</small></div>`;
}

// Barras (una serie): eje y con 3 marcas, barras finas con borde superior
// redondeado, valor al tocar.
function barras(id, datos, { formato, etiquetaX, alto = 120 }) {
  const W = Math.max(280, $("hoja").clientWidth - 40), H = alto, abajo = 18, izq = 30;
  const max = Math.max(1, ...datos.map((d) => d.v));
  const paso = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500].find((p) => max / p <= 4) || 1000;
  const tope = Math.ceil(max / paso) * paso;
  const y = (v) => (H - abajo) - v / tope * (H - abajo - 6);
  const bw = (W - izq) / datos.length, ancho = Math.max(3, Math.min(22, bw - 4));
  let svg = "";
  for (let v = 0; v <= tope; v += paso)
    svg += `<line x1="${izq}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linea)"/>
      <text x="${izq - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--suave)">${num(v)}</text>`;
  datos.forEach((d, i) => {
    const x = izq + i * bw + (bw - ancho) / 2, h = Math.max(0, (H - abajo) - y(d.v)), r = Math.min(4, ancho / 2, h);
    if (d.v > 0) svg += `<path data-i="${i}" fill="var(--acento)" d="M${x},${H - abajo} v${-(h - r)} q0,${-r} ${r},${-r} h${ancho - 2 * r} q${r},0 ${r},${r} v${h - r} z"/>`;
    const et = etiquetaX(d, i);
    if (et) svg += `<text x="${x + ancho / 2}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--suave)">${et}</text>`;
  });
  return `<div class="grafico" id="${id}" data-w="${W}" data-izq="${izq}" data-n="${datos.length}">
    <svg viewBox="0 0 ${W} ${H}" height="${H}">${svg}</svg><div class="tip"></div></div>`;
}

function linea(id, datos, { formato, alto = 110, invertir = false }) {
  const W = Math.max(280, $("hoja").clientWidth - 40), H = alto, abajo = 18, izq = 40;
  const vals = datos.filter((d) => d.v != null).map((d) => d.v);
  if (vals.length < 2) return `<p class="sub">${t("Aún no hay suficientes semanas con carreras.")}</p>`;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const m = Math.max((hi - lo) * 0.15, 5); lo -= m; hi += m;
  // Ritmo: más rápido (menos s/km) arriba.
  const y = (v) => { const f = (v - lo) / (hi - lo); return 6 + (invertir ? f : 1 - f) * (H - abajo - 12); };
  const bw = (W - izq) / datos.length, x = (i) => izq + i * bw + bw / 2;
  let svg = "";
  for (const v of [lo + m, (lo + hi) / 2, hi - m])
    svg += `<line x1="${izq}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linea)"/>
      <text x="${izq - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--suave)">${formato(v).replace(/ \/(km|mi)$/, "")}</text>`;
  const pts = datos.map((d, i) => d.v == null ? null : [x(i), y(d.v)]).filter(Boolean);
  svg += `<path d="${pts.map((p, i) => (i ? "L" : "M") + p.join(",")).join("")}" fill="none" stroke="var(--acento)" stroke-width="2" stroke-linejoin="round"/>`;
  datos.forEach((d, i) => { if (d.v != null) svg += `<circle cx="${x(i)}" cy="${y(d.v)}" r="3" fill="var(--acento)" stroke="var(--panel)" stroke-width="2"/>`; });
  return `<div class="grafico" id="${id}" data-w="${W}" data-izq="${izq}" data-n="${datos.length}">
    <svg viewBox="0 0 ${W} ${H}" height="${H}">${svg}</svg><div class="tip"></div></div>`;
}

function activarGrafico(id, textos) {
  const g = $(id);
  if (!g) return;
  const W = +g.dataset.w, izq = +g.dataset.izq, n = +g.dataset.n, tip = g.querySelector(".tip");
  const mover = (e) => {
    const r = g.getBoundingClientRect(), xv = (e.clientX - r.left) / r.width * W;
    const i = Math.min(n - 1, Math.max(0, Math.floor((xv - izq) / ((W - izq) / n))));
    if (!textos[i]) return;
    tip.textContent = textos[i]; tip.style.display = "block";
    tip.style.left = ((izq + (i + 0.5) * (W - izq) / n) / W * 100) + "%";
    g.querySelectorAll("path[data-i]").forEach((b) => b.style.opacity = +b.dataset.i === i ? 1 : 0.45);
  };
  const salir = () => { tip.style.display = "none"; g.querySelectorAll("path[data-i]").forEach((b) => b.style.opacity = 1); };
  g.addEventListener("pointerdown", mover); g.addEventListener("pointermove", mover);
  g.addEventListener("pointerleave", salir); g.addEventListener("pointerup", () => setTimeout(salir, 1500));
}

        : t("Últimas 12 semanas · promedio {x} por semana", { x: fmtDistKm(promSem, 1) })}</p>
      ${barras("g-semanas", semanas.map((w) => ({ v: w.m / uM() })), { etiquetaX: (_, i) =>
        (anioPerfil ? i % 9 === 0 : i % 3 === 0) ? fechaCorta(semanas[i].ini) : "" })}</div>
    <div class="bloque"><h3>${t("Ritmo medio")}</h3>
      <p class="sub">${t(anioPerfil ? "Por mes, ponderado por distancia (más arriba, más rápido)"
        : "Por semana, ponderado por distancia (más arriba, más rápido)")}</p>
      ${linea("g-ritmo", serieRitmo.map((w) => ({ v: w.m ? w.s / (w.m / 1000) : null })), { formato: ritmo, invertir: true })}</div>
    <div class="bloque"><h3>${t("{a}, mes a mes", { a: anio })}</h3>
      <p class="sub">${t("{k} en {n} carreras con GPS", { k: fmtDist(meses.reduce((s, x) => s + x.m, 0), 0), n: num(meses.reduce((s, x) => s + x.n, 0)) })}</p>
      ${barras("g-meses", meses.map((x) => ({ v: x.m / uM() })), { etiquetaX: (_, i) => mesN(i) })}</div>
    <div class="bloque"><h3>${t("Récords")}</h3><div class="records">
      ${record(t("Más larga"), larga ? fmtDist(larga.distancia_m, 1) : "–", fecha(larga))}
      ${record(t("Mejor ritmo (≥5 km)"), rapida ? ritmo(rapida.tiempo_s / (rapida.distancia_m / 1000)) : "–", rapida ? `${fmtDist(rapida.distancia_m, 1)} · ${fecha(rapida)}` : "")}
      ${record(t("Mayor desnivel"), subida ? `${num(subida.desnivel_m)} m` : "–", fecha(subida))}
      ${record(t("Semana con más km"), mejorSem ? fmtDist(mejorSem[1], 1) : "–", mejorSem ? t("semana del {f}", { f: fechaCorta(new Date(mejorSem[0])) }) : "")}
      ${conRachaActual ? record(t("Racha actual"), `${actual} ${t(actual === 1 ? "semana" : "semanas")}`, t("seguidas corriendo")) : ""}
      ${record(t("Racha máxima"), `${maxima} ${t(maxima === 1 ? "semana" : "semanas")}`, t("seguidas corriendo"))}
    </div></div>
    <div class="bloque"><h3>${t("Hábitos")}</h3><div class="records">
      ${record(t("Día favorito"), (idioma === "en" ? DIAS_EN : idioma === "pt" ? DIAS_PT : DIAS)[dias.indexOf(Math.max(...dias))], `${Math.max(...dias)} ${t("carreras")}`)}
      ${record(t("Hora típica"), `${String(mediana(horas)).padStart(2, "0")}:00`, t("la mitad sale antes"))}
      ${record(t("Distancia típica"), fmtDist(mediana(dist), 1), t("de {n} carreras", { n: num(lista.length) }))}
      ${record(t(anioPerfil ? "Ritmo del año" : "Ritmo de siempre"), ritmo(lista.reduce((t, c) => t + c.tiempo_s, 0) / (lista.reduce((t, c) => t + c.distancia_m, 0) / 1000)), t("promedio de todas"))}
    </div></div>` : `<p class="pista">${t("Cuando lleguen tus carreras de Strava verás aquí tu volumen, ritmo, récords y hábitos.")}</p>`}
    ${POWERED_STRAVA()}`);
  pintarSync();
  $("actualizarPerfil").onclick = () => sincronizar(e);
  activarGrafico("g-semanas", semanas.map((w) => t("Semana del {f}: {k} · {n} {c}", { f: fechaCorta(w.ini), k: fmtDist(w.m, 1), n: w.n, c: t(w.n === 1 ? "carrera" : "carreras") })));
  activarGrafico("g-ritmo", anioPerfil
    ? meses.map((x, i) => x.m ? `${mesN(i)} ${anio}: ${ritmo(x.s / (x.m / 1000))}` : "")
    : semanas.map((w) => w.m ? t("Semana del {f}: {r}", { f: fechaCorta(w.ini), r: ritmo(w.s / (w.m / 1000)) }) : ""));
  document.querySelectorAll(".anios .chip").forEach((b) => { b.onclick = () => {
    anioPerfil = b.dataset.a ? +b.dataset.a : null; abrirPerfil(true, true); }; });
  if (!anioPerfil) pintarPasaporte(todas, pf, pf ? `${pf.nombre} ${pf.apellido}`.trim() : e.nombre);
  activarGrafico("g-meses", meses.map((x, i) => t("{m} {a}: {k} · {n} carreras", { m: mesN(i), a: anio, k: fmtDist(x.m, 1), n: x.n })));
}

// Vuelta de Strava: /#ciudad, /#ciudad-cancelado, /#ciudad-error, /#ciudad-sin-permiso
if (location.hash.startsWith("#ciudad")) {
  const motivo = { "#ciudad-cancelado": t("Cancelaste la conexión con Strava."),
                   "#ciudad-error": t("No se pudo completar la conexión con Strava. Intenta de nuevo."),
                   "#ciudad-limite": t("Strava todavía no deja que más personas conecten PacePath: la app está en revisión. Mientras tanto, las rutas funcionan sin conectar nada."),
                   "#ciudad-sin-permiso": t("Strava quedó conectado, pero sin permiso para leer tus actividades: desconecta y vuelve a conectar marcando ese permiso.") }[location.hash];
  history.replaceState(null, "", location.pathname);
  cambiarVista("ciudad");
  if (motivo) setTimeout(() => abrirCiudad(motivo), 0);
}

// ── Botón ES/EN ─────────────────────────────────────────────────────────────
function aplicarIdioma() {
  document.documentElement.lang = idioma;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.dataset.es ??= el.textContent.trim();
    el.textContent = t(el.dataset.es);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
    el.setAttribute("aria-label", t(el.dataset.i18nAria)); el.title = t(el.dataset.i18nAria); });
  // El botón muestra el idioma siguiente: ES → EN → PT → ES.
  const sig = IDIOMAS[(IDIOMAS.indexOf(idioma) + 1) % IDIOMAS.length];
  $("botonIdioma").textContent = sig.toUpperCase();
  $("botonIdioma").setAttribute("aria-label", { es: "Cambiar a español", en: "Switch to English", pt: "Mudar para português" }[sig]);
  $("botonUnidad").textContent = unidad === "mi" ? "KM" : "MI";
  $("botonUnidad").setAttribute("aria-label", t(unidad === "mi" ? "Ver en kilómetros" : "Ver en millas"));
  resumirOpciones();
  $("botonNoche").setAttribute("aria-label", t(noche ? "Modo día" : "Modo noche"));
}
$("botonUnidad").onclick = () => {
  unidad = unidad === "mi" ? "km" : "mi";
  try { localStorage.setItem("pp_unidad", JSON.stringify(unidad)); } catch {}
  aplicarIdioma();
  if (vista === "ciudad") abrirCiudad();
  else if (vista === "perfil") abrirPerfil(true, true);
  else if (vista === "entreno") abrirEntreno();
  else if (document.body.classList.contains("con-ruta") && planActual) mostrar(planActual);
};
$("botonIdioma").onclick = () => {
  idioma = IDIOMAS[(IDIOMAS.indexOf(idioma) + 1) % IDIOMAS.length];
  try { localStorage.setItem("pp_lang", JSON.stringify(idioma)); } catch {}
  aplicarIdioma();
  // Lo que está en pantalla se vuelve a pedir/dibujar en el idioma nuevo.
  if (vista === "ciudad") abrirCiudad();
  else if (vista === "perfil") abrirPerfil(true);
  else if (modo === "trazar" && puntos.length > 1) recalcular(null);
  else if (document.body.classList.contains("con-ruta")) $("form").requestSubmit();
  else inicioHoja(t("Elige desde dónde sales: escribe una calle o esquina, usa «Cerca de mí» o toca el mapa."));
};

// Tema y capa iniciales (lo último: usa todo lo de arriba).
aplicarIdioma();
ponerNoche(noche);
medirCabecera();
// ── Comentarios de la beta: se escriben aquí y se mandan por WhatsApp (el
// corredor elige el grupo). Va un poco de contexto para entender el caso.
$("hoja").addEventListener("click", (e) => { if (e.target.closest("[data-comentario]")) abrirComentario(); });
// ── Mis datos: descargar una copia de todo lo de tu cuenta, o borrarla ──────
$("hoja").addEventListener("click", (e) => {
  if (!e.target.closest("[data-misdatos]")) return;
  hoja(`<h3>${t("Mis datos")}</h3>
    <p class="pista">${t("Descarga una copia de todo lo que PacePath guarda de tu cuenta, o bórrala para siempre. Tus carreras de Strava no están en el servidor: viven sólo en tu teléfono.")}</p>
    <p><button type="button" class="sec" onclick="location.href='/api/cuenta/exportar'">⬇ ${t("Descargar mis datos")}</button></p>
    <p><button type="button" class="sec" data-borrar-cuenta>${t("Borrar mi cuenta")}</button></p>
    <p><button type="button" class="sec" data-volver-vista>← ${t("Volver")}</button></p>`);
});
// «Volver» desde una pantalla suelta (p. ej. Mis datos): a lo que había en la pestaña.
$("hoja").addEventListener("click", (e) => {
  if (!e.target.closest("[data-volver-vista]")) return;
  if (vista === "ciudad") abrirCiudad();
  else if (vista === "perfil") abrirPerfil(true, true);
  else if (vista === "entreno") abrirEntreno();
  else if (document.body.classList.contains("con-ruta") && planActual) mostrar(planActual);
  else inicioHoja(t("Elige desde dónde sales: escribe una calle o esquina, usa «Cerca de mí» o toca el mapa."));
});
$("hoja").addEventListener("click", async (e) => {
  if (!e.target.closest("[data-borrar-cuenta]")) return;
  if (!confirm(t("¿Borrar tu cuenta para siempre? Se borran tus preferencias, rutas guardadas y la conexión con Strava. No se puede deshacer."))) return;
  const r = await fetch("/api/cuenta/borrar", { method: "POST", headers: { "Content-Type": "application/json" },
                                               body: JSON.stringify({ confirmo: true }) }).catch(() => null);
  if (!r?.ok) return hoja(`<p class="aviso">${t("No pude borrar tu cuenta. Inténtalo de nuevo en un rato.")}</p>`);
  try { localStorage.clear(); } catch {}
  await BD.borrar().catch(() => {}); await BDE.borrar().catch(() => {});
  alert(t("Listo: tu cuenta y sus datos se borraron."));
  location.href = "/";
});
$("hoja").addEventListener("click", async (e) => {
  if (!e.target.closest("[data-salir]")) return;
  await fetch("/api/auth/salir", { method: "POST" }).catch(() => {});
  location.reload();
});
function contextoComentario() {
  const ua = navigator.userAgent, equipo = /iPhone|iPad/.test(ua) ? "iPhone" : /Android/.test(ua) ? "Android" : "computador";
  const app = window.matchMedia("(display-mode: standalone)").matches ? "app" : "navegador";
  const cosas = [t("vista: {v}", { v: { hoy: t("Hoy"), ciudad: t("Mis lugares"), perfil: t("Perfil") }[vista] || vista })];
  if (vista === "hoy") cosas.push(modo === "trazar" ? t("trazar a mano") : t("sesión «{s}»", { s: $("texto").value }));
  if (vista === "hoy" && $("desde").value) cosas.push(t("desde {d}", { d: $("desde").value }));
  cosas.push(`${equipo} · ${app} · ${idioma.toUpperCase()}`);
  return cosas.join(" · ");
}
function abrirComentario() {
  const d = $("dlgComentario");
  d.querySelector("h3").textContent = t("Enviar comentario");
  d.querySelector("p").textContent = t("¿Qué funcionó, qué no, qué te gustaría? Se abre WhatsApp con tu mensaje: elige el grupo de la beta.");
  d.querySelector("textarea").placeholder = t("Ej.: la ruta de series me mandó por una calle con mucho tráfico…");
  d.querySelector("label span").textContent = t("Incluir lo que estaba haciendo ({c})", { c: contextoComentario() });
  d.querySelector("#enviarComentario").textContent = t("Enviar por WhatsApp");
  d.querySelector("#cancelarComentario").textContent = t("Cancelar");
  d.showModal();
  d.querySelector("textarea").focus();
}
$("cancelarComentario").onclick = () => $("dlgComentario").close();
$("dlgComentario").addEventListener("click", (e) => { if (e.target === $("dlgComentario")) $("dlgComentario").close(); });
$("enviarComentario").onclick = () => {
  const texto = $("dlgComentario").querySelector("textarea").value.trim();
  if (!texto) { $("dlgComentario").querySelector("textarea").focus(); return; }
  const contexto = $("conContexto").checked ? `\n\n(${contextoComentario()})` : "";
  fetch("/api/evento", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tipo: "comentario", detalle: vista }) }).catch(() => {});
  window.open("https://wa.me/?text=" + encodeURIComponent(`PacePath beta — ${texto}${contexto}`), "_blank", "noopener");
  $("dlgComentario").querySelector("textarea").value = "";
  $("dlgComentario").close();
};

// Clics en «Apoya PacePath» (para saber si el botón sirve; sin datos personales).
document.addEventListener("click", (e) => {
  if (e.target.closest?.("[data-aporte]")) _fetch("/api/evento", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tipo: "aporte", detalle: vista }) }).catch(() => {});
});
// Errores de la interfaz: se cuentan (anónimos, máx. 5 por visita) para arreglarlos.
let erroresEnviados = 0;
const reportarError = (msg) => {
  if (++erroresEnviados > 5 || !msg) return;
  navigator.sendBeacon?.("/api/evento", new Blob([JSON.stringify({ tipo: "error_js", detalle: String(msg).slice(0, 190) })],
    { type: "application/json" }));
};
window.addEventListener("error", (e) => reportarError(e.message));
window.addEventListener("unhandledrejection", (e) => reportarError(e.reason?.message || e.reason));
window.addEventListener("appinstalled", () => fetch("/api/evento", { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ tipo: "instalar" }) }).catch(() => {}));

// App instalable: el service worker (no guarda nada en caché).
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
// Al abrir: la pista con tus sesiones guardadas y recientes (si no vienes de Strava).
if (vista === "hoy" && !document.body.classList.contains("con-ruta"))
  inicioHoja(t("Elige desde dónde sales: escribe una calle o esquina, usa «Cerca de mí» o toca el mapa."));
</script>
</body>
</html>
