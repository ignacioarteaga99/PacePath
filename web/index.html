function encuadrarCalor(lista) {
  // Encuadrar donde corres de verdad: alrededor de la mediana de las salidas,
  // sin que una carrera en otra ciudad aleje el mapa.
  const ini = lista.map((c) => (c.puntos || (c.puntos = decodificar(c.polilinea)))[0]).filter(Boolean);
  const med = (k) => ini.map((p) => p[k]).sort((a, b) => a - b)[ini.length >> 1];
  const centro = [med(0), med(1)];
  const cerca = lista.filter((c) => distM(c.puntos[0], centro) < 25000).flatMap((c) => c.puntos);
  if (cerca.length) mapa.fitBounds(L.latLngBounds(cerca), { padding: [20, 20],
    paddingBottomRight: [70, esEscritorio() ? 20 : $("hoja").offsetHeight + 70], animate: false });
}

// Sincronización con Strava. Estado en este teléfono («pp_sync»):
//   completo: ya se trajo el historial entero (después sólo se pide lo nuevo)
//   pagina:   si la descarga del historial se cortó, por qué página seguir
//   ultima:   cuándo terminó bien la última vez · error: por qué falló la última
// Antes, si la descarga se cortaba a la mitad, las carreras antiguas no se
// pedían nunca más (sólo «lo posterior a la más nueva»).
const leerSync = () => leer("pp_sync", {}) || {};
const guardarSync = (st) => escribir("pp_sync", st);
const SYNC_AUTO_MIN = 15;          // al abrir Mi ciudad o Perfil, sincronizar sólo si pasó este rato
let sincronizando = null;

function haceCuanto(iso) {
  const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (!(min >= 1)) return t("hace un momento");
  if (min < 60) return t("hace {n} min", { n: min });
  if (min < 48 * 60) return t("hace {n} h", { n: Math.round(min / 60) });
  return t("hace {n} días", { n: Math.round(min / 1440) });
}
function textoSync() {
  const st = leerSync();
  if (st.error) return { txt: st.pagina > 1 ? t("La descarga se cortó ({n} carreras traídas): {e} Toca «Actualizar» para seguir donde quedó.", { n: num(st.vistas || 0), e: st.error })
    : t("No pude sincronizar: {e}", { e: st.error }), mal: true };
  if (st.ultima) return { txt: t("Última sincronización con Strava: {h}.", { h: haceCuanto(st.ultima) }), mal: false };
  return { txt: "", mal: false };
}
// progreso: undefined = sin barra; null = barra sin porcentaje; 0–100 = barra.
let ultimoProgreso = null;
function pintarSync(txt, mal, progreso) {
  const el = $("sync");
  if (!el) return;
  if (txt === undefined) {
    if (sincronizando && ultimoProgreso) ({ txt, progreso } = ultimoProgreso);     // la vista se repintó a mitad
    else ({ txt, mal } = sincronizando ? { txt: t("Sincronizando con Strava…"), mal: false } : textoSync());
  }
  el.innerHTML = `<span>${esc(txt)}</span>` + (progreso === undefined ? ""
    : `<span class="progreso${progreso === null ? " indef" : ""}" role="progressbar"${progreso === null ? "" : ` aria-valuenow="${progreso}"`}><i style="width:${progreso ?? 30}%"></i></span>`);
  el.classList.toggle("mal", !!mal);
}
const necesitaSync = () => { const st = leerSync(); return !st.completo || !st.ultima || st.error
  || Date.now() - Date.parse(st.ultima) > SYNC_AUTO_MIN * 60000; };

// Una página de actividades, con reintentos cuando el servidor está despertando
// o Strava falla un momento (no ante «espera» ni «vuelve a conectar»).
async function paginaStrava(pagina, despues) {
  const url = `/api/strava/actividades?pagina=${pagina}${despues ? "&despues=" + despues : ""}`;
  let ultimoError;
  for (const espera of [0, 2500, 6000]) {
    if (espera) await new Promise((ok) => setTimeout(ok, espera));
    let r;
    try { r = await fetch(url); } catch { ultimoError = new Error(t("Sin conexión con PacePath.")); continue; }
    const j = await r.json().catch(() => null);          // Render despertando responde HTML
    if (r.ok && j) return j;
    ultimoError = new Error((j && j.detail) || t("El servidor respondió {c}.", { c: r.status }));
    if ([401, 429].includes(r.status)) break;
  }
  throw ultimoError;
}

function sincronizar(e, opciones = {}) {
  if (!sincronizando) sincronizando = _sincronizar(e, opciones).finally(() => { sincronizando = null; });
  return sincronizando;
}
async function _sincronizar(e, { todo = false } = {}) {
  let st = leerSync();
  let lista = await BD.todas();
  // Carreras guardadas antes de que el perfil pidiera tiempo y desnivel: se
  // vuelven a traer una vez.
  if (lista.some((c) => c.tiempo_s === undefined)) { await BD.borrar(); lista = []; st = {}; }
  if (todo || !lista.length) st = {};
  const historial = !st.completo;                       // traer todo (o seguir donde se cortó)
  // Con el historial completo, sólo lo nuevo; una semana de margen por las
  // carreras que se suben a Strava días después.
  const masNueva = lista.map((c) => c.fecha).sort().at(-1);
  const despues = !historial && masNueva ? Math.floor(Date.parse(masNueva) / 1000) - 7 * 86400 : null;
  const yaEstaban = new Set(lista.map((c) => c.id));
  let pagina = historial ? (st.pagina || 1) : 1, nuevas = 0, paginas = 0;
  // Progreso del historial: carreras recibidas (de la más nueva hacia atrás)
  // sobre el total de carreras del perfil de Strava. Las de cinta no traen
  // mapa y no llegan, así que se topa en 99 % hasta terminar.
  let vistas = historial ? (st.vistas || 0) : 0;
  if (historial && !perfilGuardado) perfilGuardado = await fetch("/api/strava/perfil").then((r) => r.ok ? r.json() : null).catch(() => null);
  const total = historial ? perfilGuardado?.historico?.carreras || 0 : 0;
  const avance = () => {
    ultimoProgreso = !historial ? { txt: t("Buscando carreras nuevas en Strava…"), progreso: null }
      : total ? { txt: t("Trayendo tu historial de Strava… {p} % ({n} de {t} carreras)", { p: Math.min(99, Math.round(100 * vistas / total)), n: num(vistas), t: num(total) }),
                  progreso: Math.min(99, Math.round(100 * vistas / total)) }
      : { txt: t("Trayendo tu historial de Strava… {n} carreras", { n: num(vistas) }), progreso: null };
    pintarSync(ultimoProgreso.txt, false, ultimoProgreso.progreso);
  };
  try {
    for (;;) {
      avance();
      const j = await paginaStrava(pagina, despues);
      await BD.guardar(j.carreras);
      nuevas += j.carreras.filter((c) => !yaEstaban.has(c.id)).length;
      vistas += j.carreras.length;
      paginas++;
      if (j.ultima) break;
      pagina++;
      if (historial) guardarSync({ ...st, pagina, vistas, error: null });
    }
    ultimoProgreso = null;
    guardarSync({ completo: true, ultima: new Date().toISOString() });
    _fetch("/api/evento", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tipo: "sync", detalle: `${historial ? "historial" : "nuevas"} · ${paginas} pág · ${nuevas} nuevas · ${yaEstaban.size + nuevas} en total` }) }).catch(() => {});
  } catch (err) {
    ultimoProgreso = null;
    guardarSync({ ...st, pagina: historial ? pagina : undefined, vistas: historial ? vistas : undefined, error: err.message, fallo: new Date().toISOString() });
    _fetch("/api/evento", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tipo: "sync_error", detalle: `página ${pagina}${historial ? " del historial" : ""}: ${err.message}`.slice(0, 200) }) }).catch(() => {});
  }
  // Repintar sólo si sigue en la vista que lo pidió (antes pintaba el mapa de
  // calor encima de «Hoy» si cambiabas de pestaña a mitad de la descarga).
  if (nuevas && vista === "perfil") await abrirPerfil(true, true);
  else if (nuevas && vista === "ciudad") await dibujarCalor(e, null, !lista.length);
  const fin = textoSync();
  pintarSync(nuevas && !fin.mal ? t("{n} carreras nuevas.", { n: nuevas }) + " " + fin.txt : fin.txt, fin.mal);
}

// ── Pasaporte: logros, puntos y nivel ───────────────────────────────────────
// Todo se calcula en este teléfono con tus carreras (no hay rankings: los
// datos de Strava son sólo para su dueño). Los lugares vienen de
// lugaresDeCarreras; «Tu calle», de las calles de siempre del servidor.
const TIER = ["", "bronce", "plata", "oro"];
const PUNTOS_TIER = [0, 50, 150, 400];          // al llegar a cada nivel (se suman)
const CONTINENTES = ["AF", "AS", "EU", "NA", "SA", "OC"];      // los seis habitados
const NOMBRE_CONT = { AF: "África", AS: "Asia", EU: "Europa", NA: "Norteamérica", SA: "Sudamérica", OC: "Oceanía", AN: "Antártica" };
const NIVELES = ["Trotador", "Corredor", "Fondista", "Maratonista", "Ultra", "Leyenda"];
const nivelDe = (xp) => Math.floor(Math.sqrt(Math.max(0, xp) / 50)) + 1;           // nivel L desde 50·(L−1)² puntos
const xpDeNivel = (L) => 50 * (L - 1) ** 2;
const nombreNivel = (L) => t(NIVELES[Math.min(NIVELES.length - 1, Math.floor((L - 1) / 5))]);

function rachaMaxima(lista) {
  const sem = new Set(lista.map((c) => lunes(localDe(c)).getTime()));
  let max = 0, corrida = 0, prev = null;
  for (const k of [...sem].sort((a, b) => a - b)) {
    corrida = prev !== null && Math.round((k - prev) / (7 * 864e5)) === 1 ? corrida + 1 : 1;
    max = Math.max(max, corrida); prev = k;
  }
  return max;
}

function calcularPasaporte(lista, lugares, pf, calles) {
  const ciudades = new Set(), paises = new Set(), conts = new Set();
  const ciudadesPorPais = new Map(), porBarrio = new Map(), porCiudad = new Map();
  const porPais = new Map(), paisesDeCont = new Map();        // para las explicaciones
  let madrugadas = 0, noches = 0;
  for (const c of lista) {
    const h = localDe(c).getHours();
    if (h < 7) madrugadas++; else if (h >= 21) noches++;
    const L = lugares.get(c.id);
    if (!L) continue;
    if (L.continente) conts.add(L.continente);
    if (L.pais) paises.add(L.pais);
    if (L.pais) {
      const x = porPais.get(L.pais) || { carreras: 0, km: 0, primera: c };
      x.carreras++; x.km += c.distancia_m / 1000; if (localDe(c) < localDe(x.primera)) x.primera = c;
      porPais.set(L.pais, x);
      if (L.continente) { if (!paisesDeCont.has(L.continente)) paisesDeCont.set(L.continente, new Set());
        paisesDeCont.get(L.continente).add(L.pais); }
    }
    if (L.ciudad && !L.cerca) {
      const k = L.pais + "|" + L.ciudad;
      ciudades.add(k);
      if (!ciudadesPorPais.has(L.pais)) ciudadesPorPais.set(L.pais, new Set());
      ciudadesPorPais.get(L.pais).add(L.ciudad);
      porCiudad.set(k, (porCiudad.get(k) || 0) + 1);
    }
    if (L.barrio) { const k = L.pais + "|" + L.barrio; porBarrio.set(k, (porBarrio.get(k) || 0) + 1); }
  }
  const top = (m) => [...m.entries()].sort((a, b) => b[1] - a[1])[0] || null;
  const tb = top(porBarrio), tc = top(porCiudad);
  const tp = [...ciudadesPorPais.entries()].sort((a, b) => b[1].size - a[1].size)[0];
  const km = Math.max(lista.reduce((s, c) => s + c.distancia_m, 0) / 1000, pf?.historico?.km || 0);
  const barrio = tb ? tb[0].split("|")[1] : null, ciudad = tc ? tc[0].split("|")[1] : null;
  const calle = calles?.[0] || null, paisTop = tp ? nombrePais(tp[0]) : null;
  const L = (id, icono, grupo, valor, umbrales, nombres, extra = {}) => {
    const tier = umbrales.filter((u) => valor >= u).length;
    return { id, icono, grupo, valor, umbrales, nombres, tier, ...extra };
  };
  const logros = [
    // Explorador
    L("ciudades", "🏙️", "explorador", ciudades.size, [5, 15, 40], [t("Viajero"), t("Trotamundos"), t("Nómada")], { unidad: t("ciudades") }),
    L("paises", "🛂", "explorador", paises.size, [3, 10, 25], [t("Pasaporte sellado"), t("Ciudadano del mundo"), t("Embajador")], { unidad: t("países") }),
    L("continentes", "🌍", "explorador", CONTINENTES.filter((x) => conts.has(x)).length, [2, 4, 6],
      [t("Intercontinental"), t("Cuatro continentes"), t("Los seis continentes")], { unidad: t("continentes") }),
    L("pais", "🗺️", "explorador", tp ? tp[1].size : 0, [5, 10, 20],
      paisTop ? [t("Turista en {p}", { p: paisTop }), t("Conoce {p}", { p: paisTop }), t("{p} de punta a punta", { p: paisTop })]
              : [t("Conoce tu país"), t("Conoce tu país"), t("Conoce tu país")], { unidad: t("ciudades en un país") }),
    L("antartica", "🐧", "explorador", conts.has("AN") ? 1 : 0, [1, 1, 1], [t("Antártica"), t("Antártica"), t("Antártica")],
      { secreto: true, unidad: "" }),
    // Local
    L("barrio", "🏘️", "local", tb ? tb[1] : 0, [25, 100, 300], barrio
      ? [t("Vecino de {b}", { b: barrio }), t("Leyenda local de {b}", { b: barrio }), t("Ícono de {b}", { b: barrio })]
      : [t("Vecino"), t("Leyenda local"), t("Ícono del barrio")], { unidad: barrio ? t("carreras en {b}", { b: barrio }) : t("carreras en tu barrio") }),
    L("ciudad", "📍", "local", tc ? tc[1] : 0, [100, 300, 1000], ciudad
      ? [t("Corredor de {c}", { c: ciudad }), t("Dueño de {c}", { c: ciudad }), t("{c} es tuyo", { c: ciudad })]
      : [t("Corredor local"), t("Dueño de tu ciudad"), t("Tu ciudad es tuya")], { unidad: ciudad ? t("carreras en {c}", { c: ciudad }) : t("carreras en tu ciudad") }),
    L("calle", "🛣️", "local", calle ? calle.veces : 0, [20, 50, 100], calle
      ? [t("Habitual de {s}", { s: calle.nombre }), t("Experto en {s}", { s: calle.nombre }), t("Rey de {s}", { s: calle.nombre })]
      : [t("Tu calle"), t("Tu calle"), t("Tu calle")], { unidad: calle ? t("veces por {s}", { s: calle.nombre }) : t("veces por tu calle"),
        pendiente: calles === undefined }),
    // Constancia y volumen
    L("km", "🌐", "constancia", Math.round(km), [1000, 5000, 40075], [t("Mil kilómetros"), t("Cinco mil"), t("Vuelta al mundo")], { unidad: "km" }),
    L("racha", "🔥", "constancia", rachaMaxima(lista), [4, 12, 52], [t("Constante"), t("Imparable"), t("Un año sin parar")], { unidad: t("semanas seguidas") }),
    L("madrugador", "🌅", "constancia", madrugadas, [10, 50, 150], [t("Madrugador"), t("Madrugador"), t("Madrugador")], { unidad: t("carreras antes de las 7:00") }),
    L("nocturno", "🌙", "constancia", noches, [10, 50, 150], [t("Nocturno"), t("Nocturno"), t("Nocturno")], { unidad: t("carreras después de las 21:00") }),
  ];
  const puntos = { km: Math.round(km), ciudades: 25 * ciudades.size, paises: 100 * paises.size, continentes: 500 * conts.size,
                   logros: logros.reduce((s, x) => s + PUNTOS_TIER.slice(0, x.tier + 1).reduce((a, b) => a + b, 0), 0) };
  const xp = Object.values(puntos).reduce((a, b) => a + b, 0);
  return { logros, xp, puntos, nivel: nivelDe(xp), paises: [...paises], conts, ciudades: ciudades.size,
           porPais, ciudadesPorPais, paisesDeCont };
}

// Qué mide cada logro (para la burbuja de explicación).
function queMide(x) {
  const n = x.nombres[2];
  return {
    ciudades: t("Ciudades distintas donde has corrido."),
    paises: t("Países donde has corrido."),
    continentes: t("Continentes habitados donde has corrido: África, Asia, Europa, Norteamérica, Sudamérica y Oceanía."),
    pais: t("Ciudades distintas dentro de un mismo país (el tuyo con más ciudades)."),
    antartica: t("Logro secreto: correr en la Antártica."),
    barrio: t("Carreras que empiezan en tu comuna o barrio más corrido."),
    ciudad: t("Carreras en tu ciudad más corrida."),
    calle: t("Veces que pasaste por el tramo más corrido de tu calle favorita."),
    km: t("Kilómetros totales corridos (el total de Strava)."),
    racha: t("Tu racha más larga de semanas seguidas con al menos una carrera."),
    madrugador: t("Carreras que empiezan antes de las 7:00."),
    nocturno: t("Carreras que empiezan a las 21:00 o después."),
  }[x.id] || n;
}
function infoLogro(x) {
  const [b, p, o] = x.umbrales, falta = x.tier < 3 ? x.umbrales[x.tier] - x.valor : 0;
  const estado = x.tier === 3 ? t("¡Oro conseguido!")
    : t("Te faltan {n} para {nivel}: «{l}».", { n: num(falta), nivel: t(TIER[x.tier + 1]), l: esc(x.nombres[x.tier]) });
  return `${queMide(x)}<br><span class="umb">${x.secreto ? "" : t("Bronce {b} · Plata {p} · Oro {o}", { b: num(b), p: num(p), o: num(o) }) + " · "}${t("Tienes {v}.", { v: num(x.valor) })}</span><br>${estado}`;
}

// Lo próximo: el logro al que le falta menos (en proporción) para subir.
function loProximo(P) {
  const c = P.logros.filter((x) => !x.secreto && x.tier < 3 && !x.pendiente)
    .map((x) => ({ x, sig: x.umbrales[x.tier], f: x.valor / x.umbrales[x.tier] })).sort((a, b) => b.f - a.f)[0];
  if (!c) return "";
  return t("Te faltan {n} {u} para «{l}».", { n: num(c.sig - c.x.valor), u: c.x.unidad, l: c.x.nombres[c.x.tier] });
}

function htmlPasaporte(P) {
  const L = P.nivel, desde = xpDeNivel(L), hasta = xpDeNivel(L + 1);
  const avance = Math.round((P.xp - desde) / (hasta - desde) * 100);
  const info = (tit, txt) => `tabindex="0" data-tit="${esc(tit)}" data-txt="${esc(txt)}"`;
  const fechaLarga = (c) => localDe(c).toLocaleDateString(idioma === "en" ? "en-US" : "es-CL", { day: "numeric", month: "long", year: "numeric" });
  const sellos = P.paises.filter((x) => x && x !== "AQ").map((cc) => {
    const d = P.porPais.get(cc), cs = [...(P.ciudadesPorPais.get(cc) || [])];
    const txt = t("{n} carreras · {k} km", { n: num(d.carreras), k: num(d.km) })
      + (cs.length ? "<br>" + t("Ciudades: {c}", { c: esc(cs.slice(0, 5).join(", ") + (cs.length > 5 ? "…" : "")) }) : "")
      + "<br>" + t("Primera vez: {f}", { f: fechaLarga(d.primera) })
      + "<br><span class=\"umb\">" + t("Cada país nuevo suma 100 puntos.") + "</span>";
    return `<span class="sello" ${info(bandera(cc) + " " + nombrePais(cc), txt)}>${bandera(cc)}</span>`;
  }).join("");
  const conts = [...CONTINENTES, ...(P.conts.has("AN") ? ["AN"] : [])].map((x) => {
    const ps = [...(P.paisesDeCont.get(x) || [])];
    const txt = ps.length ? t("Has corrido en {p}.", { p: esc(ps.map(nombrePais).join(", ")) }) + "<br><span class=\"umb\">" + t("Continente conseguido: +500 puntos.") + "</span>"
      : t("Aún no corres aquí. La primera carrera en este continente suma 500 puntos.");
    return `<span class="cont${P.conts.has(x) ? " on" : ""}" ${info(t(NOMBRE_CONT[x]), txt)}>${t(NOMBRE_CONT[x])}</span>`;
  }).join("");
  const infoNivel = info(t("Nivel {n} · {nombre}", { n: L, nombre: nombreNivel(L) }),
    t("Subes de nivel con puntos: 1 por km, 25 por ciudad nueva, 100 por país, 500 por continente y 50, 150 o 400 por cada logro de bronce, plata u oro.")
    + "<br>" + t("Te faltan {n} puntos para el nivel {s}.", { n: num(hasta - P.xp), s: L + 1 }));
  const tarjeta = (x) => {
    if (x.secreto && !x.tier) return "";
    const sig = x.tier < 3 ? x.umbrales[x.tier] : null;
    const nombre = x.nombres[Math.max(0, x.tier - 1)];
    const pct = sig ? Math.min(100, Math.round(x.valor / sig * 100)) : 100;
    return `<div class="logro t${x.tier}" ${info(x.icono + " " + (x.tier ? nombre : x.nombres[0]), infoLogro(x))}>
      <div class="medalla">${x.icono}</div>
      <b>${esc(x.tier ? nombre : x.nombres[0])}</b>
      <small>${x.pendiente ? t("calculando…") : sig ? `${num(x.valor)} / ${num(sig)} ${esc(x.unidad)}` : `${num(x.valor)} ${esc(x.unidad)}`}</small>
      <i style="--p:${pct}%"></i>${x.tier ? `<span class="tier">${t(TIER[x.tier])}</span>` : ""}</div>`;
  };
  const grupo = (g, titulo) => `<h4>${titulo}</h4><div class="logros">${P.logros.filter((x) => x.grupo === g).map(tarjeta).join("")}</div>`;
  return `<div class="pasaporte">
    <div class="pas-cab"><div class="nivel" ${infoNivel}><span>${L}</span></div>
      <div class="pas-nivel"><small>${t("Pasaporte")} · ${t("Nivel {n}", { n: L })}</small><b>${nombreNivel(L)}</b>
        <div class="xp"><i style="width:${avance}%"></i></div>
        <small>${num(P.xp)} / ${num(hasta)} ${t("puntos")}</small></div></div>
    <p class="proximo">${loProximo(P)}</p>
    ${sellos ? `<div class="sellos">${sellos}</div>` : ""}
    <div class="conts">${conts}</div>
    <h3>${t("Logros")}</h3>
    ${grupo("explorador", "🌍 " + t("Explorador"))}${grupo("local", "📍 " + t("Local"))}${grupo("constancia", "🔥 " + t("Constancia"))}
    <details class="como"><summary>${t("Cómo se ganan los puntos")}</summary>
      <p>${t("1 punto por km · 25 por ciudad nueva · 100 por país · 500 por continente · 50, 150 y 400 por logro de bronce, plata y oro.")}</p>
      <p>${t("Tus puntos: {km} por km, {c} por ciudades, {p} por países, {o} por continentes y {l} por logros.",
        { km: num(P.puntos.km), c: num(P.puntos.ciudades), p: num(P.puntos.paises), o: num(P.puntos.continentes), l: num(P.puntos.logros) })}</p></details>
    <button class="sec" id="compartirPasaporte" type="button">${t("Compartir mi pasaporte")}</button>
  </div>`;
}

// Burbuja de explicación: al pasar el mouse (si hay) o al tocar un sello,
// continente, logro o el nivel. Otro toque, o tocar fuera, la cierra.
function activarInfoPasaporte() {
  const caja = $("pasaporte")?.querySelector(".pasaporte");
  if (!caja) return;
  const burbuja = document.createElement("div");
  burbuja.className = "pas-info"; burbuja.hidden = true; burbuja.setAttribute("role", "tooltip");
  caja.appendChild(burbuja);
  const conMouse = () => window.matchMedia("(hover: hover)").matches;
  let actual = null;
  const mostrar = (el) => {
    burbuja.innerHTML = `<b></b>${el.dataset.txt}`;        // txt ya viene escapado; el título va como texto
    burbuja.firstChild.textContent = el.dataset.tit;
    burbuja.hidden = false;
    const r = el.getBoundingClientRect(), c = caja.getBoundingClientRect(), w = burbuja.offsetWidth;
    burbuja.style.left = Math.max(8, Math.min(c.width - w - 8, r.left - c.left + r.width / 2 - w / 2)) + "px";
    burbuja.style.top = (r.bottom - c.top + 8) + "px";
    burbuja.style.setProperty("--flecha", Math.max(14, Math.min(w - 14, r.left - c.left + r.width / 2 - parseFloat(burbuja.style.left))) + "px");
    actual = el;
  };
  const ocultar = () => { burbuja.hidden = true; actual = null; };
  caja.addEventListener("mouseover", (e) => { const el = e.target.closest("[data-tit]"); if (el && conMouse()) mostrar(el); });
  caja.addEventListener("mouseout", (e) => { const el = e.target.closest("[data-tit]");
    if (el && conMouse() && !el.contains(e.relatedTarget)) ocultar(); });
  caja.addEventListener("click", (e) => { const el = e.target.closest("[data-tit]");
    if (!el) return ocultar();
    if (actual === el && !conMouse()) ocultar(); else mostrar(el); });
  // Con teclado (Tab) también; el foco que deja un toque no cuenta (lo maneja el click).
  caja.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tit]"); if (el && el.matches(":focus-visible")) mostrar(el); });
  caja.addEventListener("focusout", ocultar);
  $("hoja").addEventListener("scroll", ocultar, { passive: true });
}

// Logros nuevos desde la última vez: un aviso (la primera vez, sólo se guardan).
function avisarLogrosNuevos(P) {
  const ahora = P.logros.filter((x) => x.tier).map((x) => `${x.id}:${x.tier}`);
  const vistos = pref("pp_logros_vistos", null);
  guardarPref("pp_logros_vistos", ahora);
  if (!Array.isArray(vistos)) return;
  const nuevos = P.logros.filter((x) => x.tier && !vistos.includes(`${x.id}:${x.tier}`));
  if (!nuevos.length) return;
  const d = document.createElement("div");
  d.className = "toast-logro";
  d.innerHTML = `<b>${t(nuevos.length === 1 ? "¡Nuevo logro!" : "¡Nuevos logros!")}</b>` +
    nuevos.slice(0, 3).map((x) => `<span>${x.icono} ${esc(x.nombres[x.tier - 1])} · ${t(TIER[x.tier])}</span>`).join("");
  document.body.appendChild(d);
  setTimeout(() => d.classList.add("fuera"), 4200);
  setTimeout(() => d.remove(), 5000);
}

// Tarjeta para compartir (sólo si tú lo decides): imagen 1080×1350.
async function compartirPasaporte(P, nombre) {
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const fondo = g.createRadialGradient(W, 0, 50, W, 0, 1000);
  fondo.addColorStop(0, "#7a2a10"); fondo.addColorStop(1, "#121216");
  g.fillStyle = fondo; g.fillRect(0, 0, W, H);
  const f = (peso, px) => `${peso} ${px}px Inter, -apple-system, system-ui, sans-serif`;
  // Logo: el mismo trazo del ícono (viewBox 26×26)
  g.fillStyle = "#f2541b"; g.beginPath(); g.roundRect(72, 72, 64, 64, 16); g.fill();
  g.save(); g.translate(72, 72); g.scale(64 / 26, 64 / 26);
  g.strokeStyle = "#fff"; g.lineCap = "round"; g.lineWidth = 2.4;
  g.stroke(new Path2D("M7.5 19.5c0-4 4-4 5.5-6.5s-1.5-4.5 0-6.5c.7-.8 1.6-1 2.5-1"));
  g.fillStyle = "#fff"; g.beginPath(); g.arc(7.5, 19.5, 2.2, 0, 7); g.fill();
  g.lineWidth = 1.8; g.beginPath(); g.arc(18.6, 5.6, 2.1, 0, 7); g.stroke(); g.restore();
  const recortar = (txt, max) => { if (g.measureText(txt).width <= max) return txt;
    while (txt.length > 1 && g.measureText(txt + "…").width > max) txt = txt.slice(0, -1);
    return txt.trimEnd() + "…"; };
  g.fillStyle = "#fff"; g.font = f(800, 40); g.fillText("PacePath", 156, 118);
  // Tu foto de Strava (la trae el servidor: con una imagen de otro dominio el
  // navegador no deja exportar la tarjeta). Sin foto, el nombre usa todo el ancho.
  const foto = await fetch("/api/strava/foto").then((r) => r.ok ? r.blob() : null)
    .then((b) => b ? createImageBitmap(b) : null).catch(() => null);
  const R = 96, fx = W - 72 - R, fy = 270;
  if (foto) {
    g.save(); g.beginPath(); g.arc(fx, fy, R, 0, 7); g.clip();
    const k = Math.max(2 * R / foto.width, 2 * R / foto.height);           // cubrir el círculo
    g.drawImage(foto, fx - foto.width * k / 2, fy - foto.height * k / 2, foto.width * k, foto.height * k);
    g.restore();
    const anillo = g.createLinearGradient(fx - R, fy - R, fx + R, fy + R);
    anillo.addColorStop(0, "#ffb36b"); anillo.addColorStop(1, "#f2541b");
    g.strokeStyle = anillo; g.lineWidth = 8; g.beginPath(); g.arc(fx, fy, R + 6, 0, 7); g.stroke();
  }
  const anchoNombre = foto ? fx - R - 40 - 72 : W - 144;
  g.fillStyle = "#ff9a6b"; g.font = f(700, 26); g.fillText(t("PASAPORTE DEL CORREDOR"), 72, 230);
  g.fillStyle = "#fff"; g.font = f(800, 72); g.fillText(recortar(nombre || "", anchoNombre), 72, 316);
  g.font = f(800, 150); g.fillStyle = "#ff8a4f"; g.fillText(String(P.nivel), 72, 500);
  const ancho = g.measureText(String(P.nivel)).width;
  g.fillStyle = "#fff"; g.font = f(800, 56); g.fillText(nombreNivel(P.nivel), 72 + ancho + 30, 440);
  g.fillStyle = "rgba(255,255,255,.7)"; g.font = f(500, 30); g.fillText(`${num(P.xp)} ${t("puntos")}`, 72 + ancho + 30, 488);
  const datos = [[P.paises.filter((x) => x !== "AQ").length, t("países")], [P.ciudades, t("ciudades")],
                 [CONTINENTES.filter((x) => P.conts.has(x)).length, t("continentes")], [P.puntos.km, "km"]];
  datos.forEach(([v, e], i) => { const x = 72 + i * 240;
    g.fillStyle = "#fff"; g.font = f(800, 60); g.fillText(num(v), x, 640);

  g.fillStyle = "#ff8a4f"; g.font = f(800, 34); g.fillText("pacepath.onrender.com", 72, H - 72);
  const blob = await new Promise((ok) => c.toBlob(ok, "image/png"));

// Pinta el Pasaporte en #pasaporte; «Tu calle» llega después (map-matching en el servidor).

async function pintarPasaporte2(todas, pf, nombre) {
  const lugares = await lugaresDeCarreras(todas);
  const dibujar = (calles) => {
    if (!$("pasaporte")) return null;
    const P = calcularPasaporte(todas, lugares, pf, calles);
    $("pasaporte").innerHTML = htmlPasaporte(P);
    $("compartirPasaporte").onclick = () => { compartirPasaporte(P, nombre);
      fetch("/api/evento", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tipo: "compartir_pasaporte" }) }).catch(() => {}); };
    activarInfoPasaporte();
    return P;
  };
  dibujar(undefined);
  // Tu calle: las calles de siempre alrededor de donde más sales.
  const cuenta = new Map();
  for (const c of todas) { const p = c.puntos?.[0]; if (p) { const k = `${p[0].toFixed(2)},${p[1].toFixed(2)}`; cuenta.set(k, (cuenta.get(k) || 0) + 1); } }
  const centro = [...cuenta.entries()].sort((a, b) => b[1] - a[1])[0]?.[0]?.split(",").map(Number);
  const f = centro ? await frecuentesPara(centro[0], centro[1], true).catch(() => null) : null;
  const P = dibujar(f?.calles || null);
  if (P) avisarLogrosNuevos(P);
}

// ── Perfil: tu Strava en números ────────────────────────────────────────────
// Los totales (4 semanas, año, histórico) son los oficiales de Strava. El resto
// sale de tus carreras con GPS guardadas en este teléfono.
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const ritmo = (s_km) => !isFinite(s_km) || s_km <= 0 ? "–" :
  `${Math.floor(s_km / 60)}:${String(Math.round(s_km % 60)).padStart(2, "0")} /km`;
const lunes = (d) => { const x = new Date(d); const k = (x.getDay() + 6) % 7; x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - k); return x; };
const mesN = (i) => (idioma === "en" ? MESES_EN : MESES)[i];
const fechaCorta = (d) => idioma === "en" ? `${mesN(d.getMonth())} ${d.getDate()}` : `${d.getDate()} ${mesN(d.getMonth())}`;
const localDe = (c) => new Date((c.fecha_local || c.fecha).replace("Z", ""));

// Año elegido: sus totales (carreras con GPS), la comparación con el anterior
// y el promedio semanal.
function kpisAnio(todas, a, anios, promSem, nSem) {
  // El año en curso se compara con el anterior hasta la misma fecha.
  const hoy = new Date(), enCurso = a === hoy.getFullYear();
  const hasta = (c) => !enCurso || (localDe(c).getMonth() * 100 + localDe(c).getDate()) <= (hoy.getMonth() * 100 + hoy.getDate());
  const de = (y, corte) => totalesDe(todas.filter((c) => localDe(c).getFullYear() === y && (!corte || hasta(c))));
  const este = de(a), antes = anios.includes(a - 1) ? de(a - 1, true) : null;
  const cambio = antes && antes.km ? Math.round((este.km - antes.km) / antes.km * 100) : null;
  return `<div class="kpis">${kpi(String(a), { ...este, km: Math.round(este.km) })}
    <div class="kpi"><span>${t("vs {a}", { a: a - 1 })}</span><b>${cambio == null ? "–" : (cambio > 0 ? "+" : "") + cambio + " %"}</b>
      <small>${antes ? t(enCurso ? "{k} km a esta fecha en {a}" : "{k} km en {a}", { k: num(Math.round(antes.km)), a: a - 1 })
        : t("sin carreras en {a}", { a: a - 1 })}</small></div>
    <div class="kpi"><span>${t("Por semana")}</span><b>${num(promSem, 1)} km</b>
      <small>${t("{n} carreras por semana", { n: num(este.carreras / nSem, 1) })}</small></div></div>
    <p class="nota-kpi">${t("Tus carreras con GPS guardadas en este teléfono.")}</p>`;
}

function kpi(titulo, tt) {
  return `<div class="kpi"><span>${titulo}</span><b>${num(tt.km)} km</b>
    <small>${num(tt.carreras)} ${t("carreras")}<br>${num(tt.horas)} h · ${num(tt.desnivel_m)} m ↑</small></div>`;
}

// Barras (una serie): eje y con 3 marcas, barras finas con borde superior
// redondeado, valor al tocar.
function barras(id, datos, { formato, etiquetaX, alto = 120 }) {
  const W = Math.max(280, $("hoja").clientWidth - 40), H = alto, abajo = 18, izq = 30;
  const max = Math.max(1, ...datos.map((d) => d.v));
  const paso = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500].find((p) => max / p <= 4) || 1000;
  const tope = Math.ceil(max / paso) * paso;
  const y = (v) => (H - abajo) - v / tope * (H - abajo - 6);
  const bw = (W - izq) / datos.length, ancho = Math.max(3, Math.min(22, bw - 4));
  let svg = "";
  for (let v = 0; v <= tope; v += paso)
    svg += `<line x1="${izq}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linea)"/>
      <text x="${izq - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--suave)">${num(v)}</text>`;
  datos.forEach((d, i) => {
    const x = izq + i * bw + (bw - ancho) / 2, h = Math.max(0, (H - abajo) - y(d.v)), r = Math.min(4, ancho / 2, h);
    if (d.v > 0) svg += `<path data-i="${i}" fill="var(--acento)" d="M${x},${H - abajo} v${-(h - r)} q0,${-r} ${r},${-r} h${ancho - 2 * r} q${r},0 ${r},${r} v${h - r} z"/>`;
    const et = etiquetaX(d, i);
    if (et) svg += `<text x="${x + ancho / 2}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--suave)">${et}</text>`;
  });
  return `<div class="grafico" id="${id}" data-w="${W}" data-izq="${izq}" data-n="${datos.length}">
    <svg viewBox="0 0 ${W} ${H}" height="${H}">${svg}</svg><div class="tip"></div></div>`;
}

function linea(id, datos, { formato, alto = 110, invertir = false }) {
  const W = Math.max(280, $("hoja").clientWidth - 40), H = alto, abajo = 18, izq = 40;
  const vals = datos.filter((d) => d.v != null).map((d) => d.v);
  if (vals.length < 2) return `<p class="sub">${t("Aún no hay suficientes semanas con carreras.")}</p>`;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const m = Math.max((hi - lo) * 0.15, 5); lo -= m; hi += m;
  // Ritmo: más rápido (menos s/km) arriba.
  const y = (v) => { const f = (v - lo) / (hi - lo); return 6 + (invertir ? f : 1 - f) * (H - abajo - 12); };
  const bw = (W - izq) / datos.length, x = (i) => izq + i * bw + bw / 2;
  let svg = "";
  for (const v of [lo + m, (lo + hi) / 2, hi - m])
    svg += `<line x1="${izq}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linea)"/>
      <text x="${izq - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--suave)">${formato(v).replace(" /km", "")}</text>`;
  const pts = datos.map((d, i) => d.v == null ? null : [x(i), y(d.v)]).filter(Boolean);
  svg += `<path d="${pts.map((p, i) => (i ? "L" : "M") + p.join(",")).join("")}" fill="none" stroke="var(--acento)" stroke-width="2" stroke-linejoin="round"/>`;
  datos.forEach((d, i) => { if (d.v != null) svg += `<circle cx="${x(i)}" cy="${y(d.v)}" r="3" fill="var(--acento)" stroke="var(--panel)" stroke-width="2"/>`; });
  return `<div class="grafico" id="${id}" data-w="${W}" data-izq="${izq}" data-n="${datos.length}">
    <svg viewBox="0 0 ${W} ${H}" height="${H}">${svg}</svg><div class="tip"></div></div>`;
}

function activarGrafico(id, textos) {
  const g = $(id);
  if (!g) return;
  const W = +g.dataset.w, izq = +g.dataset.izq, n = +g.dataset.n, tip = g.querySelector(".tip");
  const mover = (e) => {
    const r = g.getBoundingClientRect(), xv = (e.clientX - r.left) / r.width * W;
    const i = Math.min(n - 1, Math.max(0, Math.floor((xv - izq) / ((W - izq) / n))));
    if (!textos[i]) return;
    tip.textContent = textos[i]; tip.style.display = "block";
    tip.style.left = ((izq + (i + 0.5) * (W - izq) / n) / W * 100) + "%";
    g.querySelectorAll("path[data-i]").forEach((b) => b.style.opacity = +b.dataset.i === i ? 1 : 0.45);
  };
  const salir = () => { tip.style.display = "none"; g.querySelectorAll("path[data-i]").forEach((b) => b.style.opacity = 1); };
  g.addEventListener("pointerdown", mover); g.addEventListener("pointermove", mover);
  g.addEventListener("pointerleave", salir); g.addEventListener("pointerup", () => setTimeout(salir, 1500));
}

// Filtro por año: null = todo el historial.
let anioPerfil = null, perfilGuardado = null;
const totalesDe = (cs) => ({ carreras: cs.length, km: cs.reduce((s, c) => s + c.distancia_m, 0) / 1000,
  horas: Math.round(cs.reduce((s, c) => s + c.tiempo_s, 0) / 360) / 10, desnivel_m: cs.reduce((s, c) => s + (c.desnivel_m || 0), 0) });
async function abrirPerfil(sinSincronizar, reusarPerfil) {
  if (!sinSincronizar) hoja(`<div class="cargando"><div class="rueda"></div>${t("Cargando tu perfil de Strava…")}</div>`);
  const e = await fetch("/api/strava/estado").then((r) => r.json()).catch(() => ({}));
  if (!e.conectado) {
    hoja(`<div class="tipo">${t("Perfil")}</div><h2>${t("Tu historial de carrera")}</h2>
      <p class="pista">${t("Conecta tu Strava para ver tus kilómetros de las últimas semanas, del año y de siempre, tus récords y tus hábitos.")}</p>
      ${STRAVA_CONECTAR()}${AVISO_BETA(e)}`);
    return;
  }
  const pf = reusarPerfil && perfilGuardado ? perfilGuardado
    : await fetch("/api/strava/perfil").then((r) => r.ok ? r.json() : null).catch(() => null);
  perfilGuardado = pf;
  const todas = (await BD.todas()).filter((c) => c.tiempo_s !== undefined);
  if (!sinSincronizar && (necesitaSync() || !todas.length)) sincronizar(e);
  const hoy = new Date(), esteAnio = hoy.getFullYear();
  const anioDe = (c) => localDe(c).getFullYear();
  const anios = [...new Set(todas.map(anioDe))].sort((a, b) => b - a);
  if (anioPerfil && !anios.includes(anioPerfil)) anioPerfil = null;
  const lista = anioPerfil ? todas.filter((c) => anioDe(c) === anioPerfil) : todas;

  // Volumen semanal: las últimas 12 semanas, o las semanas del año elegido
  let sem0, nSem;
  if (anioPerfil) {
    sem0 = lunes(new Date(anioPerfil, 0, 1));
    const finA = anioPerfil === esteAnio ? hoy : new Date(anioPerfil, 11, 31);
    nSem = Math.round((lunes(finA) - sem0) / (7 * 864e5)) + 1;
  } else { sem0 = lunes(hoy); sem0.setDate(sem0.getDate() - 7 * 11); nSem = 12; }
  const semanas = [...Array(nSem)].map((_, k) => { const d = new Date(sem0); d.setDate(d.getDate() + 7 * k);
    return { ini: d, m: 0, s: 0, n: 0 }; });
  for (const c of lista) {
    const k = Math.round((lunes(localDe(c)) - sem0) / (7 * 864e5));    // round: cambios de horario
    if (k >= 0 && k < nSem) { semanas[k].m += c.distancia_m; semanas[k].s += c.tiempo_s; semanas[k].n++; }
  }
  const promSem = semanas.reduce((t, w) => t + w.m, 0) / nSem / 1000;
  // Mes a mes: este año, o el elegido
  const anio = anioPerfil || esteAnio;
  const meses = [...Array(anio === esteAnio ? hoy.getMonth() + 1 : 12)].map(() => ({ m: 0, s: 0, n: 0 }));
  for (const c of todas) { const d = localDe(c); if (d.getFullYear() === anio) {
    const x = meses[d.getMonth()]; x.m += c.distancia_m; x.s += c.tiempo_s; x.n++; } }
  // Ritmo: por semana (últimas 12) o por mes (año elegido)
  const serieRitmo = anioPerfil ? meses : semanas;
  // Récords
  const larga = lista.reduce((a, c) => (!a || c.distancia_m > a.distancia_m ? c : a), null);
  const subida = lista.reduce((a, c) => (!a || c.desnivel_m > a.desnivel_m ? c : a), null);
  const rapida = lista.filter((c) => c.distancia_m >= 5000 && c.tiempo_s > 0)
    .reduce((a, c) => (!a || c.tiempo_s / c.distancia_m < a.tiempo_s / a.distancia_m ? c : a), null);
  const porSemana = {};
  for (const c of lista) { const k = lunes(localDe(c)).toISOString().slice(0, 10); porSemana[k] = (porSemana[k] || 0) + c.distancia_m; }
  const mejorSem = Object.entries(porSemana).sort((a, b) => b[1] - a[1])[0];
  // Rachas de semanas seguidas con al menos una carrera
  const conCarrera = new Set(Object.keys(porSemana));
  let actual = 0, d = lunes(hoy);
  const conRachaActual = !anioPerfil || anioPerfil === esteAnio;
  if (!conCarrera.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 7);   // la semana en curso aún puede llegar
  while (conRachaActual && conCarrera.has(d.toISOString().slice(0, 10))) { actual++; d.setDate(d.getDate() - 7); }
  let maxima = 0, corrida = 0, prev = null;
  for (const k of [...conCarrera].sort()) {
    const t = new Date(k); corrida = prev && (t - prev) / 864e5 === 7 ? corrida + 1 : 1; maxima = Math.max(maxima, corrida); prev = t;
  }
  // Hábitos
  const dias = Array(7).fill(0); lista.forEach((c) => dias[localDe(c).getDay()]++);
  const horas = lista.map((c) => localDe(c).getHours()).sort((a, b) => a - b);
  const dist = lista.map((c) => c.distancia_m).sort((a, b) => a - b);
  const mediana = (a) => a.length ? a[a.length >> 1] : 0;
  const fecha = (c) => c ? localDe(c).toLocaleDateString(idioma === "en" ? "en-US" : "es-CL", { day: "numeric", month: "short", year: "numeric" }) : "";
  const record = (t, v, sub) => `<div class="record"><span>${t}</span><b>${v}</b><small>${sub}</small></div>`;

  hoja(`
    <div class="atleta">${pf?.foto ? `<img src="${esc(pf.foto)}" alt="">` : '<div class="sin-foto"></div>'}
      <div><h2>${esc(pf ? `${pf.nombre} ${pf.apellido}` : e.nombre || t("Tú"))}</h2>
      <small>${esc([pf?.ciudad, pf?.desde ? t("en Strava desde {a}", { a: pf.desde.slice(0, 4) }) : ""].filter(Boolean).join(" · "))}</small></div></div>
    <div class="sync-fila"><p class="pista" id="sync"></p><button class="sec chico" id="actualizarPerfil" type="button">${t("Actualizar")}</button></div>
    ${anios.length > 1 ? `<div class="anios" role="tablist" aria-label="${t("Año")}">
      ${[null, ...anios].map((a) => `<button type="button" class="chip${a === anioPerfil ? " on" : ""}" data-a="${a ?? ""}">${a ?? t("Todo")}</button>`).join("")}</div>` : ""}
    ${anioPerfil ? kpisAnio(todas, anioPerfil, anios, promSem, nSem)
      : pf ? `<div class="kpis">${kpi(t("4 semanas"), pf.recientes)}${kpi(String(anio), pf.anio)}${kpi(t("Histórico"), pf.historico)}</div>`
         : `<p class="aviso">${t("No pude leer tus totales de Strava ahora.")}</p>`}
    ${!anioPerfil && todas.length ? '<div id="pasaporte"></div>' : ""}
    ${lista.length ? `
    <div class="bloque"><h3>${t("Volumen semanal")}</h3>
      <p class="sub">${anioPerfil ? t("Semanas de {a} · promedio {x} km por semana", { a: anioPerfil, x: num(promSem, 1) })
        : t("Últimas 12 semanas · promedio {x} km por semana", { x: num(promSem, 1) })}</p>
      ${barras("g-semanas", semanas.map((w) => ({ v: w.m / 1000 })), { etiquetaX: (_, i) =>
        (anioPerfil ? i % 9 === 0 : i % 3 === 0) ? fechaCorta(semanas[i].ini) : "" })}</div>
    <div class="bloque"><h3>${t("Ritmo medio")}</h3>
      <p class="sub">${t(anioPerfil ? "Por mes, ponderado por distancia (más arriba, más rápido)"
        : "Por semana, ponderado por distancia (más arriba, más rápido)")}</p>
      ${linea("g-ritmo", serieRitmo.map((w) => ({ v: w.m ? w.s / (w.m / 1000) : null })), { formato: ritmo, invertir: true })}</div>
    <div class="bloque"><h3>${t("{a}, mes a mes", { a: anio })}</h3>
      <p class="sub">${t("{k} km en {n} carreras con GPS", { k: num(meses.reduce((s, x) => s + x.m, 0) / 1000), n: num(meses.reduce((s, x) => s + x.n, 0)) })}</p>
      ${barras("g-meses", meses.map((x) => ({ v: x.m / 1000 })), { etiquetaX: (_, i) => mesN(i) })}</div>
    <div class="bloque"><h3>${t("Récords")}</h3><div class="records">
      ${record(t("Más larga"), larga ? `${num(larga.distancia_m / 1000, 1)} km` : "–", fecha(larga))}
      ${record(t("Mejor ritmo (≥5 km)"), rapida ? ritmo(rapida.tiempo_s / (rapida.distancia_m / 1000)) : "–", rapida ? `${num(rapida.distancia_m / 1000, 1)} km · ${fecha(rapida)}` : "")}
      ${record(t("Mayor desnivel"), subida ? `${num(subida.desnivel_m)} m` : "–", fecha(subida))}
      ${record(t("Semana con más km"), mejorSem ? `${num(mejorSem[1] / 1000, 1)} km` : "–", mejorSem ? t("semana del {f}", { f: fechaCorta(new Date(mejorSem[0])) }) : "")}
      ${conRachaActual ? record(t("Racha actual"), `${actual} ${t(actual === 1 ? "semana" : "semanas")}`, t("seguidas corriendo")) : ""}
      ${record(t("Racha máxima"), `${maxima} ${t(maxima === 1 ? "semana" : "semanas")}`, t("seguidas corriendo"))}
    </div></div>
    <div class="bloque"><h3>${t("Hábitos")}</h3><div class="records">
      ${record(t("Día favorito"), (idioma === "en" ? DIAS_EN : DIAS)[dias.indexOf(Math.max(...dias))], `${Math.max(...dias)} ${t("carreras")}`)}
      ${record(t("Hora típica"), `${String(mediana(horas)).padStart(2, "0")}:00`, t("la mitad sale antes"))}
      ${record(t("Distancia típica"), `${num(mediana(dist) / 1000, 1)} km`, t("de {n} carreras", { n: num(lista.length) }))}
      ${record(t(anioPerfil ? "Ritmo del año" : "Ritmo de siempre"), ritmo(lista.reduce((t, c) => t + c.tiempo_s, 0) / (lista.reduce((t, c) => t + c.distancia_m, 0) / 1000)), t("promedio de todas"))}
    </div></div>` : `<p class="pista">${t("Cuando lleguen tus carreras de Strava verás aquí tu volumen, ritmo, récords y hábitos.")}</p>`}
    ${POWERED_STRAVA()}`);
  pintarSync();
  $("actualizarPerfil").onclick = () => sincronizar(e);
  activarGrafico("g-semanas", semanas.map((w) => t("Semana del {f}: {k} km · {n} {c}", { f: fechaCorta(w.ini), k: num(w.m / 1000, 1), n: w.n, c: t(w.n === 1 ? "carrera" : "carreras") })));
  activarGrafico("g-ritmo", anioPerfil
    ? meses.map((x, i) => x.m ? `${mesN(i)} ${anio}: ${ritmo(x.s / (x.m / 1000))}` : "")
    : semanas.map((w) => w.m ? t("Semana del {f}: {r}", { f: fechaCorta(w.ini), r: ritmo(w.s / (w.m / 1000)) }) : ""));
  document.querySelectorAll(".anios .chip").forEach((b) => { b.onclick = () => {
    anioPerfil = b.dataset.a ? +b.dataset.a : null; abrirPerfil(true, true); }; });
  if (!anioPerfil) pintarPasaporte(todas, pf, pf ? `${pf.nombre} ${pf.apellido}`.trim() : e.nombre);
  activarGrafico("g-meses", meses.map((x, i) => t("{m} {a}: {k} km · {n} carreras", { m: mesN(i), a: anio, k: num(x.m / 1000, 1), n: x.n })));
}

// Vuelta de Strava: /#ciudad, /#ciudad-cancelado, /#ciudad-error, /#ciudad-sin-permiso
if (location.hash.startsWith("#ciudad")) {
  const motivo = { "#ciudad-cancelado": t("Cancelaste la conexión con Strava."),
                   "#ciudad-error": t("No se pudo completar la conexión con Strava. Intenta de nuevo."),
                   "#ciudad-limite": t("Strava todavía no deja que más personas conecten PacePath: la app está en revisión. Mientras tanto, las rutas funcionan sin conectar nada."),
                   "#ciudad-sin-permiso": t("Strava quedó conectado, pero sin permiso para leer tus actividades: desconecta y vuelve a conectar marcando ese permiso.") }[location.hash];
  history.replaceState(null, "", location.pathname);
  cambiarVista("ciudad");
  if (motivo) setTimeout(() => abrirCiudad(motivo), 0);
}

// ── Botón ES/EN ─────────────────────────────────────────────────────────────
function aplicarIdioma() {
  document.documentElement.lang = idioma;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.dataset.es ??= el.textContent.trim();
    el.textContent = t(el.dataset.es);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
    el.setAttribute("aria-label", t(el.dataset.i18nAria)); el.title = t(el.dataset.i18nAria); });
  $("botonIdioma").textContent = idioma === "en" ? "ES" : "EN";
  $("botonIdioma").setAttribute("aria-label", idioma === "en" ? "Cambiar a español" : "Switch to English");
  resumirOpciones();
  $("botonNoche").setAttribute("aria-label", t(noche ? "Modo día" : "Modo noche"));
}
$("botonIdioma").onclick = () => {
  idioma = idioma === "en" ? "es" : "en";
  try { localStorage.setItem("pp_lang", JSON.stringify(idioma)); } catch {}
  aplicarIdioma();
  // Lo que está en pantalla se vuelve a pedir/dibujar en el idioma nuevo.
  if (vista === "ciudad") abrirCiudad();
  else if (vista === "perfil") abrirPerfil(true);
  else if (modo === "trazar" && puntos.length > 1) recalcular(null);
  else if (document.body.classList.contains("con-ruta")) $("form").requestSubmit();
  else inicioHoja(t("Elige desde dónde sales: escribe una calle o esquina, usa «Cerca de mí» o toca el mapa."));
};

// Tema y capa iniciales (lo último: usa todo lo de arriba).
aplicarIdioma();
ponerNoche(noche);
medirCabecera();
// ── Comentarios de la beta: se escriben aquí y se mandan por WhatsApp (el
// corredor elige el grupo). Va un poco de contexto para entender el caso.
$("hoja").addEventListener("click", (e) => { if (e.target.closest("[data-comentario]")) abrirComentario(); });
function contextoComentario() {
  const ua = navigator.userAgent, equipo = /iPhone|iPad/.test(ua) ? "iPhone" : /Android/.test(ua) ? "Android" : "computador";
  const app = window.matchMedia("(display-mode: standalone)").matches ? "app" : "navegador";
  const cosas = [t("vista: {v}", { v: { hoy: t("Hoy"), ciudad: t("Mi ciudad"), perfil: t("Perfil") }[vista] || vista })];
  if (vista === "hoy") cosas.push(modo === "trazar" ? t("trazar a mano") : t("sesión «{s}»", { s: $("texto").value }));
  if (vista === "hoy" && $("desde").value) cosas.push(t("desde {d}", { d: $("desde").value }));
  cosas.push(`${equipo} · ${app} · ${idioma.toUpperCase()}`);
  return cosas.join(" · ");
}
function abrirComentario() {
  const d = $("dlgComentario");
  d.querySelector("h3").textContent = t("Enviar comentario");
  d.querySelector("p").textContent = t("¿Qué funcionó, qué no, qué te gustaría? Se abre WhatsApp con tu mensaje: elige el grupo de la beta.");
  d.querySelector("textarea").placeholder = t("Ej.: la ruta de series me mandó por una calle con mucho tráfico…");
  d.querySelector("label span").textContent = t("Incluir lo que estaba haciendo ({c})", { c: contextoComentario() });
  d.querySelector("#enviarComentario").textContent = t("Enviar por WhatsApp");
  d.querySelector("#cancelarComentario").textContent = t("Cancelar");
  d.showModal();
  d.querySelector("textarea").focus();
}
$("cancelarComentario").onclick = () => $("dlgComentario").close();
$("dlgComentario").addEventListener("click", (e) => { if (e.target === $("dlgComentario")) $("dlgComentario").close(); });
$("enviarComentario").onclick = () => {
  const texto = $("dlgComentario").querySelector("textarea").value.trim();
  if (!texto) { $("dlgComentario").querySelector("textarea").focus(); return; }
  const contexto = $("conContexto").checked ? `\n\n(${contextoComentario()})` : "";
  fetch("/api/evento", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tipo: "comentario", detalle: vista }) }).catch(() => {});
  window.open("https://wa.me/?text=" + encodeURIComponent(`PacePath beta — ${texto}${contexto}`), "_blank", "noopener");
  $("dlgComentario").querySelector("textarea").value = "";
  $("dlgComentario").close();
};

// Errores de la interfaz: se cuentan (anónimos, máx. 5 por visita) para arreglarlos.
let erroresEnviados = 0;
const reportarError = (msg) => {
  if (++erroresEnviados > 5 || !msg) return;
  navigator.sendBeacon?.("/api/evento", new Blob([JSON.stringify({ tipo: "error_js", detalle: String(msg).slice(0, 190) })],
    { type: "application/json" }));
};
window.addEventListener("error", (e) => reportarError(e.message));
window.addEventListener("unhandledrejection", (e) => reportarError(e.reason?.message || e.reason));
window.addEventListener("appinstalled", () => fetch("/api/evento", { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ tipo: "instalar" }) }).catch(() => {}));

// App instalable: el service worker (no guarda nada en caché).
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
// Al abrir: la pista con tus sesiones guardadas y recientes (si no vienes de Strava).
if (vista === "hoy" && !document.body.classList.contains("con-ruta"))
  inicioHoja(t("Elige desde dónde sales: escribe una calle o esquina, usa «Cerca de mí» o toca el mapa."));
</script>
</body>
</html>
