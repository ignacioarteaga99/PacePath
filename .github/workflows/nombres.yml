name: Nombres de calle
# Descarga de Overpass los nombres de calle (y puntos de agua/baños) de cada
# comuna y los publica en la Release «nombres». El servidor los baja de ahí.
on:
  workflow_dispatch:
    inputs:
      comunas:
        description: "Comunas separadas por coma"
        required: true
        default: "santiago_centro,providencia,las_condes,nunoa,vitacura,lo_barnechea,maipu,pudahuel,renca,huechuraba,la_cisterna,la_florida,penalolen,puente_alto,san_bernardo,san_bernardo_poniente"
  push:
    paths: [".github/workflows/nombres.yml", "scripts/ci_nombres.py"]

permissions:
  contents: write

concurrency:
  group: nombres
  # Cada ejecución publica todo de nuevo: la última manda y cancela las anteriores.
  cancel-in-progress: true

jobs:
  nombres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      COMUNAS: ${{ inputs.comunas || 'santiago_centro,providencia,las_condes,nunoa,vitacura,lo_barnechea,maipu,pudahuel,renca,huechuraba,la_cisterna,la_florida,penalolen,puente_alto,san_bernardo,san_bernardo_poniente' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Descargar y publicar
        run: |
          gh release view nombres >/dev/null 2>&1 || gh release create nombres \
            --title "Nombres de calle por comuna" --latest=false --target "$GITHUB_SHA" \
            --notes "Generado por el workflow «Nombres de calle». No borrar: el servidor los descarga desde aquí."
          IFS=',' read -ra LISTA <<< "$COMUNAS"
          for c in "${LISTA[@]}"; do
            c="$(echo "$c" | xargs)"; [ -z "$c" ] && continue
            # Si Overpass no responde para una comuna, seguir con las demás (la
            # que falló queda sin nombres nuevos y se puede volver a pedir).
            if ! python scripts/ci_nombres.py "$c" dist | tee -a resumen.txt; then
              echo "::warning title=$c::Overpass no respondió"; echo "- $c: falló (Overpass)" >> resumen.txt; continue
            fi
            gh release upload nombres "dist/$c.nombres.json.gz" --clobber
            sleep 5
          done
          cat resumen.txt >> "$GITHUB_STEP_SUMMARY"
