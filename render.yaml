# Blueprint de Render (plan gratis). En render.com: New → Blueprint → este repo.
#
# Lo mismo que se aprendió con RaceEngine:
#   · 512 MB de RAM: una sola comuna en memoria a la vez (RACEENGINE_MAX_REGIONS).
#   · El disco se borra al dormir (15 min sin uso): los grafos se bajan de la
#     Release «graphs» de RaceEngine y los nombres de la Release «nombres» de
#     PacePath la primera vez que se usan. Nada persistente en disco.
services:
  - type: web
    name: pacepath
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: RACEENGINE_GRAPHS_URL
        value: https://github.com/ignacioarteaga99/RaceEngine/releases/download/graphs
      - key: PACEPATH_NOMBRES_URL
        value: https://github.com/ignacioarteaga99/PacePath/releases/download/nombres
      - key: RACEENGINE_MAX_REGIONS
        value: "1"
      # URL pública: con ella se arma la dirección de vuelta de Strava, que debe
      # coincidir con el «Authorization Callback Domain» de la app de Strava.
      - key: PACEPATH_URL
        value: https://pacepathapp.com
      # Strava (Fase 2). El Client ID es público; el secreto se pega en Render,
      # nunca en el repositorio.
      - key: STRAVA_CLIENT_ID
        value: "289395"
      - key: STRAVA_CLIENT_SECRET
        sync: false
      # Beta: clave del panel /admin (y de /api/uso?clave=…). Invéntala larga y
      # pégala en Render; sin ella, el panel no abre.
      - key: PACEPATH_ADMIN
        sync: false
      # Postgres para el registro del panel /admin (p. ej. Neon gratis). Sin ella
      # el registro vive en /tmp y se borra cada vez que Render duerme.
      - key: DATABASE_URL
        sync: false
      # Mapa propio de Chile en Cloudflare R2 (lo arma .github/workflows/mapa.yml).
      - key: PACEPATH_MAPA_URL
        value: https://mapas.pacepathapp.com
      # Clave de mapas de Esri (ArcGIS Location Platform), sólo mapas base.
      - key: ESRI_API_KEY
        sync: false
      # Link para apoyar PacePath (Ko-fi, Mercado Pago…). Vacío: no hay botón.
      - key: PACEPATH_APORTE_URL
        sync: false
      # Entrar con Google o Microsoft (pacepath/oauth.py). Sin ellas, sólo correo y clave.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      # Correos de verificación y recuperación (pacepath/correo.py). APAGADO hasta
      # tener el remitente support@pacepathapp.com en un servicio SMTP.
      - key: PACEPATH_CORREO_ACTIVO
        value: "0"
      - key: PACEPATH_CORREO_SMTP
        sync: false
      - key: PACEPATH_CORREO_USUARIO
        sync: false
      - key: PACEPATH_CORREO_CLAVE
        sync: false
      - key: PACEPATH_CORREO_DE
        value: "PacePath <support@pacepathapp.com>"
      # A quién avisar de cada cuenta nueva (para habilitarla en la beta).
      - key: PACEPATH_CORREO_AVISOS
        value: "support@pacepathapp.com"
      # «1» cuando Strava apruebe la app (quita el aviso de beta junto al botón).
      - key: PACEPATH_STRAVA_ABIERTO
        value: "0"
